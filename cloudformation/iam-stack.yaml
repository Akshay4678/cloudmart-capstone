AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart IAM Stack

Parameters:

  DBUsername:
    Type: String
    Default: cloudmartadmin

  DBPassword:
    Type: String
    NoEcho: true

  AuthToken:
    Type: String
    NoEcho: true

Resources:

  #################################################
  # AUTHORIZER LAMBDA ROLE
  #################################################

  AuthorizerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudmart-authorizer-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: AuthorizerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: "*"

  #################################################
  # PRODUCT ROLE
  #################################################

  ProductLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudmart-product-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: ProductPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                Resource: "*"

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: "*"

              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: "*"

              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"

  #################################################
  # ORDER ROLE
  #################################################

  OrderLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudmart-order-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: OrderPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: "*"

              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                Resource: "*"

              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: "*"

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: "*"

              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"

  #################################################
  # REPORTING ROLE
  #################################################

  ReportLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudmart-report-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: ReportingPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource: "*"

              - Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                Resource: "*"

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: "*"

              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"

  #################################################
  # SSM PARAMETERS
  #################################################

  DBUsernameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cloudmart/db/username
      Type: String
      Value: !Ref DBUsername

  DBPasswordParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cloudmart/db/password
      Type: SecureString
      Value: !Ref DBPassword

  AuthTokenParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cloudmart/auth/token
      Type: SecureString
      Value: !Ref AuthToken

Outputs:

  AuthorizerRoleArn:
    Value: !GetAtt AuthorizerLambdaRole.Arn
    Export:
      Name: cloudmart-authorizer-role-arn

  ProductRoleArn:
    Value: !GetAtt ProductLambdaRole.Arn
    Export:
      Name: cloudmart-product-role-arn

  OrderRoleArn:
    Value: !GetAtt OrderLambdaRole.Arn
    Export:
      Name: cloudmart-order-role-arn

  ReportRoleArn:
    Value: !GetAtt ReportLambdaRole.Arn
    Export:
      Name: cloudmart-report-role-arn

  DBUsernameParameterName:
    Value: !Ref DBUsernameParameter

  DBPasswordParameterName:
    Value: !Ref DBPasswordParameter

  AuthTokenParameterName:
    Value: !Ref AuthTokenParameter