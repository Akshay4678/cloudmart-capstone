name: Deploy CloudMart Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      ENVIRONMENT_NAME: dev

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. AWS CREDENTIALS
      # ==========================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ==========================================================
      # 3. VERIFY AWS ACCESS
      # ==========================================================
      - name: Verify AWS Access
        run: |
          set -euo pipefail
          echo "=================================================="
          echo "AWS IDENTITY"
          echo "=================================================="
          aws sts get-caller-identity

      # ==========================================================
      # 4. CHECK REQUIRED SECRETS
      # ==========================================================
      - name: Check Required Secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          EMAIL_NOTIFICATION: ${{ secrets.EMAIL_NOTIFICATION }}
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "CHECKING REQUIRED SECRETS"
          echo "=================================================="

          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "ERROR: AWS_ROLE_ARN secret is missing."
            exit 1
          fi

          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: DB_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$EMAIL_NOTIFICATION" ]; then
            echo "ERROR: EMAIL_NOTIFICATION secret is missing."
            exit 1
          fi

          echo "Required secrets are configured."

      # ==========================================================
      # 5. STORE DATABASE PASSWORD IN SSM
      #
      # Order/Product/Report Lambdas read the database password
      # from this environment-specific SecureString.
      # This must exist before any Lambda is invoked.
      # ==========================================================
      - name: Store Database Password in SSM
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail

          aws ssm put-parameter \
            --region "$AWS_REGION" \
            --name "/cloudmart/$ENVIRONMENT_NAME/database/password" \
            --type "SecureString" \
            --value "$DB_PASSWORD" \
            --overwrite

          STORED_PARAMETER=$(aws ssm get-parameter \
            --region "$AWS_REGION" \
            --name "/cloudmart/$ENVIRONMENT_NAME/database/password" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          if [ -z "$STORED_PARAMETER" ] || [ "$STORED_PARAMETER" = "None" ]; then
            echo "ERROR: Database password SSM parameter was not created."
            exit 1
          fi

          echo "Database password SSM parameter created and verified."

      # ==========================================================
      # 29. STORE NOTIFICATION EMAIL IN SSM
      # ==========================================================
      - name: Store Notification Email in SSM
        env:
          EMAIL_NOTIFICATION: ${{ secrets.EMAIL_NOTIFICATION }}
        run: |
          set -euo pipefail

          aws ssm put-parameter \
            --region "$AWS_REGION" \
            --name "/cloudmart/$ENVIRONMENT_NAME/notification-email" \
            --type "String" \
            --value "$EMAIL_NOTIFICATION" \
            --overwrite

          echo "Notification email stored in SSM."

      # ==========================================================
      # 29. INSTALL CFN-LINT
      # ==========================================================
      - name: Install cfn-lint
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install cfn-lint

      # ==========================================================
      # 29. VALIDATE CLOUDFORMATION TEMPLATES
      # ==========================================================
      - name: Validate CloudFormation Templates
        run: |
          set -euo pipefail

          for template in \
            cloudformation/network-stack.yaml \
            cloudformation/data-stack.yaml \
            cloudformation/iam-stack.yaml \
            cloudformation/auth-stack.yaml \
            cloudformation/api-stack.yaml \
            cloudformation/monitoring-stack.yaml
          do
            echo "=================================================="
            echo "VALIDATING $template"
            echo "=================================================="

            cfn-lint \
              --non-zero-exit-code error \
              "$template"

            aws cloudformation validate-template \
              --region "$AWS_REGION" \
              --template-body "file://$template"

            echo "$template validation passed."
          done

      # ==========================================================
      # 29. CHECK SOURCE FILES
      # ==========================================================
      - name: Check Source Files
        run: |
          set -euo pipefail

          required_files=(
            "schema.sql"

            "lambda/authorizer/lambda_function.py"
            "lambda/authorizer/requirements.txt"

            "lambda/product/lambda_function.py"
            "lambda/product/requirements.txt"

            "lambda/order/lambda_function.py"
            "lambda/order/requirements.txt"

            "lambda/order_processor/lambda_function.py"
            "lambda/order_processor/requirements.txt"

            "lambda/report/lambda_function.py"
            "lambda/report/requirements.txt"

            "lambda/customer/lambda_function.py"
            "lambda/customer/requirements.txt"

            "dashboard/app.py"
            "dashboard/requirements.txt"
            "dashboard/cloudmart-dashboard-deploy.sh"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing $file"
              exit 1
            fi
          done

          python -m py_compile \
            lambda/authorizer/lambda_function.py \
            lambda/product/lambda_function.py \
            lambda/order/lambda_function.py \
            lambda/order_processor/lambda_function.py \
            lambda/report/lambda_function.py \
            lambda/customer/lambda_function.py \
            dashboard/app.py

          bash -n dashboard/cloudmart-dashboard-deploy.sh

          echo "All required source files are present and syntax is valid."

      # ==========================================================
      # 29. VERIFY LAMBDA REQUIREMENTS
      # ==========================================================
      - name: Verify Lambda Requirements
        run: |
          set -euo pipefail

          for file in \
            lambda/authorizer/requirements.txt \
            lambda/product/requirements.txt \
            lambda/order/requirements.txt \
            lambda/order_processor/requirements.txt \
            lambda/report/requirements.txt
          do
            echo "===== $file ====="
            cat "$file"
          done

          for file in \
            lambda/authorizer/requirements.txt \
            lambda/product/requirements.txt \
            lambda/order/requirements.txt \
            lambda/order_processor/requirements.txt \
            lambda/report/requirements.txt
          do
            grep -Eiq '^[[:space:]]*PyMySQL([[:space:]]*[<>=!~].*)?([[:space:]]*#.*)?$' "$file" || {
              echo "ERROR: PyMySQL missing from $file"
              exit 1
            }

            grep -Eiq '^[[:space:]]*cryptography([[:space:]]*[<>=!~].*)?([[:space:]]*#.*)?$' "$file" || {
              echo "ERROR: cryptography missing from $file"
              exit 1
            }
          done

          grep -Eiq '^[[:space:]]*cffi([[:space:]]*[<>=!~].*)?([[:space:]]*#.*)?$' \
            lambda/order/requirements.txt || {
              echo "ERROR: cffi missing from Order Lambda."
              exit 1
            }

          grep -Eiq '^[[:space:]]*PyMySQL([[:space:]]*[<>=!~].*)?([[:space:]]*#.*)?$' \
            lambda/customer/requirements.txt || {
            echo "ERROR: PyMySQL missing from Customer Lambda."
            exit 1
          }

          echo "Lambda requirements verified."

      # ==========================================================
      # 29. PACKAGE ALL LAMBDA FUNCTIONS
      # ==========================================================
      - name: Package Lambda Functions
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build/authorizer
          mkdir -p build/product
          mkdir -p build/order
          mkdir -p build/order_processor
          mkdir -p build/report
          mkdir -p build/customer

          # ------------------------------------------------------
          # AUTHORIZER
          # ------------------------------------------------------
          echo "Packaging Authorizer Lambda..."

          cp lambda/authorizer/lambda_function.py build/authorizer/index.py

          python -m pip install \
            --upgrade \
            --no-cache-dir \
            --target build/authorizer \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.13 \
            --only-binary=:all: \
            -r lambda/authorizer/requirements.txt

          test -f build/authorizer/index.py
          test -d build/authorizer/pymysql
          test -d build/authorizer/cryptography

          cd build/authorizer
          zip -r "../authorizer-lambda-${{ github.sha }}.zip" .
          cd ../..

          # ------------------------------------------------------
          # PRODUCT
          # ------------------------------------------------------
          echo "Packaging Product Lambda..."

          cp lambda/product/lambda_function.py build/product/index.py

          python -m pip install \
            --upgrade \
            --no-cache-dir \
            --target build/product \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.13 \
            --only-binary=:all: \
            -r lambda/product/requirements.txt

          test -f build/product/index.py
          test -d build/product/pymysql
          test -d build/product/cryptography

          cd build/product
          zip -r "../product-lambda-${{ github.sha }}.zip" .
          cd ../..

          # ------------------------------------------------------
          # ORDER
          # ------------------------------------------------------
          echo "Packaging Order Lambda..."

          cp lambda/order/lambda_function.py build/order/index.py
          cp schema.sql build/order/schema.sql

          python -m pip install \
            --upgrade \
            --no-cache-dir \
            --target build/order \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.13 \
            --only-binary=:all: \
            -r lambda/order/requirements.txt

          test -f build/order/index.py
          test -f build/order/schema.sql
          test -d build/order/pymysql
          test -d build/order/cryptography
          test -d build/order/cffi
          test -f build/order/_cffi_backend*.so

          cd build/order
          zip -r "../order-lambda-${{ github.sha }}.zip" .
          cd ../..

          # ------------------------------------------------------
          # ORDER PROCESSOR
          # ------------------------------------------------------
          echo "Packaging Order Processor Lambda..."

          cp lambda/order_processor/lambda_function.py build/order_processor/index.py

          python -m pip install \
            --upgrade \
            --no-cache-dir \
            --target build/order_processor \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.13 \
            --only-binary=:all: \
            -r lambda/order_processor/requirements.txt \
            cffi==1.17.1

          test -f build/order_processor/index.py
          test -d build/order_processor/pymysql
          test -d build/order_processor/cryptography
          test -d build/order_processor/cffi
          test -f build/order_processor/_cffi_backend*.so

          cd build/order_processor
          zip -r "../order-processor-${{ github.sha }}.zip" .
          cd ../..

          # ------------------------------------------------------
          # CUSTOMER
          # ------------------------------------------------------
          echo "Packaging Customer Lambda..."

          cp lambda/customer/lambda_function.py build/customer/index.py

          python -m pip install \
            --upgrade \
            --no-cache-dir \
            --target build/customer \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.13 \
            --only-binary=:all: \
            -r lambda/customer/requirements.txt

          test -f build/customer/index.py
          test -d build/customer/pymysql

          cd build/customer
          zip -r "../customer-lambda-${{ github.sha }}.zip" .
          cd ../..

          # ------------------------------------------------------
          # REPORT
          # ------------------------------------------------------
          echo "Packaging Report Lambda..."

          cp lambda/report/lambda_function.py build/report/index.py

          python -m pip install \
            --upgrade \
            --no-cache-dir \
            --target build/report \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.13 \
            --only-binary=:all: \
            -r lambda/report/requirements.txt

          test -f build/report/index.py
          test -d build/report/pymysql
          test -d build/report/cryptography

          cd build/report
          zip -r "../report-lambda-${{ github.sha }}.zip" .
          cd ../..

          echo "All Lambda packages created."

      # ==========================================================
      # 29. VERIFY PACKAGES
      # ==========================================================
      - name: Verify Lambda Packages
        run: |
          set -euo pipefail

          for zip_file in \
            "build/authorizer-lambda-${{ github.sha }}.zip" \
            "build/product-lambda-${{ github.sha }}.zip" \
            "build/order-lambda-${{ github.sha }}.zip" \
            "build/order-processor-${{ github.sha }}.zip" \
            "build/report-lambda-${{ github.sha }}.zip" \
            "build/customer-lambda-${{ github.sha }}.zip"
          do
            if [ ! -s "$zip_file" ]; then
              echo "ERROR: Missing or empty package: $zip_file"
              exit 1
            fi
          done

          unzip -l "build/order-lambda-${{ github.sha }}.zip" | grep -q "index.py"
          unzip -l "build/order-lambda-${{ github.sha }}.zip" | grep -q "schema.sql"
          unzip -l "build/order-lambda-${{ github.sha }}.zip" | grep -qi "pymysql"
          unzip -l "build/order-lambda-${{ github.sha }}.zip" | grep -qi "cryptography"
          unzip -l "build/order-lambda-${{ github.sha }}.zip" | grep -qi "cffi"

          unzip -l "build/authorizer-lambda-${{ github.sha }}.zip" | grep -q "index.py"
          unzip -l "build/product-lambda-${{ github.sha }}.zip" | grep -q "index.py"
          unzip -l "build/order-processor-${{ github.sha }}.zip" | grep -q "index.py"
          unzip -l "build/report-lambda-${{ github.sha }}.zip" | grep -q "index.py"
          unzip -l "build/customer-lambda-${{ github.sha }}.zip" | grep -q "index.py"
          unzip -l "build/customer-lambda-${{ github.sha }}.zip" | grep -qi "pymysql"

          echo "All Lambda packages verified."

      # ==========================================================
      # 29. DEPLOY NETWORK
      # ==========================================================
      - name: Deploy Network Stack
        id: deploy_network
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "DEPLOYING NETWORK STACK"
          echo "=================================================="

          aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name cloudmart-network-stack \
            --template-file cloudformation/network-stack.yaml \
            --parameter-overrides \
              "EnvironmentName=$ENVIRONMENT_NAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

          echo "Network stack deployment completed."

      - name: Show Network Stack Errors
        if: failure() && steps.deploy_network.outcome == 'failure'
        run: |
          aws cloudformation describe-stack-events \
            --region "$AWS_REGION" \
            --stack-name cloudmart-network-stack\
            --query "StackEvents[0:40].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table || true

      # ==========================================================
      # 29. DEPLOY DATA
      #
      # REQUIRED BEFORE IAM because IAM imports:
      # cloudmart-reports-bucket-arn
      # ==========================================================
      - name: Deploy Data Stack
        id: deploy_data
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "DEPLOYING DATA STACK"
          echo "=================================================="

          aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name cloudmart-data-stack \
            --template-file cloudformation/data-stack.yaml \
            --parameter-overrides \
              "EnvironmentName=$ENVIRONMENT_NAME" \
              "DBPassword=$DB_PASSWORD" \
            --no-fail-on-empty-changeset

          echo "Data stack deployment completed."

      - name: Show Data Stack Errors
        if: failure() && steps.deploy_data.outcome == 'failure'
        run: |
          aws cloudformation describe-stack-events \
            --region "$AWS_REGION" \
            --stack-name cloudmart-data-stack \
            --query "StackEvents[0:60].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table || true

      # ==========================================================
      # 29. DEPLOY IAM
      #
      # DATA MUST EXIST FIRST because iam-stack.yaml imports:
      # cloudmart-reports-bucket-arn
      # ==========================================================
      - name: Deploy IAM Stack
        id: deploy_iam
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "DEPLOYING IAM STACK"
          echo "=================================================="

          aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name cloudmart-iam-stack \
            --template-file cloudformation/iam-stack.yaml \
            --parameter-overrides \
              "EnvironmentName=$ENVIRONMENT_NAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

          echo "IAM stack deployment completed."

      - name: Show IAM Stack Errors
        if: failure() && steps.deploy_iam.outcome == 'failure'
        run: |
          aws cloudformation describe-stack-events \
            --region "$AWS_REGION" \
            --stack-name cloudmart-iam-stack \
            --query "StackEvents[0:60].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table || true

      # ==========================================================
      # 29. GET LAMBDA ARTIFACT BUCKET
      # ==========================================================
      - name: Get Lambda Artifact Bucket
        id: lambda_bucket
        run: |
          set -euo pipefail

          BUCKET=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-data-stack \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaBucket'].OutputValue" \
            --output text)

          if [ -z "$BUCKET" ] || [ "$BUCKET" = "None" ]; then
            echo "ERROR: Lambda artifact bucket not found."
            exit 1
          fi

          echo "Lambda artifact bucket: $BUCKET"
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 29. VERIFY LAMBDA ARTIFACT BUCKET EXPORT
      # ==========================================================
      - name: Verify Lambda Artifact Bucket Export
        run: |
          set -euo pipefail

          WORKFLOW_BUCKET="${{ steps.lambda_bucket.outputs.bucket }}"

          EXPORTED_BUCKET=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='cloudmart-lambda-bucket-${ENVIRONMENT_NAME}'].Value" \
            --output text)

          if [ -z "$EXPORTED_BUCKET" ] || [ "$EXPORTED_BUCKET" = "None" ]; then
            echo "ERROR: CloudFormation export cloudmart-lambda-bucket-${ENVIRONMENT_NAME} was not found."
            exit 1
          fi

          if [ "$WORKFLOW_BUCKET" != "$EXPORTED_BUCKET" ]; then
            echo "ERROR: Lambda artifact bucket mismatch."
            echo "Workflow bucket : $WORKFLOW_BUCKET"
            echo "Exported bucket : $EXPORTED_BUCKET"
            exit 1
          fi

          echo "Lambda artifact bucket verified."
          echo "Bucket: $WORKFLOW_BUCKET"

      # ==========================================================
      # 29. STORE LAMBDA ARTIFACT BUCKET IN SSM
      # ==========================================================
      - name: Store Lambda Artifact Bucket in SSM
        run: |
          set -euo pipefail

          BUCKET="${{ steps.lambda_bucket.outputs.bucket }}"

          aws ssm put-parameter \
            --region "$AWS_REGION" \
            --name "/cloudmart/$ENVIRONMENT_NAME/lambda-artifact-bucket" \
            --type "String" \
            --value "$BUCKET" \
            --overwrite

          STORED_BUCKET=$(aws ssm get-parameter \
            --region "$AWS_REGION" \
            --name "/cloudmart/$ENVIRONMENT_NAME/lambda-artifact-bucket" \
            --query "Parameter.Value" \
            --output text)

          if [ "$STORED_BUCKET" != "$BUCKET" ]; then
            echo "ERROR: SSM Lambda artifact bucket verification failed."
            exit 1
          fi

          echo "Lambda artifact bucket stored and verified in SSM."

      # ==========================================================
      # 29. UPLOAD AND VERIFY AUTHORIZER PACKAGE
      # ==========================================================
      - name: Upload Authorizer Lambda
        run: |
          set -euo pipefail

          ZIP_FILE="build/authorizer-lambda-${{ github.sha }}.zip"
          S3_KEY="auth/authorizer-lambda-${{ github.sha }}.zip"
          BUCKET="${{ steps.lambda_bucket.outputs.bucket }}"

          test -s "$ZIP_FILE"

          aws s3 cp "$ZIP_FILE" "s3://$BUCKET/$S3_KEY" --region "$AWS_REGION"

          aws s3api head-object \
            --region "$AWS_REGION" \
            --bucket "$BUCKET" \
            --key "$S3_KEY"

          echo "Authorizer Lambda uploaded and verified: s3://$BUCKET/$S3_KEY"

      # ==========================================================
      # 29. UPLOAD AND VERIFY PRODUCT
      # ==========================================================
      - name: Upload Product Lambda
        run: |
          set -euo pipefail

          ZIP_FILE="build/product-lambda-${{ github.sha }}.zip"
          S3_KEY="product/product-lambda-${{ github.sha }}.zip"
          BUCKET="${{ steps.lambda_bucket.outputs.bucket }}"

          test -s "$ZIP_FILE"

          aws s3 cp "$ZIP_FILE" "s3://$BUCKET/$S3_KEY" --region "$AWS_REGION"

          aws s3api head-object \
            --region "$AWS_REGION" \
            --bucket "$BUCKET" \
            --key "$S3_KEY"

          echo "Product Lambda uploaded and verified: s3://$BUCKET/$S3_KEY"

      # ==========================================================
      # 29. UPLOAD AND VERIFY ORDER
      # ==========================================================
      - name: Upload Order Lambda
        run: |
          set -euo pipefail

          ZIP_FILE="build/order-lambda-${{ github.sha }}.zip"
          S3_KEY="order/order-lambda-${{ github.sha }}.zip"
          BUCKET="${{ steps.lambda_bucket.outputs.bucket }}"

          test -s "$ZIP_FILE"

          aws s3 cp "$ZIP_FILE" "s3://$BUCKET/$S3_KEY" --region "$AWS_REGION"

          aws s3api head-object \
            --region "$AWS_REGION" \
            --bucket "$BUCKET" \
            --key "$S3_KEY"

          echo "Order Lambda uploaded and verified: s3://$BUCKET/$S3_KEY"

      # ==========================================================
      # 29. UPLOAD AND VERIFY ORDER PROCESSOR
      # ==========================================================
      - name: Upload Order Processor Lambda
        run: |
          set -euo pipefail

          ZIP_FILE="build/order-processor-${{ github.sha }}.zip"
          S3_KEY="order-processor/order-processor-${{ github.sha }}.zip"
          BUCKET="${{ steps.lambda_bucket.outputs.bucket }}"

          test -s "$ZIP_FILE"

          aws s3 cp "$ZIP_FILE" "s3://$BUCKET/$S3_KEY" --region "$AWS_REGION"

          aws s3api head-object \
            --region "$AWS_REGION" \
            --bucket "$BUCKET" \
            --key "$S3_KEY"

          echo "Order Processor Lambda uploaded and verified: s3://$BUCKET/$S3_KEY"

      # ==========================================================
      # 29. UPLOAD AND VERIFY REPORT
      # ==========================================================
      - name: Upload Report Lambda
        run: |
          set -euo pipefail

          ZIP_FILE="build/report-lambda-${{ github.sha }}.zip"
          S3_KEY="report/report-lambda-${{ github.sha }}.zip"
          BUCKET="${{ steps.lambda_bucket.outputs.bucket }}"

          test -s "$ZIP_FILE"

          aws s3 cp "$ZIP_FILE" "s3://$BUCKET/$S3_KEY" --region "$AWS_REGION"

          aws s3api head-object \
            --region "$AWS_REGION" \
            --bucket "$BUCKET" \
            --key "$S3_KEY"

          echo "Report Lambda uploaded and verified: s3://$BUCKET/$S3_KEY"

      # ==========================================================
      # 29. UPLOAD AND VERIFY CUSTOMER LAMBDA
      # ==========================================================
      - name: Upload Customer Lambda
        run: |
          set -euo pipefail

          ZIP_FILE="build/customer-lambda-${{ github.sha }}.zip"
          S3_KEY="customer/customer-lambda-${{ github.sha }}.zip"
          BUCKET="${{ steps.lambda_bucket.outputs.bucket }}"

          test -s "$ZIP_FILE"

          aws s3 cp "$ZIP_FILE" "s3://$BUCKET/$S3_KEY" --region "$AWS_REGION"

          aws s3api head-object \
            --region "$AWS_REGION" \
            --bucket "$BUCKET" \
            --key "$S3_KEY"

          echo "Customer Lambda uploaded and verified: s3://$BUCKET/$S3_KEY"

      # ==========================================================
      # 29. VERIFY ALL LAMBDA ARTIFACTS BEFORE CLOUDFORMATION
      # ==========================================================
      - name: Verify All Lambda Artifacts
        run: |
          set -euo pipefail

          BUCKET="${{ steps.lambda_bucket.outputs.bucket }}"
          SHA="${{ github.sha }}"

          ARTIFACTS=(
            "auth/authorizer-lambda-${SHA}.zip"
            "product/product-lambda-${SHA}.zip"
            "customer/customer-lambda-${SHA}.zip"
            "order/order-lambda-${SHA}.zip"
            "order-processor/order-processor-${SHA}.zip"
            "report/report-lambda-${SHA}.zip"
          )

          echo "=================================================="
          echo "VERIFYING ALL LAMBDA ARTIFACTS"
          echo "=================================================="

          for KEY in "${ARTIFACTS[@]}"; do
            echo "Checking: s3://$BUCKET/$KEY"

            aws s3api head-object \
              --region "$AWS_REGION" \
              --bucket "$BUCKET" \
              --key "$KEY" \
              >/dev/null

            echo "Verified: $KEY"
          done

          echo "All Lambda artifacts exist in the exact S3 keys expected by CloudFormation."

      # ==========================================================
      # 29. UPLOAD DASHBOARD DEPLOYMENT SCRIPT
      #
      # The Network Stack EC2 UserData is intentionally kept below
      # the EC2 16 KB UserData limit. The full dashboard deployment
      # script is stored in the Lambda artifact bucket and downloaded
      # by EC2 after the infrastructure and SSM parameter exist.
      # ==========================================================
      - name: Upload Dashboard Deployment Script
        run: |
          set -euo pipefail

          SCRIPT_FILE="dashboard/cloudmart-dashboard-deploy.sh"
          DASHBOARD_BUCKET="${{ steps.lambda_bucket.outputs.bucket }}"

          test -s "$SCRIPT_FILE"
          bash -n "$SCRIPT_FILE"

          aws s3 cp \
            "$SCRIPT_FILE" \
            "s3://$DASHBOARD_BUCKET/dashboard/cloudmart-dashboard-deploy.sh" \
            --region "$AWS_REGION"

          echo "Dashboard deployment script uploaded."

      # ==========================================================
      # 29. PACKAGE DASHBOARD
      # ==========================================================
      - name: Package Dashboard
        run: |
          set -euo pipefail

          rm -rf build/dashboard
          mkdir -p build/dashboard

          cp dashboard/app.py build/dashboard/app.py
          cp dashboard/requirements.txt build/dashboard/requirements.txt

          python -m py_compile build/dashboard/app.py

          cd build/dashboard
          zip -r "../cloudmart-dashboard-${{ github.sha }}.zip" .
          cd ../..

          test -s "build/cloudmart-dashboard-${{ github.sha }}.zip"

          echo "Dashboard package created."

      # ==========================================================
      # 29. UPLOAD DASHBOARD
      # ==========================================================
      - name: Upload Dashboard Package
        run: |
          set -euo pipefail

          DASHBOARD_BUCKET="${{ steps.lambda_bucket.outputs.bucket }}"
          DASHBOARD_ZIP="build/cloudmart-dashboard-${{ github.sha }}.zip"

          aws s3 cp "$DASHBOARD_ZIP" \
            "s3://$DASHBOARD_BUCKET/dashboard/cloudmart-dashboard-${{ github.sha }}.zip"

          aws s3 cp "$DASHBOARD_ZIP" \
            "s3://$DASHBOARD_BUCKET/dashboard/cloudmart-dashboard.zip"

          echo "Dashboard package uploaded."

      # ==========================================================
      # 29. DEPLOY AUTH
      #
      # AUTH REQUIRES:
      # - Network exports
      # - Data exports
      # - IAM role export
      # - Authorizer ZIP in S3
      # ==========================================================
      - name: Deploy Auth Stack
        id: deploy_auth
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "DEPLOYING AUTH STACK"
          echo "=================================================="

          aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name cloudmart-auth-stack \
            --template-file cloudformation/auth-stack.yaml \
            --parameter-overrides \
              "EnvironmentName=$ENVIRONMENT_NAME" \
              "DBPassword=$DB_PASSWORD" \
              "CodeVersion=${{ github.sha }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

          echo "Auth stack deployment completed."

      - name: Show Auth Stack Errors
        if: failure() && steps.deploy_auth.outcome == 'failure'
        run: |
          aws cloudformation describe-stack-events \
            --region "$AWS_REGION" \
            --stack-name cloudmart-auth-stack \
            --query "StackEvents[0:60].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table || true

      # ==========================================================
      # 29. DEPLOY APPLICATION
      #
      # API REQUIRES:
      # - Network exports
      # - Data exports
      # - IAM role exports
      # - Auth authorizer export
      # - Lambda ZIPs in S3
      # ==========================================================
      - name: Deploy Application Stack
        id: deploy_application
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "DEPLOYING APPLICATION STACK"
          echo "=================================================="

          aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name cloudmart-api-stack \
            --template-file cloudformation/api-stack.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              "CodeVersion=${{ github.sha }}" \
              "EnvironmentName=$ENVIRONMENT_NAME" \
            --no-fail-on-empty-changeset

          echo "Application stack deployment completed."

      - name: Show Application Stack Errors
        if: failure() && steps.deploy_application.outcome == 'failure'
        run: |
          aws cloudformation describe-stack-events \
            --region "$AWS_REGION" \
            --stack-name cloudmart-api-stack \
            --query "StackEvents[0:80].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table || true

      # ==========================================================
      # 29. UPLOAD DASHBOARD DATABASE HOST CONFIG
      # ==========================================================
      - name: Upload Dashboard Database Host Config
        run: |
          set -euo pipefail

          DB_HOST=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-data-stack \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseEndpoint'].OutputValue" \
            --output text)

          DASHBOARD_BUCKET="${{ steps.lambda_bucket.outputs.bucket }}"

          if [ -z "$DB_HOST" ] || [ "$DB_HOST" = "None" ]; then
            echo "ERROR: DatabaseEndpoint output not found."
            exit 1
          fi

          printf '%s\n' "$DB_HOST" > /tmp/cloudmart-db-host.txt

          aws s3 cp /tmp/cloudmart-db-host.txt \
            "s3://$DASHBOARD_BUCKET/dashboard/db-host.txt"

          rm -f /tmp/cloudmart-db-host.txt

          echo "Dashboard database host configuration uploaded."

      # ==========================================================
      # 29. INITIALIZE RDS DATABASE SCHEMA
      # ==========================================================
      - name: Initialize RDS Database Schema
        id: initialize_schema
        run: |
          set -euo pipefail

          FUNCTION_NAME="cloudmart-order-${ENVIRONMENT_NAME}"

          cat > /tmp/schema-init.json <<'EOF'
          {
            "action": "initialize_schema"
          }
          EOF

          rm -f /tmp/schema-init-response.json

          aws lambda invoke \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --payload fileb:///tmp/schema-init.json \
            --cli-binary-format raw-in-base64-out \
            /tmp/schema-init-response.json

          cat /tmp/schema-init-response.json

          if grep -qi '"FunctionError"' /tmp/schema-init-response.json; then
            echo "ERROR: Lambda reported a FunctionError."
            exit 1
          fi

          if grep -q '"statusCode"[[:space:]]*:[[:space:]]*500' /tmp/schema-init-response.json; then
            echo "ERROR: Database schema initialization returned HTTP 500."
            exit 1
          fi

          if grep -q '"statusCode"[[:space:]]*:[[:space:]]*400' /tmp/schema-init-response.json; then
            echo "ERROR: Database schema initialization returned HTTP 400."
            exit 1
          fi

          if ! grep -q '"statusCode"[[:space:]]*:[[:space:]]*200' /tmp/schema-init-response.json; then
            echo "ERROR: Did not receive successful schema initialization response."
            exit 1
          fi

          echo "Database schema initialized successfully."

      # ==========================================================
      # 29. DEPLOY MONITORING
      #
      # Monitoring imports Data/API outputs, so it must be LAST.
      # ==========================================================
      - name: Deploy Monitoring Stack
        id: deploy_monitoring
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "DEPLOYING MONITORING STACK"
          echo "=================================================="

          aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name cloudmart-monitoring-stack \
            --template-file cloudformation/monitoring-stack.yaml \
            --parameter-overrides \
              "EnvironmentName=$ENVIRONMENT_NAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

          echo "Monitoring stack deployment completed."

      - name: Show Monitoring Stack Errors
        if: failure() && steps.deploy_monitoring.outcome == 'failure'
        run: |
          aws cloudformation describe-stack-events \
            --region "$AWS_REGION" \
            --stack-name cloudmart-monitoring-stack \
            --query "StackEvents[0:80].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table || true

      # ==========================================================
      # 29. GET MILESTONE 5 OUTPUTS
      # ==========================================================
      - name: Get Milestone 5 Outputs
        id: milestone5_outputs
        run: |
          set -euo pipefail

          REPORTS_BUCKET=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-data-stack \
            --query "Stacks[0].Outputs[?OutputKey=='ReportsBucket'].OutputValue" \
            --output text)

          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-network-stack \
            --query "Stacks[0].Outputs[?OutputKey=='EC2InstanceId'].OutputValue" \
            --output text)

          DB_HOST=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-data-stack \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseEndpoint'].OutputValue" \
            --output text)

          PUBLIC_IP=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-network-stack \
            --query "Stacks[0].Outputs[?OutputKey=='EC2PublicIP'].OutputValue" \
            --output text)

          for value in "$REPORTS_BUCKET" "$INSTANCE_ID" "$DB_HOST" "$PUBLIC_IP"; do
            if [ -z "$value" ] || [ "$value" = "None" ]; then
              echo "ERROR: Required Milestone 5 CloudFormation output is missing."
              exit 1
            fi
          done

          echo "reports_bucket=$REPORTS_BUCKET" >> "$GITHUB_OUTPUT"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "db_host=$DB_HOST" >> "$GITHUB_OUTPUT"
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

          echo "Reports bucket: $REPORTS_BUCKET"
          echo "EC2 instance: $INSTANCE_ID"
          echo "EC2 public IP: $PUBLIC_IP"

      # ==========================================================
      # 29. VERIFY DAILY REPORT SCHEDULE
      # ==========================================================
      - name: Verify Daily Report Schedule
        run: |
          set -euo pipefail

          RULE_NAME="cloudmart-daily-report-rule-${ENVIRONMENT_NAME}"

          RULE_STATE=$(aws events describe-rule \
            --region "$AWS_REGION" \
            --name "$RULE_NAME" \
            --query "State" \
            --output text)

          SCHEDULE=$(aws events describe-rule \
            --region "$AWS_REGION" \
            --name "$RULE_NAME" \
            --query "ScheduleExpression" \
            --output text)

          TARGET_COUNT=$(aws events list-targets-by-rule \
            --region "$AWS_REGION" \
            --rule "$RULE_NAME" \
            --query "length(Targets)" \
            --output text)

          echo "Report rule: $RULE_NAME"
          echo "State: $RULE_STATE"
          echo "Schedule: $SCHEDULE"
          echo "Target count: $TARGET_COUNT"

          if [ "$RULE_STATE" != "ENABLED" ]; then
            echo "ERROR: Daily report EventBridge rule is not enabled."
            exit 1
          fi

          if [ "$TARGET_COUNT" -lt 1 ]; then
            echo "ERROR: Daily report EventBridge rule has no target."
            exit 1
          fi

          echo "Daily report schedule verification passed."

      # ==========================================================
      # 30. VERIFY MONITORING
      # ==========================================================
      - name: Verify Milestone 5 Monitoring
        run: |
          set -euo pipefail

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-monitoring-stack \
            --query "Stacks[0].StackStatus" \
            --output text)

          if [ "$STACK_STATUS" != "CREATE_COMPLETE" ] && \
             [ "$STACK_STATUS" != "UPDATE_COMPLETE" ]; then
            echo "ERROR: Monitoring stack status is $STACK_STATUS"
            exit 1
          fi

          DASHBOARD_NAME="cloudmart-operations-${ENVIRONMENT_NAME}"

          echo "Checking CloudWatch dashboard: $DASHBOARD_NAME"

          aws cloudwatch get-dashboard \
            --region "$AWS_REGION" \
            --dashboard-name "$DASHBOARD_NAME" \
            >/dev/null

          ALARM_COUNT=$(aws cloudformation list-stack-resources \
            --region "$AWS_REGION" \
            --stack-name cloudmart-monitoring-stack \
            --query "length(StackResourceSummaries[?ResourceType=='AWS::CloudWatch::Alarm'])" \
            --output text)

          echo "CloudWatch dashboard: $DASHBOARD_NAME"
          echo "CloudWatch alarms: $ALARM_COUNT"

          if [ "$ALARM_COUNT" -lt 4 ]; then
            echo "ERROR: Expected at least four CloudWatch alarms."
            exit 1
          fi

          echo "Monitoring verification passed."

      # ==========================================================
      # 31. GET API URL
      # ==========================================================
      - name: Get API URL
        id: api_url
        run: |
          set -euo pipefail

          API_URL=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-api-stack \
            --query "Stacks[0].Outputs[?OutputKey=='ApiInvokeUrl'].OutputValue" \
            --output text)

          if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then
            echo "ERROR: API URL not found."
            exit 1
          fi

          echo "url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "API URL: $API_URL"

      # ==========================================================
      # 32. FINAL STATUS
      # ==========================================================
      - name: Final CloudFormation Status
        if: always()
        run: |
          echo "=================================================="
          echo "FINAL CLOUDMART STACK STATUS"
          echo "=================================================="

          for stack in \
            cloudmart-network-stack \
            cloudmart-data-stack \
            cloudmart-iam-stack \
            cloudmart-auth-stack \
            cloudmart-api-stack \
            cloudmart-monitoring-stack
          do
            echo ""
            echo "===== $stack ====="

            aws cloudformation describe-stacks \
              --region "$AWS_REGION" \
              --stack-name "$stack" \
              --query "Stacks[0].[StackName,StackStatus]" \
              --output table || true
          done

          echo ""
          echo "=================================================="
          echo "CloudMart deployment workflow finished."
          echo "=================================================="

          if [ -n "${{ steps.milestone5_outputs.outputs.public_ip }}" ]; then
            echo "Dashboard: http://${{ steps.milestone5_outputs.outputs.public_ip }}"
          fi

          if [ -n "${{ steps.api_url.outputs.url }}" ]; then
            echo "API: ${{ steps.api_url.outputs.url }}"
          fi
