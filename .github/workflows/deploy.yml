name: Deploy CloudMart Infrastructure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      #################################################
      # CHECKOUT
      #################################################

      - name: Checkout Repository
        uses: actions/checkout@v4


      #################################################
      # AWS CREDENTIALS
      #################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1


      #################################################
      # VERIFY AWS ACCESS
      #################################################

      - name: Verify AWS Access
        run: |
          aws sts get-caller-identity


      #################################################
      # INSTALL CFN-LINT
      #################################################

      - name: Install cfn-lint
        run: |
          pip install cfn-lint


      #################################################
      # VALIDATE NETWORK STACK
      #################################################

      - name: Validate Network Stack
        run: |
          cfn-lint --non-zero-exit-code error \
            cloudformation/network-stack.yaml

      - name: CloudFormation Validate Network Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml


      #################################################
      # VALIDATE DATA STACK
      #################################################

      - name: Print Data Stack File
        run: |
          cat cloudformation/data-stack.yaml

      - name: CloudFormation Validate Data Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml


      #################################################
      # VALIDATE IAM STACK
      #################################################

      - name: CloudFormation Validate IAM Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml


      #################################################
      # VALIDATE API STACK
      #################################################

      - name: CloudFormation Validate API Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/api-stack.yaml


      #################################################
      # DEPLOY NETWORK STACK
      #################################################

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --stack-name cloudmart-network-stack \
            --template-file cloudformation/network-stack.yaml \
            --capabilities CAPABILITY_NAMED_IAM


      #################################################
      # DEPLOY DATA STACK
      #################################################

      - name: Deploy Data Stack
        run: |
          aws cloudformation deploy \
            --stack-name cloudmart-data-stack \
            --template-file cloudformation/data-stack.yaml \
            --parameter-overrides \
              "DBPassword=${{ secrets.DB_PASSWORD }}"


      #################################################
      # SHOW DATA STACK ERRORS
      #################################################

      - name: Show Data Stack Errors
        if: failure()
        run: |
          echo "===== DATA STACK EVENTS ====="

          aws cloudformation describe-stack-events \
            --stack-name cloudmart-data-stack \
            --query "StackEvents[0:20].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table


      #################################################
      # DEPLOY IAM STACK
      #################################################

      - name: Deploy IAM Stack
        run: |
          aws cloudformation deploy \
            --stack-name cloudmart-iam-stack \
            --template-file cloudformation/iam-stack.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              "DBUsername=cloudmartadmin" \
              "DBPassword=${{ secrets.DB_PASSWORD }}" \
              "AuthToken=${{ secrets.AUTH_TOKEN }}"


      #################################################
      # DEPLOY AUTH STACK
      #################################################

      - name: Deploy Auth Stack
        run: |
          aws cloudformation deploy \
            --stack-name cloudmart-auth-stack \
            --template-file cloudformation/auth-stack.yaml \
            --capabilities CAPABILITY_NAMED_IAM


      #################################################
      # CHECK LAMBDA SOURCE FILES
      #################################################

      - name: Check Lambda Source Files
        run: |
          echo "===== PRODUCT LAMBDA ====="
          ls -la lambda/product/

          echo "===== ORDER PROCESSOR LAMBDA ====="
          ls -la lambda/order_processor/


      #################################################
      # PACKAGE LAMBDA FUNCTIONS
      #################################################

      - name: Package Lambda Functions
        run: |
          rm -rf build

          mkdir -p build/product
          mkdir -p build/order_processor


          #################################################
          # PRODUCT LAMBDA
          #################################################

          cp lambda/product/lambda_function.py \
            build/product/index.py

          pip install \
            -r lambda/product/requirements.txt \
            -t build/product

          cd build/product

          zip -r ../product-lambda-${{ github.sha }}.zip .

          cd ../..


          #################################################
          # ORDER PROCESSOR LAMBDA
          #################################################

          cp lambda/order_processor/lambda_function.py \
            build/order_processor/index.py

          pip install \
            -r lambda/order_processor/requirements.txt \
            -t build/order_processor

          cd build/order_processor

          zip -r ../order-processor-${{ github.sha }}.zip .


      #################################################
      # VERIFY BUILD ARTIFACTS
      #################################################

      - name: Verify Lambda Packages
        run: |
          echo "===== BUILD DIRECTORY ====="
          find build -type f | sort

          echo "===== ZIP FILES ====="
          ls -lh build/*.zip


      #################################################
      # GET LAMBDA ARTIFACT BUCKET
      #################################################

      - name: Get Lambda Artifact Bucket
        id: lambda_bucket
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-stack \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaBucket'].OutputValue" \
            --output text)

          echo "Lambda bucket: $BUCKET"

          if [ -z "$BUCKET" ] || [ "$BUCKET" = "None" ]; then
            echo "ERROR: Lambda artifact bucket was not found."
            exit 1
          fi

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"


      #################################################
      # UPLOAD PRODUCT LAMBDA
      #################################################

      - name: Upload Product Lambda
        run: |
          aws s3 cp \
            "build/product-lambda-${{ github.sha }}.zip" \
            "s3://${{ steps.lambda_bucket.outputs.bucket }}/product/product-lambda-${{ github.sha }}.zip"


      #################################################
      # UPLOAD ORDER PROCESSOR LAMBDA
      #################################################

      - name: Upload Order Processor Lambda
        run: |
          aws s3 cp \
            "build/order-processor-${{ github.sha }}.zip" \
            "s3://${{ steps.lambda_bucket.outputs.bucket }}/order-processor/order-processor-${{ github.sha }}.zip"


      #################################################
      # SHOW S3 ARTIFACTS
      #################################################

      - name: Verify S3 Lambda Artifacts
        run: |
          echo "===== PRODUCT LAMBDA ARTIFACTS ====="

          aws s3 ls \
            "s3://${{ steps.lambda_bucket.outputs.bucket }}/product/"


          echo "===== ORDER PROCESSOR LAMBDA ARTIFACTS ====="

          aws s3 ls \
            "s3://${{ steps.lambda_bucket.outputs.bucket }}/order-processor/"


      #################################################
      # DEPLOY API STACK
      #################################################

      - name: Deploy API Stack
        run: |
          aws cloudformation deploy \
            --stack-name cloudmart-api-stack \
            --template-file cloudformation/api-stack.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              "DBPassword=${{ secrets.DB_PASSWORD }}" \
              "CodeVersion=${{ github.sha }}"


      #################################################
      # SHOW API STACK ERRORS
      #################################################

      - name: Show API Stack Events
        if: always()
        run: |
          echo "===== API STACK EVENTS ====="

          aws cloudformation describe-stack-events \
            --stack-name cloudmart-api-stack \
            --query "StackEvents[0:20].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table


      #################################################
      # CHECK API STACK STATUS
      #################################################

      - name: Check API Stack Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-api-stack


      #################################################
      # CHECK NETWORK STACK STATUS
      #################################################

      - name: Check Network Stack Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-network-stack


      #################################################
      # CHECK DATA STACK STATUS
      #################################################

      - name: Check Data Stack Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-data-stack


      #################################################
      # CHECK IAM STACK STATUS
      #################################################

      - name: Check IAM Stack Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-stack