name: Deploy CloudMart Infrastructure


# ================================================================
# TRIGGERS
# ================================================================

on:

  workflow_dispatch:

  push:
    branches:
      - M3-redobranch


# ================================================================
# GITHUB PERMISSIONS
# ================================================================

permissions:

  id-token: write
  contents: read


# ================================================================
# JOBS
# ================================================================

jobs:

  deploy:

    runs-on: ubuntu-latest

    env:

      AWS_REGION: ap-south-1
      ENVIRONMENT_NAME: dev


    steps:


      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ============================================================
      # 2. CONFIGURE AWS CREDENTIALS
      # ============================================================

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      # ============================================================
      # 3. VERIFY AWS ACCESS
      # ============================================================

      - name: Verify AWS Access

        run: |

          echo "=================================================="
          echo "AWS IDENTITY"
          echo "=================================================="

          aws sts get-caller-identity


      # ============================================================
      # 4. CHECK REQUIRED GITHUB SECRETS
      # ============================================================

      - name: Check Required Secrets

        env:

          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

        run: |

          echo "=================================================="
          echo "CHECKING REQUIRED GITHUB SECRETS"
          echo "=================================================="


          if [ -z "$AWS_ROLE_ARN" ]; then

            echo "ERROR: AWS_ROLE_ARN secret is missing."

            exit 1

          fi


          if [ -z "$DB_PASSWORD" ]; then

            echo "ERROR: DB_PASSWORD secret is missing."

            exit 1

          fi


          if [ -z "$AUTH_TOKEN" ]; then

            echo "ERROR: AUTH_TOKEN secret is missing."

            exit 1

          fi


          echo "Required secrets are configured."


      # ============================================================
      # 5. INSTALL CFN-LINT
      # ============================================================

      - name: Install cfn-lint

        run: |

          echo "=================================================="
          echo "INSTALLING CFN-LINT"
          echo "=================================================="


          python -m pip install --upgrade pip

          pip install cfn-lint


      # ============================================================
      # 6. VALIDATE NETWORK STACK
      # ============================================================

      - name: Validate Network Stack

        run: |

          echo "=================================================="
          echo "VALIDATING NETWORK STACK"
          echo "=================================================="


          cfn-lint \
            --non-zero-exit-code error \
            cloudformation/network-stack.yaml


          aws cloudformation validate-template \
            --region "$AWS_REGION" \
            --template-body file://cloudformation/network-stack.yaml


          echo "Network stack validation passed."


      # ============================================================
      # 7. VALIDATE DATA STACK
      # ============================================================

      - name: Validate Data Stack

        run: |

          echo "=================================================="
          echo "VALIDATING DATA STACK"
          echo "=================================================="


          cfn-lint \
            --non-zero-exit-code error \
            cloudformation/data-stack.yaml


          aws cloudformation validate-template \
            --region "$AWS_REGION" \
            --template-body file://cloudformation/data-stack.yaml


          echo "Data stack validation passed."


      # ============================================================
      # 8. VALIDATE IAM STACK
      # ============================================================

      - name: Validate IAM Stack

        run: |

          echo "=================================================="
          echo "VALIDATING IAM STACK"
          echo "=================================================="


          cfn-lint \
            --non-zero-exit-code error \
            cloudformation/iam-stack.yaml


          aws cloudformation validate-template \
            --region "$AWS_REGION" \
            --template-body file://cloudformation/iam-stack.yaml


          echo "IAM stack validation passed."


      # ============================================================
      # 9. VALIDATE AUTH STACK
      # ============================================================

      - name: Validate Auth Stack

        run: |

          echo "=================================================="
          echo "VALIDATING AUTH STACK"
          echo "=================================================="


          cfn-lint \
            --non-zero-exit-code error \
            cloudformation/auth-stack.yaml


          aws cloudformation validate-template \
            --region "$AWS_REGION" \
            --template-body file://cloudformation/auth-stack.yaml


          echo "Auth stack validation passed."


      # ============================================================
      # 10. VALIDATE APPLICATION STACK
      # ============================================================

      - name: Validate Application Stack

        run: |

          echo "=================================================="
          echo "VALIDATING APPLICATION STACK"
          echo "=================================================="


          cfn-lint \
            --non-zero-exit-code error \
            cloudformation/api-stack.yaml


          aws cloudformation validate-template \
            --region "$AWS_REGION" \
            --template-body file://cloudformation/api-stack.yaml


          echo "Application stack validation passed."


      # ============================================================
      # 11. CHECK LAMBDA SOURCE FILES
      # ============================================================

      - name: Check Lambda Source Files

        run: |

          echo "=================================================="
          echo "CHECKING PRODUCT LAMBDA"
          echo "=================================================="


          test -f lambda/product/lambda_function.py
          test -f lambda/product/requirements.txt

          ls -la lambda/product/


          echo "=================================================="
          echo "CHECKING ORDER LAMBDA"
          echo "=================================================="


          test -f lambda/order/lambda_function.py
          test -f lambda/order/requirements.txt

          ls -la lambda/order/


          echo "=================================================="
          echo "CHECKING ORDER PROCESSOR LAMBDA"
          echo "=================================================="


          test -f lambda/order_processor/lambda_function.py
          test -f lambda/order_processor/requirements.txt

          ls -la lambda/order_processor/


          echo "=================================================="
          echo "CHECKING REPORT LAMBDA"
          echo "=================================================="


          test -f lambda/report/lambda_function.py
          test -f lambda/report/requirements.txt

          ls -la lambda/report/


          echo "All Lambda source files are present."


      # ============================================================
      # 12. PACKAGE LAMBDA FUNCTIONS
      # ============================================================

      - name: Package Lambda Functions

        run: |

          echo "=================================================="
          echo "BUILDING LAMBDA PACKAGES"
          echo "=================================================="


          rm -rf build

          mkdir -p build/product
          mkdir -p build/order
          mkdir -p build/order_processor
          mkdir -p build/report


          # ========================================================
          # PRODUCT LAMBDA
          # ========================================================

          echo "=================================================="
          echo "PACKAGING PRODUCT LAMBDA"
          echo "=================================================="


          cp \
            lambda/product/lambda_function.py \
            build/product/index.py


          pip install \
            -r lambda/product/requirements.txt \
            -t build/product


          cd build/product


          zip -r \
            ../../build/product-lambda-${{ github.sha }}.zip \
            .


          cd ../..


          # ========================================================
          # ORDER LAMBDA
          # ========================================================

          echo "=================================================="
          echo "PACKAGING ORDER LAMBDA"
          echo "=================================================="


          cp \
            lambda/order/lambda_function.py \
            build/order/index.py


          pip install \
            -r lambda/order/requirements.txt \
            -t build/order


          cd build/order


          zip -r \
            ../../build/order-lambda-${{ github.sha }}.zip \
            .


          cd ../..


          # ========================================================
          # ORDER PROCESSOR LAMBDA
          # ========================================================

          echo "=================================================="
          echo "PACKAGING ORDER PROCESSOR LAMBDA"
          echo "=================================================="


          cp \
            lambda/order_processor/lambda_function.py \
            build/order_processor/index.py


          pip install \
            -r lambda/order_processor/requirements.txt \
            -t build/order_processor


          cd build/order_processor


          zip -r \
            ../../build/order-processor-${{ github.sha }}.zip \
            .


          cd ../..


          # ========================================================
          # REPORT LAMBDA
          # ========================================================

          echo "=================================================="
          echo "PACKAGING REPORT LAMBDA"
          echo "=================================================="


          cp \
            lambda/report/lambda_function.py \
            build/report/index.py


          pip install \
            -r lambda/report/requirements.txt \
            -t build/report


          cd build/report


          zip -r \
            ../../build/report-lambda-${{ github.sha }}.zip \
            .


          cd ../..


          echo "All Lambda packages created."


      # ============================================================
      # 13. VERIFY LAMBDA PACKAGES
      # ============================================================

      - name: Verify Lambda Packages

        run: |

          echo "=================================================="
          echo "VERIFYING LAMBDA PACKAGES"
          echo "=================================================="


          ls -lh build/


          echo ""
          echo "=================================================="
          echo "CHECKING ZIP FILES"
          echo "=================================================="


          test -f \
            build/product-lambda-${{ github.sha }}.zip


          test -f \
            build/order-lambda-${{ github.sha }}.zip


          test -f \
            build/order-processor-${{ github.sha }}.zip


          test -f \
            build/report-lambda-${{ github.sha }}.zip


          echo ""

          echo "All Lambda packages are present."


      # ============================================================
      # 14. DEPLOY NETWORK STACK
      # ============================================================

      - name: Deploy Network Stack

        id: deploy_network

        run: |

          echo "=================================================="
          echo "DEPLOYING NETWORK STACK"
          echo "=================================================="


          aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name cloudmart-network-stack \
            --template-file cloudformation/network-stack.yaml


          echo ""
          echo "Network stack deployment completed."


      # ============================================================
      # 15. SHOW NETWORK STACK EVENTS ON FAILURE
      # ============================================================

      - name: Show Network Stack Errors

        if: failure() && steps.deploy_network.outcome == 'failure'

        run: |

          echo "=================================================="
          echo "NETWORK STACK EVENTS"
          echo "=================================================="


          if aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-network-stack \
            >/dev/null 2>&1
          then

            aws cloudformation describe-stack-events \
              --region "$AWS_REGION" \
              --stack-name cloudmart-network-stack \
              --query "StackEvents[0:40].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
              --output table

          else

            echo "Network stack does not exist."

          fi


      # ============================================================
      # 16. DEPLOY DATA STACK
      # ============================================================

      - name: Deploy Data Stack

        id: deploy_data

        env:

          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

        run: |

          echo "=================================================="
          echo "DEPLOYING DATA STACK"
          echo "=================================================="


          aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name cloudmart-data-stack \
            --template-file cloudformation/data-stack.yaml \
            --parameter-overrides \
              "DBPassword=$DB_PASSWORD"


          echo ""
          echo "Data stack deployment completed."


      # ============================================================
      # 17. SHOW DATA STACK EVENTS ON FAILURE
      # ============================================================

      - name: Show Data Stack Errors

        if: failure() && steps.deploy_data.outcome == 'failure'

        run: |

          echo "=================================================="
          echo "DATA STACK EVENTS"
          echo "=================================================="


          if aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-data-stack \
            >/dev/null 2>&1
          then

            aws cloudformation describe-stack-events \
              --region "$AWS_REGION" \
              --stack-name cloudmart-data-stack \
              --query "StackEvents[0:40].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
              --output table

          else

            echo "Data stack does not exist."

          fi


      # ============================================================
      # 18. DEPLOY IAM STACK
      # ============================================================

      - name: Deploy IAM Stack

        id: deploy_iam

        env:

          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}

        run: |

          echo "=================================================="
          echo "DEPLOYING IAM STACK"
          echo "=================================================="


          aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name cloudmart-iam-stack \
            --template-file cloudformation/iam-stack.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              "DBUsername=cloudmartadmin" \
              "DBPassword=$DB_PASSWORD" \
              "AuthToken=$AUTH_TOKEN"


          echo ""
          echo "IAM stack deployment completed."


      # ============================================================
      # 19. SHOW IAM STACK EVENTS ON FAILURE
      # ============================================================

      - name: Show IAM Stack Errors

        if: failure() && steps.deploy_iam.outcome == 'failure'

        run: |

          echo "=================================================="
          echo "IAM STACK EVENTS"
          echo "=================================================="


          if aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-iam-stack \
            >/dev/null 2>&1
          then

            aws cloudformation describe-stack-events \
              --region "$AWS_REGION" \
              --stack-name cloudmart-iam-stack \
              --query "StackEvents[0:40].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
              --output table

          else

            echo "IAM stack does not exist."

          fi


      # ============================================================
      # 20. DEPLOY AUTH STACK
      #
      # The updated auth-stack.yaml does NOT create SecureString
      # through CloudFormation.
      #
      # Therefore AUTH_TOKEN is NOT passed to CloudFormation here.
      # ============================================================

      - name: Deploy Auth Stack

        id: deploy_auth

        run: |

          echo "=================================================="
          echo "DEPLOYING AUTH STACK"
          echo "=================================================="


          aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name cloudmart-auth-stack \
            --template-file cloudformation/auth-stack.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              "EnvironmentName=$ENVIRONMENT_NAME"


          echo ""
          echo "Auth stack deployment completed."


      # ============================================================
      # 21. CREATE / UPDATE AUTHENTICATION SECURESTRING
      # ============================================================

      - name: Create Authentication SecureString

        id: create_auth_parameter

        env:

          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}

        run: |

          echo "=================================================="
          echo "CREATING AUTHENTICATION SECURESTRING"
          echo "=================================================="


          if [ -z "$AUTH_TOKEN" ]; then

            echo "ERROR: AUTH_TOKEN is empty."

            exit 1

          fi


          aws ssm put-parameter \
            --region "$AWS_REGION" \
            --name "/cloudmart/${ENVIRONMENT_NAME}/auth/token" \
            --value "$AUTH_TOKEN" \
            --type SecureString \
            --overwrite


          echo ""
          echo "Authentication SecureString created/updated successfully."


      # ============================================================
      # 22. VERIFY AUTHENTICATION PARAMETER
      #
      # We only verify that the parameter exists.
      # We DO NOT print the token.
      # ============================================================

      - name: Verify Authentication Parameter

        run: |

          echo "=================================================="
          echo "VERIFYING AUTHENTICATION PARAMETER"
          echo "=================================================="


          aws ssm get-parameter \
            --region "$AWS_REGION" \
            --name "/cloudmart/${ENVIRONMENT_NAME}/auth/token" \
            --query "Parameter.[Name,Type]" \
            --output table


          echo ""
          echo "Authentication parameter exists."


      # ============================================================
      # 23. SHOW AUTH STACK EVENTS ON FAILURE
      # ============================================================

      - name: Show Auth Stack Errors

        if: failure() && steps.deploy_auth.outcome == 'failure'

        run: |

          echo "=================================================="
          echo "AUTH STACK EVENTS"
          echo "=================================================="


          if aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-auth-stack \
            >/dev/null 2>&1
          then

            aws cloudformation describe-stack-events \
              --region "$AWS_REGION" \
              --stack-name cloudmart-auth-stack \
              --query "StackEvents[0:40].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
              --output table

          else

            echo "Auth stack does not exist."

          fi


      # ============================================================
      # 24. GET LAMBDA ARTIFACT BUCKET
      # ============================================================

      - name: Get Lambda Artifact Bucket

        id: lambda_bucket

        run: |

          echo "=================================================="
          echo "GETTING LAMBDA ARTIFACT BUCKET"
          echo "=================================================="


          BUCKET=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-data-stack \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaBucket'].OutputValue" \
            --output text)


          echo "Lambda artifact bucket: $BUCKET"


          if [ -z "$BUCKET" ] || [ "$BUCKET" = "None" ]; then

            echo "ERROR: Lambda artifact bucket was not found."

            exit 1

          fi


          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 25. UPLOAD PRODUCT LAMBDA
      # ============================================================

      - name: Upload Product Lambda

        run: |

          echo "=================================================="
          echo "UPLOADING PRODUCT LAMBDA"
          echo "=================================================="


          aws s3 cp \
            "build/product-lambda-${{ github.sha }}.zip" \
            "s3://${{ steps.lambda_bucket.outputs.bucket }}/product/product-lambda-${{ github.sha }}.zip"


      # ============================================================
      # 26. UPLOAD ORDER LAMBDA
      # ============================================================

      - name: Upload Order Lambda

        run: |

          echo "=================================================="
          echo "UPLOADING ORDER LAMBDA"
          echo "=================================================="


          aws s3 cp \
            "build/order-lambda-${{ github.sha }}.zip" \
            "s3://${{ steps.lambda_bucket.outputs.bucket }}/order/order-lambda-${{ github.sha }}.zip"


      # ============================================================
      # 27. UPLOAD ORDER PROCESSOR LAMBDA
      # ============================================================

      - name: Upload Order Processor Lambda

        run: |

          echo "=================================================="
          echo "UPLOADING ORDER PROCESSOR LAMBDA"
          echo "=================================================="


          aws s3 cp \
            "build/order-processor-${{ github.sha }}.zip" \
            "s3://${{ steps.lambda_bucket.outputs.bucket }}/order-processor/order-processor-${{ github.sha }}.zip"


      # ============================================================
      # 28. UPLOAD REPORT LAMBDA
      # ============================================================

      - name: Upload Report Lambda

        run: |

          echo "=================================================="
          echo "UPLOADING REPORT LAMBDA"
          echo "=================================================="


          aws s3 cp \
            "build/report-lambda-${{ github.sha }}.zip" \
            "s3://${{ steps.lambda_bucket.outputs.bucket }}/report/report-lambda-${{ github.sha }}.zip"


      # ============================================================
      # 29. VERIFY S3 ARTIFACTS
      # ============================================================

      - name: Verify S3 Lambda Artifacts

        run: |

          echo "=================================================="
          echo "VERIFYING LAMBDA ARTIFACTS IN S3"
          echo "=================================================="


          echo ""
          echo "===== PRODUCT ====="


          aws s3 ls \
            "s3://${{ steps.lambda_bucket.outputs.bucket }}/product/"


          echo ""
          echo "===== ORDER ====="


          aws s3 ls \
            "s3://${{ steps.lambda_bucket.outputs.bucket }}/order/"


          echo ""
          echo "===== ORDER PROCESSOR ====="


          aws s3 ls \
            "s3://${{ steps.lambda_bucket.outputs.bucket }}/order-processor/"


          echo ""
          echo "===== REPORT ====="


          aws s3 ls \
            "s3://${{ steps.lambda_bucket.outputs.bucket }}/report/"


      # ============================================================
      # 30. DEPLOY APPLICATION STACK
      # ============================================================

      - name: Deploy Application Stack

        id: deploy_application

        env:

          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

        run: |

          echo "=================================================="
          echo "DEPLOYING APPLICATION STACK"
          echo "=================================================="


          aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name cloudmart-api-stack \
            --template-file cloudformation/api-stack.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              "DBPassword=$DB_PASSWORD" \
              "CodeVersion=${{ github.sha }}" \
              "EnvironmentName=$ENVIRONMENT_NAME"


          echo ""
          echo "Application stack deployment completed."


      # ============================================================
      # 31. SHOW APPLICATION STACK EVENTS ON FAILURE
      # ============================================================

      - name: Show Application Stack Errors

        if: failure() && steps.deploy_application.outcome == 'failure'

        run: |

          echo "=================================================="
          echo "APPLICATION STACK EVENTS"
          echo "=================================================="


          if aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-api-stack \
            >/dev/null 2>&1
          then

            aws cloudformation describe-stack-events \
              --region "$AWS_REGION" \
              --stack-name cloudmart-api-stack \
              --query "StackEvents[0:50].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
              --output table

          else

            echo "Application stack does not exist."

          fi


      # ============================================================
      # 32. GET API URL
      # ============================================================

      - name: Get API URL

        id: api_url

        run: |

          echo "=================================================="
          echo "GETTING API URL"
          echo "=================================================="


          API_URL=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-api-stack \
            --query "Stacks[0].Outputs[?OutputKey=='ApiInvokeUrl'].OutputValue" \
            --output text)


          echo "API URL: $API_URL"


          if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then

            echo "ERROR: API URL was not found."

            exit 1

          fi


          echo "url=$API_URL" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 33. SMOKE TEST - GET PRODUCTS
      # ============================================================

      - name: Smoke Test - GET Products

        env:

          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}

        run: |

          echo "=================================================="
          echo "SMOKE TEST - GET /products"
          echo "=================================================="


          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/products-response.json \
            --write-out "%{http_code}" \
            --request GET \
            --header "Authorization: Bearer $AUTH_TOKEN" \
            "${{ steps.api_url.outputs.url }}/products")


          echo ""
          echo "HTTP STATUS: $HTTP_STATUS"


          echo ""
          echo "RESPONSE:"


          cat /tmp/products-response.json


          echo ""


          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then

            echo "ERROR: GET /products smoke test failed."

            exit 1

          fi


          echo "GET /products smoke test passed."


      # ============================================================
      # 34. SMOKE TEST - POST ORDER
      # ============================================================

      - name: Smoke Test - POST Order

        env:

          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}

        run: |

          echo "=================================================="
          echo "SMOKE TEST - POST /orders"
          echo "=================================================="


          cat > /tmp/order.json <<'EOF'
          {
            "customer_id": "SMOKE-TEST-CUSTOMER",
            "items": [
              {
                "product_id": 1,
                "quantity": 1
              }
            ]
          }
          EOF


          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/order-response.json \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $AUTH_TOKEN" \
            --data @/tmp/order.json \
            "${{ steps.api_url.outputs.url }}/orders")


          echo ""
          echo "HTTP STATUS: $HTTP_STATUS"


          echo ""
          echo "RESPONSE:"


          cat /tmp/order-response.json


          echo ""


          if [ "$HTTP_STATUS" != "202" ]; then

            echo "ERROR: POST /orders smoke test failed."

            echo "Expected HTTP 202."

            exit 1

          fi


          echo "POST /orders smoke test passed."


      # ============================================================
      # 35. FINAL CLOUDFORMATION STATUS
      # ============================================================

      - name: Final CloudFormation Status

        if: always()

        run: |

          echo "=================================================="
          echo "FINAL CLOUDMART STACK STATUS"
          echo "=================================================="


          echo ""
          echo "===== NETWORK STACK ====="


          aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-network-stack \
            --query "Stacks[0].[StackName,StackStatus]" \
            --output table \
            || true


          echo ""
          echo "===== DATA STACK ====="


          aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-data-stack \
            --query "Stacks[0].[StackName,StackStatus]" \
            --output table \
            || true


          echo ""
          echo "===== IAM STACK ====="


          aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-iam-stack \
            --query "Stacks[0].[StackName,StackStatus]" \
            --output table \
            || true


          echo ""
          echo "===== AUTH STACK ====="


          aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-auth-stack \
            --query "Stacks[0].[StackName,StackStatus]" \
            --output table \
            || true


          echo ""
          echo "===== APPLICATION STACK ====="


          aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-api-stack \
            --query "Stacks[0].[StackName,StackStatus]" \
            --output table \
            || true