AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart API Stack

Parameters:

  CodeVersion:
    Type: String
    Description: Git commit SHA used to identify the Product Lambda deployment package

  DBPassword:
    Type: String
    NoEcho: true
    Description: CloudMart RDS master password


Resources:

  #################################################
  # PRODUCT LAMBDA
  #################################################

  ProductLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloudmart-product
      Runtime: python3.13
      Handler: index.lambda_handler

      Role:
        Fn::ImportValue: cloudmart-product-role-arn

      Timeout: 15

      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: cloudmart-private-subnet-id
          - Fn::ImportValue: cloudmart-private-subnet-2-id

        SecurityGroupIds:
          - Fn::ImportValue: cloudmart-lambda-sg

      Environment:
        Variables:
          DB_HOST:
            Fn::ImportValue: cloudmart-database-endpoint
          DB_NAME: cloudmart
          DB_USER: cloudmartadmin
          DB_PASSWORD: !Ref DBPassword
          DB_PORT: "3306"

      Code:
        S3Bucket: !Sub cloudmart-lambda-${AWS::AccountId}-${AWS::Region}
        S3Key: !Sub product/product-lambda-${CodeVersion}.zip


  #################################################
  # SNS LOW STOCK ALERT
  #################################################

  LowStockTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: cloudmart-low-stock-alerts


  LowStockEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref LowStockTopic
      Protocol: email
      Endpoint: uppu4678@gmail.com


  #################################################
  # EVENTBRIDGE LOW STOCK RULE
  #################################################

  InventoryLowStockRule:
    Type: AWS::Events::Rule
    Properties:
      Name: cloudmart-inventory-low-stock-rule

      Description: Send SNS alert when product stock is low

      EventPattern:
        source:
          - cloudmart.inventory

        detail-type:
          - InventoryChanged

        detail:
          stock_count:
            - numeric:
                - "<="
                - 5

      State: ENABLED

      Targets:
        - Arn: !Ref LowStockTopic
          Id: LowStockSNSTarget


  #################################################
  # SNS TOPIC POLICY
  #################################################

  LowStockTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:

      Topics:
        - !Ref LowStockTopic

      PolicyDocument:
        Version: "2012-10-17"

        Statement:

          - Sid: AllowEventBridgePublish

            Effect: Allow

            Principal:
              Service: events.amazonaws.com

            Action:
              - sns:Publish

            Resource: !Ref LowStockTopic

            Condition:
              ArnEquals:
                aws:SourceArn:
                  !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/cloudmart-inventory-low-stock-rule


  #################################################
  # API GATEWAY
  #################################################

  CloudMartApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: cloudmart-api


  #################################################
  # AUTHORIZER
  #################################################

  CloudMartAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: cloudmart-authorizer
      RestApiId: !Ref CloudMartApi
      Type: TOKEN
      IdentitySource: method.request.header.Authorization
      AuthorizerResultTtlInSeconds: 0

      AuthorizerUri:
        Fn::Sub:
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
          - AuthorizerArn:
              Fn::ImportValue: cloudmart-authorizer-lambda-arn


  #################################################
  # /products
  #################################################

  ProductsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !GetAtt CloudMartApi.RootResourceId
      PathPart: products


  ProductsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  ProductsPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductsResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  #################################################
  # /products/{id}
  #################################################

  ProductIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !Ref ProductsResource
      PathPart: "{id}"


  ProductIdGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  ProductIdPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  ProductIdDeleteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  #################################################
  # LAMBDA PERMISSION
  #################################################

  AuthorizerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction

      FunctionName:
        Fn::ImportValue: cloudmart-authorizer-lambda-arn

      Principal: apigateway.amazonaws.com

      SourceArn:
        !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartApi}/*/*


  ProductLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction

      FunctionName: !Ref ProductLambda

      Principal: apigateway.amazonaws.com

      SourceArn:
        !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartApi}/*/*


  #################################################
  # API DEPLOYMENT
  #################################################

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment

    DependsOn:
      - ProductsGetMethod
      - ProductsPostMethod
      - ProductIdGetMethod
      - ProductIdPutMethod
      - ProductIdDeleteMethod

    Properties:
      RestApiId: !Ref CloudMartApi


  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref CloudMartApi
      DeploymentId: !Ref ApiDeployment
      StageName: prod


Outputs:

  ApiId:
    Value: !Ref CloudMartApi
    Export:
      Name: cloudmart-api-id


  ApiInvokeUrl:
    Value: !Sub https://${CloudMartApi}.execute-api.${AWS::Region}.amazonaws.com/prod


  ProductLambdaArn:
    Value: !GetAtt ProductLambda.Arn
    Export:
      Name: cloudmart-product-lambda-arn