AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Authentication Stack


# ================================================================
# PARAMETERS
# ================================================================

Parameters:

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: CloudMart deployment environment


# ================================================================
# RESOURCES
# ================================================================

Resources:


  # ==============================================================
  # SSM - APPLICATION ENVIRONMENT
  #
  # Non-sensitive configuration:
  # String
  #
  # Document:
  # /cloudmart/dev/app/environment
  # ==============================================================

  EnvironmentParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name: !Sub /cloudmart/${EnvironmentName}/app/environment

      Type: String

      Value: !Ref EnvironmentName

      Description: CloudMart application environment

      Tier: Standard

      Tags:

        Application: CloudMart
        Environment: !Ref EnvironmentName
        Purpose: ApplicationConfiguration


  # ==============================================================
  # LAMBDA AUTHORIZER
  # ==============================================================

  AuthorizerLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName: !Sub cloudmart-authorizer-${EnvironmentName}

      Runtime: python3.13

      Handler: index.lambda_handler

      Role:
        Fn::ImportValue: cloudmart-authorizer-role-arn

      Timeout: 10

      MemorySize: 128

      Environment:

        Variables:

          USER_AUTH_TOKEN_PARAMETER:
            !Sub /cloudmart/${EnvironmentName}/auth/user-token

          ADMIN_AUTH_TOKEN_PARAMETER:
            !Sub /cloudmart/${EnvironmentName}/auth/admin-token

          APP_ENVIRONMENT_PARAMETER:
            !Sub /cloudmart/${EnvironmentName}/app/environment

      Code:

        ZipFile: |

          import boto3
          import hmac
          import os


          # =========================================================
          # AWS CLIENT
          # =========================================================

          ssm = boto3.client("ssm")


          # =========================================================
          # ENVIRONMENT VARIABLES
          # =========================================================

          USER_AUTH_TOKEN_PARAMETER = os.environ[
              "USER_AUTH_TOKEN_PARAMETER"
          ]

          ADMIN_AUTH_TOKEN_PARAMETER = os.environ[
              "ADMIN_AUTH_TOKEN_PARAMETER"
          ]

          APP_ENVIRONMENT_PARAMETER = os.environ[
              "APP_ENVIRONMENT_PARAMETER"
          ]


          # =========================================================
          # TOKEN HELPERS
          # =========================================================

          def normalize_token(value):
              token = (value or "").strip()

              if token.lower().startswith("bearer "):
                  token = token[7:].strip()

              return token


          def get_parameter_value(parameter_name):
              parameter = ssm.get_parameter(
                  Name=parameter_name,
                  WithDecryption=True
              )

              return normalize_token(
                  parameter["Parameter"]["Value"]
              )


          def get_role(authorization):
              provided_token = normalize_token(authorization)

              if not provided_token:
                  return None

              user_token = get_parameter_value(
                  USER_AUTH_TOKEN_PARAMETER
              )

              if user_token and hmac.compare_digest(
                  provided_token,
                  user_token
              ):
                  return "user"

              admin_token = get_parameter_value(
                  ADMIN_AUTH_TOKEN_PARAMETER
              )

              if admin_token and hmac.compare_digest(
                  provided_token,
                  admin_token
              ):
                  return "admin"

              return None


          # =========================================================
          # API ACCESS RULES
          # =========================================================

          def is_allowed(role, method, path):

            normalized_path = path.rstrip("/") or "/"

            # =========================================================
            # USER
            # =========================================================

            if role == "user":

                # Products - read only
                if normalized_path == "/products":
                    return method == "GET"

                if normalized_path.startswith("/products/"):
                    return method == "GET"

                # Orders
                if normalized_path == "/orders":
                    return method in {"GET", "POST"}

                if normalized_path.startswith("/orders/"):
                    return method == "GET"

                return False


            # =========================================================
            # ADMIN
            # =========================================================

            if role == "admin":

                # Products
                if normalized_path == "/products":
                    return method in {"GET", "POST"}

                if normalized_path.startswith("/products/"):
                    return method in {"GET", "PUT", "DELETE"}

                # Orders
                if normalized_path == "/orders":
                    return method == "GET"

                if normalized_path.startswith("/orders/"):
                    return method == "GET"

                return False


            return False

          # =========================================================
          # LAMBDA HANDLER
          # =========================================================

          def lambda_handler(event, context):

              print("========== AUTHORIZER START ==========")

              authorization = event.get(
                  "authorizationToken",
                  ""
              )

              method_arn = event.get(
                  "methodArn",
                  ""
              )

              if not authorization:
                  print("TOKEN MISSING")
                  raise Exception("Unauthorized")

              try:
                  role = get_role(authorization)

                  if role is None:
                      print("TOKEN INVALID")
                      raise Exception("Unauthorized")

                  arn_parts = method_arn.split("/")

                  if len(arn_parts) < 3:
                      print("INVALID METHOD ARN")
                      raise Exception("Unauthorized")

                  method = arn_parts[2].upper()
                  path = (
                      "/" + "/".join(arn_parts[3:])
                      if len(arn_parts) > 3
                      else "/"
                  )

                  if not is_allowed(role, method, path):
                      print(
                          f"ACCESS DENIED: role={role}, "
                          f"method={method}, path={path}"
                      )
                      raise Exception("Unauthorized")

                  print(
                      f"AUTHORIZATION SUCCESS: role={role}, "
                      f"method={method}, path={path}"
                  )

                  return {
                      "principalId":
                          f"cloudmart-{role}",

                      "policyDocument": {
                          "Version": "2012-10-17",
                          "Statement": [
                              {
                                  "Action":
                                      "execute-api:Invoke",
                                  "Effect": "Allow",
                                  "Resource": method_arn
                              }
                          ]
                      },

                      "context": {
                          "role": role,
                          "user":
                              f"cloudmart-{role}",
                          "environment":
                              APP_ENVIRONMENT_PARAMETER
                      }
                  }

              except Exception as exc:

                  print(
                      "========== AUTHORIZER ERROR =========="
                  )

                  print(
                      "Authorization failed:",
                      type(exc).__name__
                  )

                  raise Exception("Unauthorized")



  # ==============================================================
  # API GATEWAY -> AUTHORIZE LAMBDA PERMISSION
  # ==============================================================

  AuthorizerPermission:
    Type: AWS::Lambda::Permission

    Properties:

      Action:
        lambda:InvokeFunction

      FunctionName:
        !Ref AuthorizerLambda

      Principal:
        apigateway.amazonaws.com


# ================================================================
# OUTPUTS
# ================================================================

Outputs:


  # ==============================================================
  # AUTHORIZE LAMBDA ARN
  # ==============================================================

  AuthorizerLambdaArn:

    Description: CloudMart Authorizer Lambda ARN

    Value:
      !GetAtt AuthorizerLambda.Arn

    Export:
      Name:
        cloudmart-authorizer-lambda-arn


  # ==============================================================
  # AUTHORIZE LAMBDA NAME
  # ==============================================================

  AuthorizerLambdaName:

    Description: CloudMart Authorizer Lambda Name

    Value:
      !Ref AuthorizerLambda

    Export:
      Name:
        cloudmart-authorizer-lambda-name


  # ==============================================================
  # USER AUTH TOKEN PARAMETER NAME
  # ==============================================================

  UserAuthTokenParameterName:

    Description: SSM parameter name for the CloudMart user authentication token

    Value:
      !Sub /cloudmart/${EnvironmentName}/auth/user-token

    Export:
      Name:
        cloudmart-user-auth-token-parameter


  # ==============================================================
  # ADMIN AUTH TOKEN PARAMETER NAME
  # ==============================================================

  AdminAuthTokenParameterName:

    Description: SSM parameter name for the CloudMart admin authentication token

    Value:
      !Sub /cloudmart/${EnvironmentName}/auth/admin-token

    Export:
      Name:
        cloudmart-admin-auth-token-parameter


  # ==============================================================
  # ENVIRONMENT PARAMETER NAME
  # ==============================================================

  EnvironmentParameterName:

    Description: SSM parameter containing the CloudMart environment

    Value:
      !Ref EnvironmentParameter

    Export:
      Name:
        cloudmart-environment-parameter