AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Network Stack


# ================================================================
# PARAMETERS
# ================================================================

Parameters:

  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16
    Description: CloudMart VPC CIDR block




  DashboardIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to access the dashboard

  SSHIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to SSH to the dashboard EC2 instance



  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 AMI

  LambdaArtifactBucketParameter:
    Type: String
    Default: /cloudmart/dev/lambda-artifact-bucket
    Description: SSM parameter containing the CloudMart Lambda artifact S3 bucket name


# ================================================================
# RESOURCES
# ================================================================

Resources:


  # ================================================================
  # VPC
  # ================================================================

  CloudMartVPC:
    Type: AWS::EC2::VPC

    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true

      Tags:
        - Key: Name
          Value: cloudmart-vpc


  # ================================================================
  # INTERNET GATEWAY
  # ================================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway

    Properties:
      Tags:
        - Key: Name
          Value: cloudmart-igw


  # ================================================================
  # INTERNET GATEWAY ATTACHMENT
  # ================================================================

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment

    Properties:
      VpcId: !Ref CloudMartVPC
      InternetGatewayId: !Ref InternetGateway


  # ================================================================
  # PUBLIC SUBNET
  # EC2 DASHBOARD
  # ================================================================

  PublicSubnet:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true

      AvailabilityZone: !Select
        - 0
        - !GetAZs ''

      Tags:
        - Key: Name
          Value: cloudmart-public-subnet


  # ================================================================
  # PRIVATE APPLICATION SUBNET
  # LAMBDA FUNCTIONS
  # ================================================================

  PrivateSubnet:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: 10.0.2.0/24

      AvailabilityZone: !Select
        - 0
        - !GetAZs ''

      Tags:
        - Key: Name
          Value: cloudmart-private-app-subnet


  # ================================================================
  # SECOND PRIVATE SUBNET
  # RDS / VPC ENDPOINTS
  # ================================================================

  PrivateSubnet2:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: 10.0.3.0/24

      AvailabilityZone: !Select
        - 1
        - !GetAZs ''

      Tags:
        - Key: Name
          Value: cloudmart-private-db-subnet


  # ================================================================
  # PUBLIC ROUTE TABLE
  # ================================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:
      VpcId: !Ref CloudMartVPC

      Tags:
        - Key: Name
          Value: cloudmart-public-route-table


  # ================================================================
  # PUBLIC DEFAULT ROUTE
  # ================================================================

  PublicRoute:
    Type: AWS::EC2::Route

    DependsOn: AttachGateway

    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway


  # ================================================================
  # PUBLIC SUBNET ASSOCIATION
  # ================================================================

  PublicSubnetAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet


  # ================================================================
  # PRIVATE ROUTE TABLE
  # ================================================================

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:
      VpcId: !Ref CloudMartVPC

      Tags:
        - Key: Name
          Value: cloudmart-private-route-table


  # ================================================================
  # PRIVATE SUBNET ASSOCIATION
  # ================================================================

  PrivateSubnetAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet


  # ================================================================
  # SECOND PRIVATE SUBNET ASSOCIATION
  # ================================================================

  PrivateSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet2


  # ================================================================
  # SECURITY GROUP - LAMBDA
  # ================================================================

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: CloudMart Lambda security group
      VpcId: !Ref CloudMartVPC

      # No default outbound rules.
      # Required outbound rules are defined separately below.
      SecurityGroupEgress: []

      Tags:
        - Key: Name
          Value: cloudmart-lambda-sg


  # ================================================================
  # SECURITY GROUP - VPC ENDPOINTS
  # ================================================================

  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: CloudMart VPC endpoint security group
      VpcId: !Ref CloudMartVPC

      # No default outbound rules.
      SecurityGroupEgress: []

      Tags:
        - Key: Name
          Value: cloudmart-vpc-endpoints-sg


  # ================================================================
  # SECURITY GROUP - RDS
  # ================================================================

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: CloudMart RDS MySQL security group
      VpcId: !Ref CloudMartVPC

      # No default inbound rules.
      # RDS access is defined separately below.
      # No default outbound rules.
      SecurityGroupEgress: []

      Tags:
        - Key: Name
          Value: cloudmart-rds-sg


  # ================================================================
  # SECURITY GROUP - EC2 DASHBOARD
  # ================================================================

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: CloudMart EC2 dashboard security group
      VpcId: !Ref CloudMartVPC

      # No default outbound rules.
      # Required outbound rules are defined separately below.
      SecurityGroupEgress: []

      Tags:
        - Key: Name
          Value: cloudmart-ec2-sg


  # ================================================================
  # LAMBDA -> RDS
  # TCP 3306
  # ================================================================

  LambdaToRDSEgress:
    Type: AWS::EC2::SecurityGroupEgress

    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      DestinationSecurityGroupId: !Ref RDSSecurityGroup


  # ================================================================
  # LAMBDA -> VPC ENDPOINTS
  # TCP 443
  # ================================================================

  LambdaToVPCEndpointEgress:
    Type: AWS::EC2::SecurityGroupEgress

    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref VPCEndpointSecurityGroup


  # ================================================================
  # LAMBDA -> HTTPS
  # TCP 443
  # Required for AWS service access including S3.
  #
  # S3 is configured as a Gateway Endpoint below. The route table
  # determines that S3 traffic uses the Gateway Endpoint.
  # ================================================================

  LambdaToHTTPS:
    Type: AWS::EC2::SecurityGroupEgress

    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0


  # ================================================================
  # RDS <- LAMBDA
  # TCP 3306
  # ================================================================

  RDSFromLambdaIngress:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref RDSSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref LambdaSecurityGroup


  # ================================================================
  # RDS <- EC2
  # TCP 3306
  # ================================================================

  RDSFromEC2Ingress:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref RDSSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref EC2SecurityGroup


  # ================================================================
  # EC2 -> RDS
  # TCP 3306
  # ================================================================

  EC2ToRDSEgress:
    Type: AWS::EC2::SecurityGroupEgress

    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      DestinationSecurityGroupId: !Ref RDSSecurityGroup


  # ================================================================
  # EC2 -> DNS
  # UDP 53
  # ================================================================

  EC2ToDNSUDP:
    Type: AWS::EC2::SecurityGroupEgress

    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: udp
      FromPort: 53
      ToPort: 53
      CidrIp: 0.0.0.0/0


  # ================================================================
  # EC2 -> DNS
  # TCP 53
  # ================================================================

  EC2ToDNSTCP:
    Type: AWS::EC2::SecurityGroupEgress

    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 53
      ToPort: 53
      CidrIp: 0.0.0.0/0


  # ================================================================
  # EC2 -> INTERNET
  # HTTPS 443
  # ================================================================

  EC2ToInternetHTTPS:
    Type: AWS::EC2::SecurityGroupEgress

    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0


  # ================================================================
  # VPC ENDPOINTS <- LAMBDA
  # HTTPS 443
  # ================================================================

  VPCEndpointFromLambdaIngress:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref VPCEndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref LambdaSecurityGroup

  # ================================================================
  # VPC ENDPOINTS <- EC2 DASHBOARD
  # HTTPS 443
  # Required for EC2 dashboard -> SSM Parameter Store
  # ================================================================

  VPCEndpointFromEC2Ingress:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref VPCEndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref EC2SecurityGroup




  # ================================================================
  # EC2 DASHBOARD
  # FLASK 5000
  # ================================================================

  EC2FlaskIngressV2:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 5000
      ToPort: 5000
      CidrIp: !Ref DashboardIngressCidr


  # ================================================================
  # EC2 DASHBOARD
  # HTTP 80
  # NGINX REVERSE PROXY -> FLASK 5000
  # ================================================================

  EC2HttpIngress:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: !Ref DashboardIngressCidr


  # ================================================================
  # EC2 SSH ACCESS
  # TCP 22
  # No key pair is required by this CloudFormation template.
  # EC2 Instance Connect can be used from the AWS Console.
  # ================================================================

  EC2SSHIngress:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: !Ref SSHIngressCidr






  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

      Policies:
        - PolicyName: CloudMartDashboardAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadDatabaseParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/dev/database/password

              - Sid: ReadReportsBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::cloudmart-reports-${AWS::AccountId}-${AWS::Region}
                  - !Sub arn:${AWS::Partition}:s3:::cloudmart-reports-${AWS::AccountId}-${AWS::Region}/*

              - Sid: ReadLambdaArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::cloudmart-data-stack-lambdaartifactsbucket-*/*

              - Sid: ReadLambdaArtifactBucketParameter
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${LambdaArtifactBucketParameter}

              - Sid: ReadCloudWatchMetrics
                Effect: Allow
                Action:
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                Resource: "*"

              - Sid: DescribeRDSInstances
                Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                Resource: "*"

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2InstanceRole

  CloudMartEC2:
    Type: AWS::EC2::Instance
    DependsOn:
      - AttachGateway
      - PublicRoute
      - PublicSubnetAssociation
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Properties:
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      IamInstanceProfile: !Ref EC2InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail

          exec > >(tee -a /var/log/cloudmart-dashboard-userdata.log | logger -t cloudmart-userdata -s 2>/dev/console) 2>&1

          AWS_REGION_VALUE="${AWS::Region}"
          ACCOUNT_ID_VALUE="${AWS::AccountId}"
          LAMBDA_BUCKET_PARAMETER="${LambdaArtifactBucketParameter}"
          DASHBOARD_KEY="dashboard/cloudmart-dashboard.zip"
          DB_HOST_CONFIG_KEY="dashboard/db-host.txt"

          echo "Starting CloudMart dashboard bootstrap..."

          # Do not run a full OS update during bootstrap.
          # It can delay NGINX availability while the EC2 instance initializes.
          dnf install -y mariadb105 python3 python3-pip unzip awscli-2 nginx amazon-ssm-agent

          # Keep the instance reachable by GitHub Actions through AWS Systems Manager.
          systemctl enable --now amazon-ssm-agent

          # Amazon Linux 2023 does not guarantee that the AWS CLI is
          # preinstalled. Install it explicitly before any S3 operations.
          if ! command -v aws >/dev/null 2>&1; then
            echo "ERROR: AWS CLI installation failed."
            dnf install -y awscli-2
          fi

          if ! command -v aws >/dev/null 2>&1; then
            echo "ERROR: AWS CLI is still not available after installation."
            exit 1
          fi

          echo "AWS CLI detected: $(aws --version)"

          mkdir -p /opt/cloudmart-dashboard
          chown -R ec2-user:ec2-user /opt/cloudmart-dashboard

          # ============================================================
          # NGINX REVERSE PROXY
          # HTTP :80 -> Flask/Gunicorn :5000
          # ============================================================

          rm -f /etc/nginx/conf.d/default.conf

          cat > /etc/nginx/conf.d/cloudmart.conf <<'NGINXEOF'
          server {
              listen 80;
              listen [::]:80;

              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:5000;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NGINXEOF

          nginx -t

          # Start NGINX immediately so HTTP port 80 is available even if
          # dashboard artifacts are still being uploaded to S3.
          systemctl enable nginx
          systemctl start nginx

          cat > /usr/local/bin/cloudmart-dashboard-deploy.sh <<'DEPLOYEOF'
          #!/bin/bash
          set -euo pipefail

          AWS_REGION_VALUE="$1"
          LAMBDA_BUCKET_PARAMETER="$2"
          DASHBOARD_KEY="$3"
          DB_HOST_CONFIG_KEY="$4"

          DASHBOARD_DIR="/opt/cloudmart-dashboard"
          ZIP_FILE="/tmp/cloudmart-dashboard.zip"
          STATE_FILE="/var/lib/cloudmart-dashboard-state"
          TMP_STATE_FILE="/tmp/cloudmart-dashboard-state.new"

          mkdir -p "$(dirname "$STATE_FILE")"

          echo "Checking dashboard artifact..."

          # The Data Stack creates the Lambda artifact bucket with a
          # CloudFormation-generated name. Read the actual bucket name from
          # SSM instead of hardcoding a bucket name in the Network Stack.
          LAMBDA_BUCKET_VALUE=$(aws ssm get-parameter \
            --region "$AWS_REGION_VALUE" \
            --name "$LAMBDA_BUCKET_PARAMETER" \
            --query "Parameter.Value" \
            --output text 2>/dev/null || true)

          if [ -z "$LAMBDA_BUCKET_VALUE" ] || [ "$LAMBDA_BUCKET_VALUE" = "None" ]; then
            echo "Lambda artifact bucket parameter is not available yet."
            echo "Dashboard deployment will be retried by the update timer."
            exit 0
          fi

          echo "Using Lambda artifact bucket: $LAMBDA_BUCKET_VALUE"

          ARTIFACT_ETAG=$(aws s3api head-object \
            --region "$AWS_REGION_VALUE" \
            --bucket "$LAMBDA_BUCKET_VALUE" \
            --key "$DASHBOARD_KEY" \
            --query "ETag" \
            --output text 2>/dev/null || true)

          DB_CONFIG_ETAG=$(aws s3api head-object \
            --region "$AWS_REGION_VALUE" \
            --bucket "$LAMBDA_BUCKET_VALUE" \
            --key "$DB_HOST_CONFIG_KEY" \
            --query "ETag" \
            --output text 2>/dev/null || true)

          # On first boot, wait for the GitHub Actions artifacts.
          if [ ! -f "$STATE_FILE" ]; then
            for i in $(seq 1 60); do
              if [ -n "$ARTIFACT_ETAG" ] && [ "$ARTIFACT_ETAG" != "None" ] \
                 && [ -n "$DB_CONFIG_ETAG" ] && [ "$DB_CONFIG_ETAG" != "None" ]; then
                break
              fi

              if [ "$i" -eq 60 ]; then
                echo "ERROR: Dashboard artifacts were not found in S3 after waiting."
                exit 1
              fi

              echo "Dashboard artifacts not available yet. Waiting 10 seconds..."
              sleep 10

              ARTIFACT_ETAG=$(aws s3api head-object \
                --region "$AWS_REGION_VALUE" \
                --bucket "$LAMBDA_BUCKET_VALUE" \
                --key "$DASHBOARD_KEY" \
                --query "ETag" \
                --output text 2>/dev/null || true)

              DB_CONFIG_ETAG=$(aws s3api head-object \
                --region "$AWS_REGION_VALUE" \
                --bucket "$LAMBDA_BUCKET_VALUE" \
                --key "$DB_HOST_CONFIG_KEY" \
                --query "ETag" \
                --output text 2>/dev/null || true)
            done
          else
            # During periodic checks, do nothing when nothing changed.
            if [ -n "$ARTIFACT_ETAG" ] && [ -n "$DB_CONFIG_ETAG" ]; then
              if grep -q "^ARTIFACT_ETAG=$ARTIFACT_ETAG$" "$STATE_FILE" 2>/dev/null \
                 && grep -q "^DB_CONFIG_ETAG=$DB_CONFIG_ETAG$" "$STATE_FILE" 2>/dev/null; then
                if systemctl is-active --quiet cloudmart-dashboard; then
                  echo "Dashboard is already up to date."
                  exit 0
                fi
              fi
            else
              echo "Dashboard artifacts are temporarily unavailable. Keeping current deployment."
              exit 0
            fi
          fi

          echo "Reading dashboard database host configuration..."

          DB_HOST_VALUE=$(aws s3 cp \
            "s3://$LAMBDA_BUCKET_VALUE/$DB_HOST_CONFIG_KEY" \
            - \
            --region "$AWS_REGION_VALUE")

          DB_HOST_VALUE=$(printf '%s' "$DB_HOST_VALUE" | tr -d '\r\n')

          if [ -z "$DB_HOST_VALUE" ]; then
            echo "ERROR: Database host configuration is empty."
            exit 1
          fi

          echo "Downloading dashboard artifact..."
          aws s3 cp \
            "s3://$LAMBDA_BUCKET_VALUE/$DASHBOARD_KEY" \
            "$ZIP_FILE" \
            --region "$AWS_REGION_VALUE"

          rm -rf "$DASHBOARD_DIR"/*
          unzip -o "$ZIP_FILE" -d "$DASHBOARD_DIR"
          rm -f "$ZIP_FILE"

          if [ ! -f "$DASHBOARD_DIR/app.py" ]; then
            echo "ERROR: app.py is missing from the dashboard package."
            exit 1
          fi

          if [ ! -f "$DASHBOARD_DIR/requirements.txt" ]; then
            echo "ERROR: requirements.txt is missing from the dashboard package."
            exit 1
          fi

          if [ ! -x "$DASHBOARD_DIR/venv/bin/python" ]; then
            rm -rf "$DASHBOARD_DIR/venv"
            python3 -m venv "$DASHBOARD_DIR/venv"
          fi

          "$DASHBOARD_DIR/venv/bin/pip" install --upgrade pip
          "$DASHBOARD_DIR/venv/bin/pip" install -r "$DASHBOARD_DIR/requirements.txt"

          # Gunicorn is required by cloudmart-dashboard.service.
          # Install it explicitly so the service does not depend on
          # dashboard/requirements.txt containing the web server package.
          "$DASHBOARD_DIR/venv/bin/pip" install gunicorn

          if [ ! -x "$DASHBOARD_DIR/venv/bin/gunicorn" ]; then
            echo "ERROR: Gunicorn installation failed."
            exit 1
          fi

          echo "Gunicorn installed successfully: $("$DASHBOARD_DIR/venv/bin/gunicorn" --version)"

          cat > /etc/cloudmart-dashboard.env <<ENVEOF
          AWS_REGION=$AWS_REGION_VALUE
          ENVIRONMENT=dev
          API_NAME=cloudmart-api-dev
          API_STAGE=dev
          REPORTS_BUCKET=cloudmart-reports-${AWS::AccountId}-${AWS::Region}
          DB_HOST=$DB_HOST_VALUE
          DB_NAME=cloudmart
          DB_USER=cloudmartadmin
          DB_PORT=3306
          DB_PASSWORD_PARAMETER=/cloudmart/dev/database/password
          ENVEOF

          chown root:root /etc/cloudmart-dashboard.env
          chmod 600 /etc/cloudmart-dashboard.env
          chown -R ec2-user:ec2-user "$DASHBOARD_DIR"

          printf 'ARTIFACT_ETAG=%s\nDB_CONFIG_ETAG=%s\n' \
            "$ARTIFACT_ETAG" "$DB_CONFIG_ETAG" > "$TMP_STATE_FILE"
          mv "$TMP_STATE_FILE" "$STATE_FILE"

          systemctl daemon-reload

          # Verify the exact executable used by systemd exists before starting.
          if [ ! -x "$DASHBOARD_DIR/venv/bin/gunicorn" ]; then
            echo "ERROR: $DASHBOARD_DIR/venv/bin/gunicorn does not exist."
            exit 1
          fi

          systemctl enable cloudmart-dashboard
          systemctl restart cloudmart-dashboard

          sleep 3

          if ! systemctl is-active --quiet cloudmart-dashboard; then
            echo "ERROR: CloudMart dashboard service is not active."
            systemctl status cloudmart-dashboard --no-pager || true
            journalctl -u cloudmart-dashboard -n 80 --no-pager || true
            exit 1
          fi

          echo "Dashboard deployment completed."
          DEPLOYEOF

          chmod 755 /usr/local/bin/cloudmart-dashboard-deploy.sh

          cat > /etc/systemd/system/cloudmart-dashboard.service <<'SERVICEEOF'
          [Unit]
          Description=CloudMart Flask Dashboard
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=ec2-user
          WorkingDirectory=/opt/cloudmart-dashboard
          EnvironmentFile=/etc/cloudmart-dashboard.env
          ExecStart=/opt/cloudmart-dashboard/venv/bin/gunicorn --bind 0.0.0.0:5000 --workers 2 --timeout 60 app:app
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICEEOF

          cat > /etc/systemd/system/cloudmart-dashboard-update.service <<UPDATEEOF
          [Unit]
          Description=CloudMart Dashboard Package Update
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/cloudmart-dashboard-deploy.sh "$AWS_REGION_VALUE" "$LAMBDA_BUCKET_PARAMETER" "$DASHBOARD_KEY" "$DB_HOST_CONFIG_KEY"
          UPDATEEOF

          cat > /etc/systemd/system/cloudmart-dashboard-update.timer <<TIMEREOF
          [Unit]
          Description=Check for CloudMart Dashboard Updates

          [Timer]
          OnBootSec=2min
          OnUnitActiveSec=1min
          Unit=cloudmart-dashboard-update.service

          [Install]
          WantedBy=timers.target
          TIMEREOF

          systemctl daemon-reload

          systemctl enable cloudmart-dashboard-update.service

          # Try the first dashboard deployment now. If the GitHub Actions
          # artifacts are not in S3 yet, keep NGINX running and let the
          # update timer retry automatically.
          if systemctl start cloudmart-dashboard-update.service; then
            echo "Initial dashboard deployment completed."
          else
            echo "Initial dashboard deployment is not ready yet."
            echo "The dashboard update timer will retry automatically."
          fi

          systemctl enable --now cloudmart-dashboard-update.timer

          # The deployment script starts/restarts Gunicorn only after the
          # dashboard files and environment are ready.
          if systemctl is-active --quiet cloudmart-dashboard; then
            systemctl enable cloudmart-dashboard.service
          else
            echo "CloudMart dashboard service is waiting for the next successful artifact deployment."
          fi

          # NGINX must remain available independently of the Flask deployment.
          systemctl enable --now nginx

          echo "CloudMart dashboard bootstrap completed." 
      Tags:
        - Key: Name
          Value: !Sub cloudmart-ec2-${AWS::StackName}


  # ================================================================
  # VPC ENDPOINT - S3
  # GATEWAY ENDPOINT
  # ================================================================

  S3VPCEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC
      VpcEndpointType: Gateway

      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3

      RouteTableIds:
        - !Ref PrivateRouteTable

      Tags:
        - Key: Name
          Value: cloudmart-s3-vpc-endpoint


  # ================================================================
  # VPC ENDPOINT - SSM
  # INTERFACE ENDPOINT
  # ================================================================

  SSMVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC
      VpcEndpointType: Interface

      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet
        - !Ref PrivateSubnet2

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

      Tags:
        - Key: Name
          Value: cloudmart-ssm-vpc-endpoint


  # ================================================================
  # VPC ENDPOINT - SNS
  # INTERFACE ENDPOINT
  # ================================================================

  SNSVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
