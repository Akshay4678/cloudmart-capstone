AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Network Stack


# ================================================================
# PARAMETERS
# ================================================================

Parameters:

  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16
    Description: CloudMart VPC CIDR block


  DashboardIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to access the dashboard


  SSHIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed for SSH access


# ================================================================
# RESOURCES
# ================================================================

Resources:


  # ================================================================
  # VPC
  # ================================================================

  CloudMartVPC:
    Type: AWS::EC2::VPC

    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true

      Tags:
        - Key: Name
          Value: cloudmart-vpc


  # ================================================================
  # INTERNET GATEWAY
  # ================================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway

    Properties:
      Tags:
        - Key: Name
          Value: cloudmart-igw


  # ================================================================
  # INTERNET GATEWAY ATTACHMENT
  # ================================================================

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment

    Properties:
      VpcId: !Ref CloudMartVPC
      InternetGatewayId: !Ref InternetGateway


  # ================================================================
  # PUBLIC SUBNET
  # EC2 DASHBOARD
  # ================================================================

  PublicSubnet:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true

      AvailabilityZone: !Select
        - 0
        - !GetAZs ''

      Tags:
        - Key: Name
          Value: cloudmart-public-subnet


  # ================================================================
  # PRIVATE APPLICATION SUBNET
  # LAMBDA FUNCTIONS
  # ================================================================

  PrivateSubnet:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: 10.0.2.0/24

      AvailabilityZone: !Select
        - 0
        - !GetAZs ''

      Tags:
        - Key: Name
          Value: cloudmart-private-app-subnet


  # ================================================================
  # SECOND PRIVATE SUBNET
  # RDS / VPC ENDPOINTS
  # ================================================================

  PrivateSubnet2:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: 10.0.3.0/24

      AvailabilityZone: !Select
        - 1
        - !GetAZs ''

      Tags:
        - Key: Name
          Value: cloudmart-private-db-subnet


  # ================================================================
  # PUBLIC ROUTE TABLE
  # ================================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:
      VpcId: !Ref CloudMartVPC

      Tags:
        - Key: Name
          Value: cloudmart-public-route-table


  # ================================================================
  # PUBLIC DEFAULT ROUTE
  # ================================================================

  PublicRoute:
    Type: AWS::EC2::Route

    DependsOn: AttachGateway

    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway


  # ================================================================
  # PUBLIC SUBNET ASSOCIATION
  # ================================================================

  PublicSubnetAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet


  # ================================================================
  # PRIVATE ROUTE TABLE
  # ================================================================

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:
      VpcId: !Ref CloudMartVPC

      Tags:
        - Key: Name
          Value: cloudmart-private-route-table


  # ================================================================
  # PRIVATE SUBNET ASSOCIATION
  # ================================================================

  PrivateSubnetAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet


  # ================================================================
  # SECOND PRIVATE SUBNET ASSOCIATION
  # ================================================================

  PrivateSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet2


  # ================================================================
  # SECURITY GROUP - LAMBDA
  # ================================================================

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: CloudMart Lambda security group
      VpcId: !Ref CloudMartVPC

      # No default outbound rules.
      # Required outbound rules are defined separately below.
      SecurityGroupEgress: []

      Tags:
        - Key: Name
          Value: cloudmart-lambda-sg


  # ================================================================
  # SECURITY GROUP - VPC ENDPOINTS
  # ================================================================

  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: CloudMart VPC endpoint security group
      VpcId: !Ref CloudMartVPC

      # No default outbound rules.
      SecurityGroupEgress: []

      Tags:
        - Key: Name
          Value: cloudmart-vpc-endpoints-sg


  # ================================================================
  # SECURITY GROUP - RDS
  # ================================================================

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: CloudMart RDS MySQL security group
      VpcId: !Ref CloudMartVPC

      # No default inbound rules.
      # RDS access is defined separately below.
      # No default outbound rules.
      SecurityGroupEgress: []

      Tags:
        - Key: Name
          Value: cloudmart-rds-sg


  # ================================================================
  # SECURITY GROUP - EC2 DASHBOARD
  # ================================================================

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: CloudMart EC2 dashboard security group
      VpcId: !Ref CloudMartVPC

      # No default outbound rules.
      # Required outbound rules are defined separately below.
      SecurityGroupEgress: []

      Tags:
        - Key: Name
          Value: cloudmart-ec2-sg


  # ================================================================
  # LAMBDA -> RDS
  # TCP 3306
  # ================================================================

  LambdaToRDSEgress:
    Type: AWS::EC2::SecurityGroupEgress

    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      DestinationSecurityGroupId: !Ref RDSSecurityGroup


  # ================================================================
  # LAMBDA -> VPC ENDPOINTS
  # TCP 443
  # ================================================================

  LambdaToVPCEndpointEgress:
    Type: AWS::EC2::SecurityGroupEgress

    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref VPCEndpointSecurityGroup


  # ================================================================
  # RDS <- LAMBDA
  # TCP 3306
  # ================================================================

  RDSFromLambdaIngress:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref RDSSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref LambdaSecurityGroup


  # ================================================================
  # RDS <- EC2
  # TCP 3306
  # ================================================================

  RDSFromEC2Ingress:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref RDSSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref EC2SecurityGroup


  # ================================================================
  # EC2 -> RDS
  # TCP 3306
  # ================================================================

  EC2ToRDSEgress:
    Type: AWS::EC2::SecurityGroupEgress

    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      DestinationSecurityGroupId: !Ref RDSSecurityGroup


  # ================================================================
  # EC2 -> INTERNET
  # HTTPS 443
  # ================================================================

  EC2ToInternetHTTPS:
    Type: AWS::EC2::SecurityGroupEgress

    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0


  # ================================================================
  # VPC ENDPOINTS <- LAMBDA
  # HTTPS 443
  # ================================================================

  VPCEndpointFromLambdaIngress:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref VPCEndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref LambdaSecurityGroup


  # ================================================================
  # EC2 DASHBOARD
  # HTTPS 443
  # ================================================================

  EC2HTTPSIngress:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref DashboardIngressCidr


  # ================================================================
  # EC2 DASHBOARD
  # HTTP 80
  # ================================================================

  EC2HTTPIngress:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: !Ref DashboardIngressCidr


  # ================================================================
  # EC2 DASHBOARD
  # FLASK 5000
  # ================================================================

  EC2FlaskIngress:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 5000
      ToPort: 5000
      CidrIp: !Ref DashboardIngressCidr


  # ================================================================
  # EC2 DASHBOARD
  # SSH 22
  # ================================================================

  EC2SSHIngress:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: !Ref SSHIngressCidr


  # ================================================================
  # VPC ENDPOINT - DYNAMODB
  # GATEWAY ENDPOINT
  # ================================================================

  DynamoDBVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC
      VpcEndpointType: Gateway

      ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb

      RouteTableIds:
        - !Ref PrivateRouteTable

      Tags:
        - Key: Name
          Value: cloudmart-dynamodb-vpc-endpoint


  # ================================================================
  # VPC ENDPOINT - S3
  # GATEWAY ENDPOINT
  # ================================================================

  S3VPCEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC
      VpcEndpointType: Gateway

      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3

      RouteTableIds:
        - !Ref PrivateRouteTable

      Tags:
        - Key: Name
          Value: cloudmart-s3-vpc-endpoint


  # ================================================================
  # VPC ENDPOINT - SSM
  # INTERFACE ENDPOINT
  # ================================================================

  SSMVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC
      VpcEndpointType: Interface

      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet
        - !Ref PrivateSubnet2

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

      Tags:
        - Key: Name
          Value: cloudmart-ssm-vpc-endpoint


  # ================================================================
  # VPC ENDPOINT - SNS
  # INTERFACE ENDPOINT
  # ================================================================

  SNSVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC
      VpcEndpointType: Interface

      ServiceName: !Sub com.amazonaws.${AWS::Region}.sns

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet
        - !Ref PrivateSubnet2

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

      Tags:
        - Key: Name
          Value: cloudmart-sns-vpc-endpoint


  # ================================================================
  # VPC ENDPOINT - EVENTBRIDGE
  # INTERFACE ENDPOINT
  # ================================================================

  EventBridgeVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC
      VpcEndpointType: Interface

      ServiceName: !Sub com.amazonaws.${AWS::Region}.events

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet
        - !Ref PrivateSubnet2

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

      Tags:
        - Key: Name
          Value: cloudmart-eventbridge-vpc-endpoint

  # ================================================================
  # VPC ENDPOINT - SQS
  # INTERFACE ENDPOINT
  # ================================================================

  SQSVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC
      VpcEndpointType: Interface

      ServiceName: !Sub com.amazonaws.${AWS::Region}.sqs

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet
        - !Ref PrivateSubnet2

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

      Tags:
        - Key: Name
          Value: cloudmart-sqs-vpc-endpoint
          
  # ================================================================
  # VPC ENDPOINT - CLOUDWATCH LOGS
  # INTERFACE ENDPOINT
  # ================================================================

  CloudWatchLogsVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC
      VpcEndpointType: Interface

      ServiceName: !Sub com.amazonaws.${AWS::Region}.logs

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet
        - !Ref PrivateSubnet2

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

      Tags:
        - Key: Name
          Value: cloudmart-cloudwatch-logs-vpc-endpoint


  # ================================================================
  # VPC ENDPOINT - CLOUDWATCH MONITORING
  # INTERFACE ENDPOINT
  # ================================================================

  CloudWatchMonitoringVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint

    Properties:
      VpcId: !Ref CloudMartVPC
      VpcEndpointType: Interface

      ServiceName: !Sub com.amazonaws.${AWS::Region}.monitoring

      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet
        - !Ref PrivateSubnet2

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

      Tags:
        - Key: Name
          Value: cloudmart-cloudwatch-monitoring-vpc-endpoint


# ================================================================
# OUTPUTS
# ================================================================

Outputs:


  # ================================================================
  # VPC
  # ================================================================

  VPCId:
    Description: CloudMart VPC ID
    Value: !Ref CloudMartVPC

    Export:
      Name: cloudmart-vpc-id


  # ================================================================
  # PUBLIC SUBNET
  # ================================================================

  PublicSubnetId:
    Description: CloudMart public subnet ID
    Value: !Ref PublicSubnet

    Export:
      Name: cloudmart-public-subnet-id


  # ================================================================
  # PRIVATE APPLICATION SUBNET
  # ================================================================

  PrivateSubnetId:
    Description: CloudMart private application subnet ID
    Value: !Ref PrivateSubnet

    Export:
      Name: cloudmart-private-subnet-id


  # ================================================================
  # SECOND PRIVATE SUBNET
  # ================================================================

  PrivateSubnet2Id:
    Description: CloudMart second private subnet ID
    Value: !Ref PrivateSubnet2

    Export:
      Name: cloudmart-private-subnet-2-id


  # ================================================================
  # LAMBDA SECURITY GROUP
  # ================================================================

  LambdaSG:
    Description: CloudMart Lambda security group ID
    Value: !Ref LambdaSecurityGroup

    Export:
      Name: cloudmart-lambda-sg


  # ================================================================
  # RDS SECURITY GROUP
  # ================================================================

  RDSSG:
    Description: CloudMart RDS security group ID
    Value: !Ref RDSSecurityGroup

    Export:
      Name: cloudmart-rds-sg


  # ================================================================
  # EC2 SECURITY GROUP
  # ================================================================

  EC2SG:
    Description: CloudMart EC2 security group ID
    Value: !Ref EC2SecurityGroup

    Export:
      Name: cloudmart-ec2-sg


  # ================================================================
  # VPC ENDPOINT SECURITY GROUP
  # ================================================================

  VPCEndpointSG:
    Description: CloudMart VPC endpoint security group ID
    Value: !Ref VPCEndpointSecurityGroup

    Export:
      Name: cloudmart-vpc-endpoint-sg


  # ================================================================
  # EVENTBRIDGE ENDPOINT
  # ================================================================

  EventBridgeEndpointId:
    Description: CloudMart EventBridge VPC endpoint ID
    Value: !Ref EventBridgeVPCEndpoint

    Export:
      Name: cloudmart-eventbridge-vpc-endpoint


  # ================================================================
  # DYNAMODB ENDPOINT
  # ================================================================

  DynamoDBEndpointId:
    Description: CloudMart DynamoDB VPC endpoint ID
    Value: !Ref DynamoDBVPCEndpoint

    Export:
      Name: cloudmart-dynamodb-vpc-endpoint


  # ================================================================
  # S3 ENDPOINT
  # ================================================================

  S3EndpointId:
    Description: CloudMart S3 VPC endpoint ID
    Value: !Ref S3VPCEndpoint

    Export:
      Name: cloudmart-s3-vpc-endpoint


  # ================================================================
  # SSM ENDPOINT
  # ================================================================

  SSMEndpointId:
    Description: CloudMart SSM VPC endpoint ID
    Value: !Ref SSMVPCEndpoint

    Export:
      Name: cloudmart-ssm-vpc-endpoint


  # ================================================================
  # SNS ENDPOINT
  # ================================================================

  SNSEndpointId:
    Description: CloudMart SNS VPC endpoint ID
    Value: !Ref SNSVPCEndpoint

    Export:
      Name: cloudmart-sns-vpc-endpoint


  # ================================================================
  # CLOUDWATCH LOGS ENDPOINT
  # ================================================================

  CloudWatchLogsEndpointId:
    Description: CloudMart CloudWatch Logs VPC endpoint ID
    Value: !Ref CloudWatchLogsVPCEndpoint

    Export:
      Name: cloudmart-cloudwatch-logs-vpc-endpoint


  # ================================================================
  # CLOUDWATCH MONITORING ENDPOINT
  # ================================================================

  CloudWatchMonitoringEndpointId:
    Description: CloudMart CloudWatch Monitoring VPC endpoint ID
    Value: !Ref CloudWatchMonitoringVPCEndpoint

    Export:
      Name: cloudmart-cloudwatch-monitoring-vpc-endpoint