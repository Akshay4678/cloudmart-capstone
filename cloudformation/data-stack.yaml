AWSTemplateFormatVersion: '2010-09-09'
Description: CloudMart Data Stack

Parameters:

  DBName:
    Type: String
    Default: cloudmart

  DBUsername:
    Type: String
    Default: admin

  DBPassword:
    Type: String
    NoEcho: true

Resources:

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: CloudMart DB Subnet Group
      SubnetIds:
        - Fn::ImportValue: cloudmart-private-subnet-id
        - Fn::ImportValue: cloudmart-private-subnet-2-id

  CloudMartDB:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: cloudmart-db
      Engine: mysql
      EngineVersion: "8.0.39"
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      StorageType: gp3
      MultiAZ: false
      PubliclyAccessible: false
      StorageEncrypted: true
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      VPCSecurityGroups:
        - Fn::ImportValue: cloudmart-rds-sg
      DBSubnetGroupName: !Ref DBSubnetGroup
      BackupRetentionPeriod: 7
      DeletionProtection: false

  LambdaArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub cloudmart-lambda-${AWS::AccountId}-${AWS::Region}

  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub cloudmart-reports-${AWS::AccountId}-${AWS::Region}

  DBUsernameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cloudmart/db/username
      Type: String
      Value: !Ref DBUsername

  DBPasswordParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cloudmart/db/password
      Type: SecureString
      Value: !Ref DBPassword

Outputs:

  DatabaseIdentifier:
    Description: RDS Database Identifier
    Value: !Ref CloudMartDB

  DatabaseEndpoint:
    Description: RDS Endpoint
    Value: !GetAtt CloudMartDB.Endpoint.Address

  DatabasePort:
    Description: RDS Port
    Value: !GetAtt CloudMartDB.Endpoint.Port

  DatabaseSubnetGroup:
    Description: DB Subnet Group
    Value: !Ref DBSubnetGroup

  LambdaArtifactsBucket:
    Description: Lambda Deployment Bucket
    Value: !Ref LambdaArtifactsBucket

  ReportsBucket:
    Description: Reports Bucket
    Value: !Ref ReportsBucket

  DBUsernameSSM:
    Description: Username Parameter
    Value: !Ref DBUsernameParameter

  DBPasswordSSM:
    Description: Password Parameter
    Value: !Ref DBPasswordParameter