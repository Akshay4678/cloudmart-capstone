name: Deploy CloudMart Infrastructure


# ================================================================
# TRIGGERS
# ================================================================

on:

  workflow_dispatch:

  push:
    branches:
      - M3-redobranch


# ================================================================
# GITHUB PERMISSIONS
# ================================================================

permissions:

  id-token: write
  contents: read


# ================================================================
# JOB
# ================================================================

jobs:

  deploy:

    runs-on: ubuntu-latest

    env:

      AWS_REGION: ap-south-1

      ENVIRONMENT_NAME: dev


    steps:


      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ==========================================================
      # 2. AWS CREDENTIALS
      # ==========================================================

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      # ==========================================================
      # 3. VERIFY AWS ACCESS
      # ==========================================================

      - name: Verify AWS Access

        run: |

          echo "=================================================="
          echo "AWS IDENTITY"
          echo "=================================================="

          aws sts get-caller-identity


      # ==========================================================
      # 4. CHECK REQUIRED SECRETS
      # ==========================================================

      - name: Check Required Secrets

        env:


          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

          KEY_PAIR_NAME: ${{ secrets.KEY_PAIR_NAME }}

          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

        run: |

          echo "=================================================="
          echo "CHECKING REQUIRED SECRETS"
          echo "=================================================="


          if [ -z "$AWS_ROLE_ARN" ]; then

            echo "ERROR: AWS_ROLE_ARN secret is missing."

            exit 1

          fi


          if [ -z "$DB_PASSWORD" ]; then

            echo "ERROR: DB_PASSWORD secret is missing."

            exit 1

          fi


          if [ -z "$KEY_PAIR_NAME" ]; then

            echo "ERROR: KEY_PAIR_NAME secret is missing."

            exit 1

          fi


          if [ -z "$EC2_SSH_PRIVATE_KEY" ]; then

            echo "ERROR: EC2_SSH_PRIVATE_KEY secret is missing."

            exit 1

          fi


          echo "Required secrets are configured."


      # ==========================================================
      # 5. INSTALL CFN-LINT
      # ==========================================================

      - name: Install cfn-lint

        run: |

          python -m pip install --upgrade pip

          pip install cfn-lint


      # ==========================================================
      # 6. VALIDATE NETWORK
      # ==========================================================

      - name: Validate Network Stack

        run: |

          echo "=================================================="
          echo "VALIDATING NETWORK STACK"
          echo "=================================================="


          cfn-lint \
            --non-zero-exit-code error \
            cloudformation/network-stack.yaml


          aws cloudformation validate-template \
            --region "$AWS_REGION" \
            --template-body file://cloudformation/network-stack.yaml


          echo "Network stack validation passed."


      # ==========================================================
      # 7. VALIDATE DATA
      # ==========================================================

      - name: Validate Data Stack

        run: |

          echo "=================================================="
          echo "VALIDATING DATA STACK"
          echo "=================================================="


          cfn-lint \
            --non-zero-exit-code error \
            cloudformation/data-stack.yaml


          aws cloudformation validate-template \
            --region "$AWS_REGION" \
            --template-body file://cloudformation/data-stack.yaml


          echo "Data stack validation passed."


      # ==========================================================
      # 8. VALIDATE IAM
      # ==========================================================

      - name: Validate IAM Stack

        run: |

          echo "=================================================="
          echo "VALIDATING IAM STACK"
          echo "=================================================="


          cfn-lint \
            --non-zero-exit-code error \
            cloudformation/iam-stack.yaml


          aws cloudformation validate-template \
            --region "$AWS_REGION" \
            --template-body file://cloudformation/iam-stack.yaml


          echo "IAM stack validation passed."


      # ==========================================================
      # 9. VALIDATE AUTH
      # ==========================================================

      - name: Validate Auth Stack

        run: |

          echo "=================================================="
          echo "VALIDATING AUTH STACK"
          echo "=================================================="


          cfn-lint \
            --non-zero-exit-code error \
            cloudformation/auth-stack.yaml


          aws cloudformation validate-template \
            --region "$AWS_REGION" \
            --template-body file://cloudformation/auth-stack.yaml


          echo "Auth stack validation passed."


      # ==========================================================
      # 10. VALIDATE APPLICATION
      # ==========================================================

      - name: Validate Application Stack

        run: |

          echo "=================================================="
          echo "VALIDATING APPLICATION STACK"
          echo "=================================================="


          cfn-lint \
            --non-zero-exit-code error \
            cloudformation/api-stack.yaml


          aws cloudformation validate-template \
            --region "$AWS_REGION" \
            --template-body file://cloudformation/api-stack.yaml


          echo "Application stack validation passed."


      # ==========================================================
      # 11. VALIDATE MILESTONE 5 SOURCES
      # ==========================================================

      - name: Validate Milestone 5 Sources
        run: |
          set -e

          echo "=================================================="
          echo "VALIDATING MILESTONE 5 SOURCES"
          echo "=================================================="

          test -f cloudformation/monitoring-stack.yaml
          test -f dashboard/app.py
          test -f dashboard/requirements.txt
          test -f lambda/report/lambda_function.py
          test -f lambda/report/requirements.txt

          python -m py_compile             dashboard/app.py             lambda/report/lambda_function.py

          cfn-lint             --non-zero-exit-code error             cloudformation/monitoring-stack.yaml

          aws cloudformation validate-template             --region "$AWS_REGION"             --template-body file://cloudformation/monitoring-stack.yaml

          echo "Milestone 5 source validation passed."


      # ==========================================================
      # 12. CHECK LAMBDA SOURCE FILES
      # ==========================================================

      - name: Check Lambda Source Files

        run: |

          echo "=================================================="
          echo "CHECKING LAMBDA SOURCE FILES"
          echo "=================================================="


          echo ""
          echo "Current directory:"
          pwd


          echo ""
          echo "Checking Product Lambda..."


          if [ ! -f "lambda/product/lambda_function.py" ]; then

            echo "ERROR: Missing lambda/product/lambda_function.py"

            exit 1

          fi


          if [ ! -f "lambda/product/requirements.txt" ]; then

            echo "ERROR: Missing lambda/product/requirements.txt"

            exit 1

          fi


          echo "Product Lambda files OK."


          echo ""
          echo "Checking Order Lambda..."


          if [ ! -f "lambda/order/lambda_function.py" ]; then

            echo "ERROR: Missing lambda/order/lambda_function.py"

            exit 1

          fi


          if [ ! -f "lambda/order/requirements.txt" ]; then

            echo "ERROR: Missing lambda/order/requirements.txt"

            exit 1

          fi


          echo "Order Lambda files OK."


          echo ""
          echo "Checking Order Processor Lambda..."


          if [ ! -f "lambda/order_processor/lambda_function.py" ]; then

            echo "ERROR: Missing lambda/order_processor/lambda_function.py"

            exit 1

          fi


          if [ ! -f "lambda/order_processor/requirements.txt" ]; then

            echo "ERROR: Missing lambda/order_processor/requirements.txt"

            exit 1

          fi


          echo "Order Processor Lambda files OK."


          echo ""
          echo "Checking Report Lambda..."


          if [ ! -f "lambda/report/lambda_function.py" ]; then

            echo "ERROR: Missing lambda/report/lambda_function.py"

            exit 1

          fi


          if [ ! -f "lambda/report/requirements.txt" ]; then

            echo "ERROR: Missing lambda/report/requirements.txt"

            exit 1

          fi


          echo "Report Lambda files OK."


          echo ""
          echo "Checking Dashboard source files..."

          if [ ! -f "dashboard/app.py" ]; then
            echo "ERROR: Missing dashboard/app.py"
            exit 1
          fi

          if [ ! -f "dashboard/requirements.txt" ]; then
            echo "ERROR: Missing dashboard/requirements.txt"
            exit 1
          fi

          echo "Dashboard files OK."


          echo ""
          echo "Checking root schema.sql..."


          if [ ! -f "schema.sql" ]; then

            echo "ERROR: Missing root schema.sql"

            echo "Expected location: schema.sql"

            exit 1

          fi


          echo "schema.sql OK."


          echo ""
          echo "=================================================="
          echo "ALL REQUIRED SOURCE FILES ARE PRESENT"
          echo "=================================================="


      # ==========================================================
      # 13. VERIFY LAMBDA REQUIREMENTS
      # ==========================================================

      - name: Verify Lambda Requirements

        run: |

          set -e

          echo "=================================================="
          echo "VERIFYING LAMBDA REQUIREMENTS"
          echo "=================================================="

          echo ""
          echo "Product Lambda requirements:"
          cat lambda/product/requirements.txt

          echo ""
          echo "Order Lambda requirements:"
          cat lambda/order/requirements.txt

          echo ""
          echo "Order Processor Lambda requirements:"
          cat lambda/order_processor/requirements.txt

          echo ""
          echo "Report Lambda requirements:"
          cat lambda/report/requirements.txt

          echo ""
          echo "Checking required dependencies..."

          grep -Eiq '^[[:space:]]*PyMySQL([[:space:]]*[<>=!~].*)?([[:space:]]*#.*)?$' \
            lambda/order/requirements.txt || {
            echo "ERROR: PyMySQL missing from Order Lambda."
            exit 1
          }

          grep -Eiq '^[[:space:]]*cryptography([[:space:]]*[<>=!~].*)?([[:space:]]*#.*)?$' \
            lambda/order/requirements.txt || {
            echo "ERROR: cryptography missing from Order Lambda."
            exit 1
          }

          grep -Eiq '^[[:space:]]*cffi([[:space:]]*[<>=!~].*)?([[:space:]]*#.*)?$' \
            lambda/order/requirements.txt || {
            echo "ERROR: cffi missing from Order Lambda."
            exit 1
          }

          grep -Eiq '^[[:space:]]*PyMySQL([[:space:]]*[<>=!~].*)?([[:space:]]*#.*)?$' \
            lambda/order_processor/requirements.txt || {
            echo "ERROR: PyMySQL missing from Order Processor Lambda."
            exit 1
          }

          grep -Eiq '^[[:space:]]*cryptography([[:space:]]*[<>=!~].*)?([[:space:]]*#.*)?$' \
            lambda/order_processor/requirements.txt || {
            echo "ERROR: cryptography missing from Order Processor Lambda."
            exit 1
          }

          # cffi is installed together with cryptography during packaging.
          # It does not have to be listed separately in requirements.txt.
          echo "Order Processor cffi will be installed during packaging."

          grep -Eiq '^[[:space:]]*cryptography([[:space:]]*[<>=!~].*)?([[:space:]]*#.*)?$' \
            lambda/product/requirements.txt || {
            echo "ERROR: cryptography missing from Product Lambda."
            exit 1
          }

          echo "All required Lambda dependencies are present."


      # ==========================================================
      # 14. PACKAGE LAMBDAS
      # ==========================================================

      - name: Package Lambda Functions

        run: |

          echo "=================================================="
          echo "PACKAGING LAMBDA FUNCTIONS"
          echo "=================================================="


          rm -rf build


          mkdir -p build/product
          mkdir -p build/order
          mkdir -p build/order_processor
          mkdir -p build/report


          # ------------------------------------------------------
          # PRODUCT
          # ------------------------------------------------------

          echo ""
          echo "Packaging Product Lambda..."


          cp \
            lambda/product/lambda_function.py \
            build/product/index.py


          python -m pip install \
            --no-cache-dir \
            -r lambda/product/requirements.txt \
            -t build/product


          if [ ! -f "build/product/index.py" ]; then

            echo "ERROR: Product index.py was not created."

            exit 1

          fi


          cd build/product


          zip -r \
            ../product-lambda-${{ github.sha }}.zip \
            .


          cd ../..


          # ------------------------------------------------------
          # ORDER
          # ------------------------------------------------------

          echo ""
          echo "Packaging Order Lambda..."


          cp \
            lambda/order/lambda_function.py \
            build/order/index.py


          # schema.sql is deliberately packaged inside
          # the Order Lambda so that the VPC Lambda can
          # execute it against private RDS.

          cp \
            schema.sql \
            build/order/schema.sql


          python -m pip install \
            --upgrade \
            --no-cache-dir \
            --target build/order \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.13 \
            --only-binary=:all: \
            -r lambda/order/requirements.txt


          if [ ! -f "build/order/index.py" ]; then

            echo "ERROR: Order index.py was not created."

            exit 1

          fi


          if [ ! -f "build/order/schema.sql" ]; then

            echo "ERROR: schema.sql was not copied into Order Lambda."

            exit 1

          fi


          if [ ! -d "build/order/pymysql" ]; then

            echo "ERROR: PyMySQL missing from Order Lambda."

            exit 1

          fi


          test -d build/order/cryptography
          test -d build/order/cffi
          test -f build/order/_cffi_backend*.so

          echo "Order Lambda contains cryptography, cffi, and _cffi_backend."


          echo "Order Lambda package contents:"
          ls -la build/order


          cd build/order


          zip -r \
            ../order-lambda-${{ github.sha }}.zip \
            .


          cd ../..

          unzip -l "build/order-lambda-${{ github.sha }}.zip" | grep -q "cryptography/"
          unzip -l "build/order-lambda-${{ github.sha }}.zip" | grep -q "cffi/"
          unzip -l "build/order-lambda-${{ github.sha }}.zip" | grep -q "_cffi_backend"

          echo "Verified cryptography and cffi inside Order Lambda ZIP."


          # ------------------------------------------------------
          # ORDER PROCESSOR
          # ------------------------------------------------------

          echo ""
          echo "Packaging Order Processor Lambda..."


          cp \
            lambda/order_processor/lambda_function.py \
            build/order_processor/index.py


          python -m pip install \
            --upgrade \
            --no-cache-dir \
            --target build/order_processor \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.13 \
            --only-binary=:all: \
            -r lambda/order_processor/requirements.txt \
            cffi==1.17.1


          if [ ! -f "build/order_processor/index.py" ]; then

            echo "ERROR: Order Processor index.py was not created."

            exit 1

          fi


          if [ ! -d "build/order_processor/pymysql" ]; then

            echo "ERROR: PyMySQL missing from Order Processor."

            exit 1

          fi


          test -d build/order_processor/cryptography
          test -d build/order_processor/cffi
          test -f build/order_processor/_cffi_backend*.so

          echo "Order Processor contains cryptography, cffi, and _cffi_backend."


          cd build/order_processor


          zip -r \
            ../order-processor-${{ github.sha }}.zip \
            .


          cd ../..


          # ------------------------------------------------------
          # REPORT
          # ------------------------------------------------------

          echo ""
          echo "Packaging Report Lambda..."


          cp \
            lambda/report/lambda_function.py \
            build/report/index.py


          python -m pip install \
            --no-cache-dir \
            -r lambda/report/requirements.txt \
            -t build/report


          if [ ! -f "build/report/index.py" ]; then

            echo "ERROR: Report index.py was not created."

            exit 1

          fi


          if [ ! -d "build/report/pymysql" ]; then

            echo "ERROR: PyMySQL missing from Report Lambda."

            exit 1

          fi


          cd build/report


          zip -r \
            ../report-lambda-${{ github.sha }}.zip \
            .


          cd ../..


          echo ""
          echo "All Lambda packages created."


      # ==========================================================
      # 15. VERIFY PACKAGES
      # ==========================================================

      - name: Verify Lambda Packages

        run: |

          echo "=================================================="
          echo "VERIFYING LAMBDA PACKAGES"
          echo "=================================================="


          if [ ! -s "build/product-lambda-${{ github.sha }}.zip" ]; then

            echo "ERROR: Product Lambda ZIP is missing."

            exit 1

          fi


          if [ ! -s "build/order-lambda-${{ github.sha }}.zip" ]; then

            echo "ERROR: Order Lambda ZIP is missing."

            exit 1

          fi


          if [ ! -s "build/order-processor-${{ github.sha }}.zip" ]; then

            echo "ERROR: Order Processor ZIP is missing."

            exit 1

          fi


          if [ ! -s "build/report-lambda-${{ github.sha }}.zip" ]; then

            echo "ERROR: Report Lambda ZIP is missing."

            exit 1

          fi


          echo ""
          echo "Checking Order Lambda package..."


          if ! unzip -l \
            "build/order-lambda-${{ github.sha }}.zip" \
            | grep -qi "pymysql"; then

            echo "ERROR: PyMySQL not found inside Order Lambda ZIP."

            exit 1

          fi


          if ! unzip -l \
            "build/order-lambda-${{ github.sha }}.zip" \
            | grep -qi "schema.sql"; then

            echo "ERROR: schema.sql not found inside Order Lambda ZIP."

            exit 1

          fi


          if ! unzip -l \
            "build/order-lambda-${{ github.sha }}.zip" \
            | grep -qi "index.py"; then

            echo "ERROR: index.py not found inside Order Lambda ZIP."

            exit 1

          fi


          echo "Order Lambda contains:"
          echo "  - index.py"
          echo "  - PyMySQL"
          echo "  - schema.sql"


          echo ""
          echo "All Lambda packages are valid."


      # ==========================================================
      # 16. DEPLOY NETWORK
      # ==========================================================

      - name: Deploy Network Stack
        id: deploy_network
        env:
          KEY_PAIR_NAME: ${{ secrets.KEY_PAIR_NAME }}
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "DEPLOYING NETWORK STACK"
          echo "=================================================="

          if [ -z "$KEY_PAIR_NAME" ]; then
            echo "ERROR: KEY_PAIR_NAME secret is missing."
            exit 1
          fi

          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')

          if [ -z "$RUNNER_IP" ]; then
            echo "ERROR: Could not determine GitHub Actions runner public IP."
            exit 1
          fi

          echo "Using EC2 key pair: $KEY_PAIR_NAME"
          echo "Allowing SSH from GitHub Actions runner: $RUNNER_IP/32"

          aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name cloudmart-network-stack \
            --template-file cloudformation/network-stack.yaml \
            --parameter-overrides \
              "KeyPairName=$KEY_PAIR_NAME" \
              "SSHIngressCidr=$RUNNER_IP/32" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

          echo "Network stack deployment completed."
      # ==========================================================
      # 17. NETWORK ERRORS
      # ==========================================================

      - name: Show Network Stack Errors

        if: failure() && steps.deploy_network.outcome == 'failure'

        run: |

          echo "=================================================="
          echo "NETWORK STACK EVENTS"
          echo "=================================================="


          aws cloudformation describe-stack-events \
            --region "$AWS_REGION" \
            --stack-name cloudmart-network-stack \
            --query "StackEvents[0:40].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table \
            || true


      # ==========================================================
      # 18. DEPLOY IAM
      # ==========================================================

      - name: Deploy IAM Stack

        id: deploy_iam

        run: |

          echo "=================================================="
          echo "DEPLOYING IAM STACK"
          echo "=================================================="


          aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name cloudmart-iam-stack \
            --template-file cloudformation/iam-stack.yaml \
            --parameter-overrides \
              "EnvironmentName=$ENVIRONMENT_NAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


          echo "IAM stack deployment completed."


      # ==========================================================
      # 19. IAM ERRORS
      # ==========================================================

      - name: Show IAM Stack Errors

        if: failure() && steps.deploy_iam.outcome == 'failure'

        run: |

          echo "=================================================="
          echo "IAM STACK EVENTS"
          echo "=================================================="


          aws cloudformation describe-stack-events \
            --region "$AWS_REGION" \
            --stack-name cloudmart-iam-stack \
            --query "StackEvents[0:50].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table \
            || true


      # ==========================================================
      # 20. DEPLOY AUTH
      # ==========================================================

      - name: Deploy Auth Stack

        id: deploy_auth

        run: |

          echo "=================================================="
          echo "DEPLOYING AUTH STACK"
          echo "=================================================="


          aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name cloudmart-auth-stack \
            --template-file cloudformation/auth-stack.yaml \
            --parameter-overrides \
              "EnvironmentName=$ENVIRONMENT_NAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


          echo "Auth stack deployment completed."


      # ==========================================================
      # 21. AUTH ERRORS
      # ==========================================================

      - name: Show Auth Stack Errors

        if: failure() && steps.deploy_auth.outcome == 'failure'

        run: |

          echo "=================================================="
          echo "AUTH STACK EVENTS"
          echo "=================================================="


          aws cloudformation describe-stack-events \
            --region "$AWS_REGION" \
            --stack-name cloudmart-auth-stack \
            --query "StackEvents[0:50].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table \
            || true


      # Authentication token is stored in the customers table.
      # No authentication token is created in SSM.


      # ==========================================================
      # 22. CHECK DATA STACK
      #
      # The Data stack already exists in the current environment.
      #
      # If it does not exist, create it before the API because
      # the API stack needs its RDS/bucket outputs.
      # ==========================================================

      - name: Ensure Data Stack Exists

        id: ensure_data

        env:

          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

        run: |

          echo "=================================================="
          echo "CHECKING DATA STACK"
          echo "=================================================="


          if aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-data-stack \
            >/dev/null 2>&1; then

            echo "Data stack already exists."

            echo "deploy_data_first=false" >> "$GITHUB_OUTPUT"

          else

            echo "Data stack does not exist."

            echo "Creating Data stack before Application stack..."

            aws cloudformation deploy \
              --region "$AWS_REGION" \
              --stack-name cloudmart-data-stack \
              --template-file cloudformation/data-stack.yaml \
              --parameter-overrides \
                "DBPassword=$DB_PASSWORD" \
              --no-fail-on-empty-changeset

            echo "Data stack created."

            echo "deploy_data_first=true" >> "$GITHUB_OUTPUT"

          fi


      # ==========================================================
      # 23. GET LAMBDA ARTIFACT BUCKET
      # ==========================================================

      - name: Get Lambda Artifact Bucket

        id: lambda_bucket

        run: |

          echo "=================================================="
          echo "GETTING LAMBDA ARTIFACT BUCKET"
          echo "=================================================="


          BUCKET=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-data-stack \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaBucket'].OutputValue" \
            --output text)


          echo "Lambda artifact bucket: $BUCKET"


          if [ -z "$BUCKET" ] || [ "$BUCKET" = "None" ]; then

            echo "ERROR: Lambda artifact bucket not found."

            exit 1

          fi


          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"


      # ==========================================================
      # 24. PACKAGE DASHBOARD
      # ==========================================================

      - name: Package Dashboard
        run: |
          set -e

          echo "=================================================="
          echo "PACKAGING EC2 DASHBOARD"
          echo "=================================================="

          rm -rf build/dashboard
          mkdir -p build/dashboard

          cp dashboard/app.py build/dashboard/app.py
          cp dashboard/requirements.txt build/dashboard/requirements.txt

          python -m py_compile build/dashboard/app.py

          cd build/dashboard
          zip -r "../cloudmart-dashboard-${{ github.sha }}.zip" .
          cd ../..

          test -s "build/cloudmart-dashboard-${{ github.sha }}.zip"

          echo "Dashboard package created successfully."


      # ==========================================================
      # 25. UPLOAD DASHBOARD PACKAGE
      # ==========================================================

      - name: Upload Dashboard Package
        run: |
          set -e

          echo "Uploading Dashboard package..."

          aws s3 cp             "build/cloudmart-dashboard-${{ github.sha }}.zip"             "s3://${{ steps.lambda_bucket.outputs.bucket }}/dashboard/cloudmart-dashboard-${{ github.sha }}.zip"

          echo "Dashboard package uploaded."


      # ==========================================================
      # 26. UPLOAD PRODUCT
      # ==========================================================

      - name: Upload Product Lambda

        run: |

          echo "Uploading Product Lambda..."


          aws s3 cp \
            "build/product-lambda-${{ github.sha }}.zip" \
            "s3://${{ steps.lambda_bucket.outputs.bucket }}/product/product-lambda-${{ github.sha }}.zip"


          echo "Product Lambda uploaded."


      # ==========================================================
      # 27. UPLOAD ORDER
      # ==========================================================

      - name: Upload Order Lambda

        run: |

          echo "Uploading Order Lambda..."


          aws s3 cp \
            "build/order-lambda-${{ github.sha }}.zip" \
            "s3://${{ steps.lambda_bucket.outputs.bucket }}/order/order-lambda-${{ github.sha }}.zip"


          echo "Order Lambda uploaded."


      # ==========================================================
      # 28. UPLOAD ORDER PROCESSOR
      # ==========================================================

      - name: Upload Order Processor Lambda

        run: |

          echo "Uploading Order Processor Lambda..."


          aws s3 cp \
            "build/order-processor-${{ github.sha }}.zip" \
            "s3://${{ steps.lambda_bucket.outputs.bucket }}/order-processor/order-processor-${{ github.sha }}.zip"


          echo "Order Processor Lambda uploaded."


      # ==========================================================
      # 29. UPLOAD REPORT
      # ==========================================================

      - name: Upload Report Lambda

        run: |

          echo "Uploading Report Lambda..."


          aws s3 cp \
            "build/report-lambda-${{ github.sha }}.zip" \
            "s3://${{ steps.lambda_bucket.outputs.bucket }}/report/report-lambda-${{ github.sha }}.zip"


          echo "Report Lambda uploaded."


      # ==========================================================
      # 30. DEPLOY APPLICATION
      #
      # IMPORTANT:
      # This happens before updating an existing Data stack.
      #
      # This allows the Application stack to remove old imports
      # before the Data stack attempts to remove old exports.
      # ==========================================================

      - name: Deploy Application Stack

        id: deploy_application

        env:

          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

        run: |

          echo "=================================================="
          echo "DEPLOYING APPLICATION STACK"
          echo "=================================================="


          aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name cloudmart-api-stack \
            --template-file cloudformation/api-stack.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              "DBPassword=$DB_PASSWORD" \
              "CodeVersion=${{ github.sha }}" \
              "EnvironmentName=$ENVIRONMENT_NAME" \
            --no-fail-on-empty-changeset


          echo "Application stack deployment completed."


      # ==========================================================
      # 31. APPLICATION ERRORS
      # ==========================================================

      - name: Show Application Stack Errors

        if: failure() && steps.deploy_application.outcome == 'failure'

        run: |

          echo "=================================================="
          echo "APPLICATION STACK EVENTS"
          echo "=================================================="


          aws cloudformation describe-stack-events \
            --region "$AWS_REGION" \
            --stack-name cloudmart-api-stack \
            --query "StackEvents[0:60].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table \
            || true


      # ==========================================================
      # 32. UPDATE DATA STACK
      #
      # For an existing environment this happens AFTER the API
      # stack update, which removes old imports from the API stack.
      #
      # This is important for removing old DynamoDB exports.
      # ==========================================================

      - name: Deploy Data Stack

        id: deploy_data

        env:

          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

        run: |

          echo "=================================================="
          echo "UPDATING DATA STACK"
          echo "=================================================="


          aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name cloudmart-data-stack \
            --template-file cloudformation/data-stack.yaml \
            --parameter-overrides \
              "DBPassword=$DB_PASSWORD" \
            --no-fail-on-empty-changeset


          echo "Data stack deployment completed."


      # ==========================================================
      # 33. DATA ERRORS
      # ==========================================================

      - name: Show Data Stack Errors

        if: failure() && steps.deploy_data.outcome == 'failure'

        run: |

          echo "=================================================="
          echo "DATA STACK EVENTS"
          echo "=================================================="


          aws cloudformation describe-stack-events \
            --region "$AWS_REGION" \
            --stack-name cloudmart-data-stack \
            --query "StackEvents[0:60].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table \
            || true


      # ==========================================================
      # 34. INITIALIZE RDS DATABASE SCHEMA
      #
      # schema.sql is packaged inside Order Lambda.
      #
      # The Order Lambda is inside the VPC and can connect to
      # the private RDS MySQL database.
      # ==========================================================

      - name: Initialize RDS Database Schema

        id: initialize_schema

        run: |

          echo "=================================================="
          echo "INITIALIZING RDS DATABASE SCHEMA"
          echo "=================================================="


          FUNCTION_NAME="cloudmart-order-${ENVIRONMENT_NAME}"


          echo "Order Lambda: $FUNCTION_NAME"


          cat > /tmp/schema-init.json <<'EOF'
          {
            "action": "initialize_schema"
          }
          EOF


          echo ""
          echo "Invoking Order Lambda..."


          rm -f /tmp/schema-init-response.json


          aws lambda invoke \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --payload fileb:///tmp/schema-init.json \
            --cli-binary-format raw-in-base64-out \
            /tmp/schema-init-response.json


          echo ""
          echo "=================================================="
          echo "SCHEMA INITIALIZATION RESPONSE"
          echo "=================================================="


          cat /tmp/schema-init-response.json


          echo ""


          # ------------------------------------------------------
          # Check whether Lambda returned a function error.
          # ------------------------------------------------------

          if grep -qi '"FunctionError"' /tmp/schema-init-response.json; then

            echo "ERROR: Lambda reported a FunctionError."

            exit 1

          fi


          # ------------------------------------------------------
          # Check the Lambda response body/status.
          #
          # Our Lambda returns:
          #
          # {
          #   "statusCode": 200,
          #   ...
          # }
          # ------------------------------------------------------

          if grep -q '"statusCode"[[:space:]]*:[[:space:]]*500' \
            /tmp/schema-init-response.json; then

            echo "ERROR: Database schema initialization returned HTTP 500."

            exit 1

          fi


          if grep -q '"statusCode"[[:space:]]*:[[:space:]]*400' \
            /tmp/schema-init-response.json; then

            echo "ERROR: Database schema initialization returned HTTP 400."

            exit 1

          fi


          if ! grep -q '"statusCode"[[:space:]]*:[[:space:]]*200' \
            /tmp/schema-init-response.json; then

            echo "ERROR: Did not receive successful schema initialization response."

            exit 1

          fi


          echo ""
          echo "Database schema initialized successfully."


      # ==========================================================
      # 35. MILESTONE 5 - DEPLOY MONITORING STACK
      # ==========================================================

      - name: Deploy Monitoring Stack
        id: deploy_monitoring
        run: |
          set -e

          echo "=================================================="
          echo "DEPLOYING MILESTONE 5 MONITORING STACK"
          echo "=================================================="

          aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name cloudmart-monitoring-stack \
            --template-file cloudformation/monitoring-stack.yaml \
            --parameter-overrides \
              "EnvironmentName=$ENVIRONMENT_NAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

          echo "Monitoring stack deployment completed."


      # ==========================================================
      # 36. MILESTONE 5 - GET EXISTING EC2 AND REPORT OUTPUTS
      # ==========================================================

      - name: Get Milestone 5 Outputs
        id: milestone5_outputs
        run: |
          set -e

          REPORTS_BUCKET=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-data-stack \
            --query "Stacks[0].Outputs[?OutputKey=='ReportsBucket'].OutputValue" \
            --output text)

          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-network-stack \
            --query "Stacks[0].Outputs[?OutputKey=='EC2InstanceId'].OutputValue" \
            --output text)

          DB_HOST=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-data-stack \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseEndpoint'].OutputValue" \
            --output text)

          PUBLIC_IP=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-network-stack \
            --query "Stacks[0].Outputs[?OutputKey=='EC2PublicIP'].OutputValue" \
            --output text)

          for value in "$REPORTS_BUCKET" "$INSTANCE_ID" "$DB_HOST" "$PUBLIC_IP"; do
            if [ -z "$value" ] || [ "$value" = "None" ]; then
              echo "ERROR: Required Milestone 5 CloudFormation output is missing."
              exit 1
            fi
          done

          echo "reports_bucket=$REPORTS_BUCKET" >> "$GITHUB_OUTPUT"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "db_host=$DB_HOST" >> "$GITHUB_OUTPUT"
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

          echo "Reports bucket: $REPORTS_BUCKET"
          echo "EC2 instance: $INSTANCE_ID"
          echo "EC2 public IP: $PUBLIC_IP"


      # ==========================================================
      # 37. MILESTONE 5 - GIVE EC2 REQUIRED ACCESS
      # ==========================================================

      - name: Configure Existing EC2 IAM Permissions
        run: |
          set -e

          INSTANCE_ID="${{ steps.milestone5_outputs.outputs.instance_id }}"
          REPORTS_BUCKET="${{ steps.milestone5_outputs.outputs.reports_bucket }}"
          LAMBDA_BUCKET="${{ steps.lambda_bucket.outputs.bucket }}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          PROFILE_ARN=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].IamInstanceProfile.Arn" \
            --output text)

          if [ -z "$PROFILE_ARN" ] || [ "$PROFILE_ARN" = "None" ]; then
            echo "ERROR: Existing EC2 has no IAM instance profile."
            exit 1
          fi

          PROFILE_NAME="${PROFILE_ARN##*/}"

          ROLE_NAME=$(aws iam get-instance-profile \
            --instance-profile-name "$PROFILE_NAME" \
            --query "InstanceProfile.Roles[0].RoleName" \
            --output text)

          if [ -z "$ROLE_NAME" ] || [ "$ROLE_NAME" = "None" ]; then
            echo "ERROR: Could not determine EC2 IAM role."
            exit 1
          fi

          cat > /tmp/cloudmart-dashboard-policy.json <<EOF
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "ReadReports",
                "Effect": "Allow",
                "Action": [
                  "s3:ListBucket"
                ],
                "Resource": "arn:aws:s3:::$REPORTS_BUCKET"
              },
              {
                "Sid": "ReadReportObjects",
                "Effect": "Allow",
                "Action": [
                  "s3:GetObject"
                ],
                "Resource": "arn:aws:s3:::$REPORTS_BUCKET/*"
              },
              {
                "Sid": "DownloadDashboardPackage",
                "Effect": "Allow",
                "Action": [
                  "s3:GetObject"
                ],
                "Resource": "arn:aws:s3:::$LAMBDA_BUCKET/dashboard/*"
              },
              {
                "Sid": "ReadDatabasePassword",
                "Effect": "Allow",
                "Action": [
                  "ssm:GetParameter"
                ],
                "Resource": "arn:aws:ssm:$AWS_REGION:$ACCOUNT_ID:parameter/cloudmart/dev/database/password"
              }
            ]
          }
          EOF

          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name CloudMartDashboardAccess \
            --policy-document file:///tmp/cloudmart-dashboard-policy.json

          # Allow IAM permissions a few seconds to propagate before SSH deployment.
          sleep 5

          echo "Dashboard IAM permissions configured on role: $ROLE_NAME"


      # ==========================================================
      # 38. MILESTONE 5 - VERIFY DAILY REPORT SCHEDULE
      # ==========================================================

      - name: Verify Daily Report Schedule
        run: |
          set -e

          RULE_NAME="cloudmart-daily-report-rule-${ENVIRONMENT_NAME}"

          RULE_STATE=$(aws events describe-rule \
            --region "$AWS_REGION" \
            --name "$RULE_NAME" \
            --query "State" \
            --output text)

          SCHEDULE=$(aws events describe-rule \
            --region "$AWS_REGION" \
            --name "$RULE_NAME" \
            --query "ScheduleExpression" \
            --output text)

          TARGET_COUNT=$(aws events list-targets-by-rule \
            --region "$AWS_REGION" \
            --rule "$RULE_NAME" \
            --query "length(Targets)" \
            --output text)

          echo "Report rule: $RULE_NAME"
          echo "State: $RULE_STATE"
          echo "Schedule: $SCHEDULE"
          echo "Target count: $TARGET_COUNT"

          if [ "$RULE_STATE" != "ENABLED" ]; then
            echo "ERROR: Daily report EventBridge rule is not enabled."
            exit 1
          fi

          if [ "$TARGET_COUNT" -lt 1 ]; then
            echo "ERROR: Daily report EventBridge rule has no target."
            exit 1
          fi

          echo "Daily report schedule verification passed."



      # ==========================================================
      # 40. MILESTONE 5 - DEPLOY FLASK DASHBOARD TO EC2 VIA SSH
      # ==========================================================

      - name: Deploy Dashboard to EC2 via SSH
        id: deploy_dashboard
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          INSTANCE_ID="${{ steps.milestone5_outputs.outputs.instance_id }}"
          PUBLIC_IP="${{ steps.milestone5_outputs.outputs.public_ip }}"
          DB_HOST="${{ steps.milestone5_outputs.outputs.db_host }}"
          REPORTS_BUCKET="${{ steps.milestone5_outputs.outputs.reports_bucket }}"
          DASHBOARD_ZIP="build/cloudmart-dashboard-${{ github.sha }}.zip"

          echo "=================================================="
          echo "DEPLOYING DASHBOARD TO EC2 VIA SSH"
          echo "=================================================="
          echo "Instance: $INSTANCE_ID"
          echo "Public IP: $PUBLIC_IP"

          if [ ! -s "$DASHBOARD_ZIP" ]; then
            echo "ERROR: Dashboard ZIP not found: $DASHBOARD_ZIP"
            exit 1
          fi

          SSH_KEY="$RUNNER_TEMP/cloudmart-ec2-key.pem"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_KEY"
          chmod 600 "$SSH_KEY"

          SSH_OPTS=(
            -i "$SSH_KEY"
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )

          echo "Waiting for SSH on $PUBLIC_IP:22..."
          for i in $(seq 1 30); do
            if ssh "${SSH_OPTS[@]}" "ec2-user@$PUBLIC_IP" "echo SSH connection successful"; then
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "ERROR: EC2 SSH did not become available within 5 minutes."
              exit 1
            fi

            echo "SSH not ready yet. Waiting 10 seconds..."
            sleep 10
          done

          echo "Uploading dashboard package..."
          scp "${SSH_OPTS[@]}" \
            "$DASHBOARD_ZIP" \
            "ec2-user@$PUBLIC_IP:/tmp/cloudmart-dashboard.zip"

          cat > /tmp/deploy-dashboard-remote.sh <<'REMOTE_SCRIPT'
          #!/bin/bash
          set -euo pipefail

          DB_HOST="$1"
          REPORTS_BUCKET="$2"
          AWS_REGION_VALUE="$3"

          sudo dnf install -y python3 python3-pip unzip

          sudo mkdir -p /opt/cloudmart-dashboard
          sudo rm -rf /opt/cloudmart-dashboard/*
          sudo unzip -o /tmp/cloudmart-dashboard.zip -d /opt/cloudmart-dashboard
          sudo rm -f /tmp/cloudmart-dashboard.zip

          sudo rm -rf /opt/cloudmart-dashboard/venv
          sudo python3 -m venv /opt/cloudmart-dashboard/venv
          sudo /opt/cloudmart-dashboard/venv/bin/pip install --upgrade pip
          sudo /opt/cloudmart-dashboard/venv/bin/pip install -r /opt/cloudmart-dashboard/requirements.txt

          sudo tee /etc/cloudmart-dashboard.env > /dev/null <<ENVEOF
          AWS_REGION=$AWS_REGION_VALUE
          REPORTS_BUCKET=$REPORTS_BUCKET
          DB_HOST=$DB_HOST
          DB_NAME=cloudmart
          DB_USER=cloudmartadmin
          DB_PORT=3306
          DB_PASSWORD_PARAMETER=/cloudmart/dev/database/password
          ENVEOF

          sudo chmod 600 /etc/cloudmart-dashboard.env
          sudo chown root:root /etc/cloudmart-dashboard.env

          sudo tee /etc/systemd/system/cloudmart-dashboard.service > /dev/null <<'SERVICEEOF'
          [Unit]
          Description=CloudMart Flask Dashboard
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=ec2-user
          WorkingDirectory=/opt/cloudmart-dashboard
          EnvironmentFile=/etc/cloudmart-dashboard.env
          ExecStart=/opt/cloudmart-dashboard/venv/bin/gunicorn --bind 0.0.0.0:5000 --workers 2 --timeout 60 app:app
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICEEOF

          sudo chown -R ec2-user:ec2-user /opt/cloudmart-dashboard
          sudo systemctl daemon-reload
          sudo systemctl enable cloudmart-dashboard
          sudo systemctl restart cloudmart-dashboard

          sleep 3

          if ! sudo systemctl is-active --quiet cloudmart-dashboard; then
            echo "ERROR: CloudMart dashboard service is not active."
            sudo systemctl status cloudmart-dashboard --no-pager || true
            sudo journalctl -u cloudmart-dashboard -n 80 --no-pager || true
            exit 1
          fi

          curl -fsS http://127.0.0.1:5000/health
          echo
          echo "Dashboard deployed successfully."
          REMOTE_SCRIPT

          sed -i 's/^          //' /tmp/deploy-dashboard-remote.sh

          echo "Running dashboard deployment on EC2..."
          ssh "${SSH_OPTS[@]}" "ec2-user@$PUBLIC_IP" \
            "bash -s -- $(printf '%q' "$DB_HOST") $(printf '%q' "$REPORTS_BUCKET") $(printf '%q' "$AWS_REGION")" \
            < /tmp/deploy-dashboard-remote.sh

          rm -f "$SSH_KEY" /tmp/deploy-dashboard-remote.sh

          echo "Dashboard URL: http://$PUBLIC_IP:5000"
      # ==========================================================
      # 41. MILESTONE 5 - VERIFY CLOUDWATCH DASHBOARD AND ALARMS
      # ==========================================================

      - name: Verify Milestone 5 Monitoring
        run: |
          set -e

          echo "=================================================="
          echo "VERIFYING MILESTONE 5 MONITORING"
          echo "=================================================="

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-monitoring-stack \
            --query "Stacks[0].StackStatus" \
            --output text)

          if [ "$STACK_STATUS" != "CREATE_COMPLETE" ] && [ "$STACK_STATUS" != "UPDATE_COMPLETE" ]; then
            echo "ERROR: Monitoring stack status is $STACK_STATUS"
            exit 1
          fi

          aws cloudwatch get-dashboard \
            --region "$AWS_REGION" \
            --dashboard-name cloudmart-operations \
            >/dev/null

          ALARM_COUNT=$(aws cloudformation describe-stack-resources \
            --region "$AWS_REGION" \
            --stack-name cloudmart-monitoring-stack \
            --query "length(StackResourceSummaries[?ResourceType=='AWS::CloudWatch::Alarm'])" \
            --output text)

          echo "CloudWatch dashboard: cloudmart-operations"
          echo "CloudWatch alarms in monitoring stack: $ALARM_COUNT"

          if [ "$ALARM_COUNT" -lt 4 ]; then
            echo "ERROR: Expected at least four CloudWatch alarms."
            exit 1
          fi

          echo "Monitoring verification passed."


      # ==========================================================
      # 42. MILESTONE 5 - FINAL URLS
      # ==========================================================

      - name: Milestone 5 URLs
        run: |
          echo "=============================================="
          echo "CloudMart Milestone 5 deployment complete"
          echo "=============================================="
          echo "Dashboard: http://${{ steps.milestone5_outputs.outputs.public_ip }}:5000"
          echo "CloudWatch dashboard: cloudmart-operations"
          echo "=============================================="



      - name: Get API URL

        id: api_url

        run: |

          echo "=================================================="
          echo "GETTING API URL"
          echo "=================================================="


          API_URL=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-api-stack \
            --query "Stacks[0].Outputs[?OutputKey=='ApiInvokeUrl'].OutputValue" \
            --output text)


          echo "API URL: $API_URL"


          if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then

            echo "ERROR: API URL not found."

            exit 1

          fi


          echo "url=$API_URL" >> "$GITHUB_OUTPUT"


      # ==========================================================
      # 44. FINAL STACK STATUS
      # ==========================================================

      - name: Final CloudFormation Status

        if: always()

        run: |

          echo "=================================================="
          echo "FINAL CLOUDMART STACK STATUS"
          echo "=================================================="


          echo ""
          echo "===== NETWORK STACK ====="


          aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-network-stack \
            --query "Stacks[0].[StackName,StackStatus]" \
            --output table \
            || true


          echo ""
          echo "===== DATA STACK ====="


          aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-data-stack \
            --query "Stacks[0].[StackName,StackStatus]" \
            --output table \
            || true


          echo ""
          echo "===== IAM STACK ====="


          aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-iam-stack \
            --query "Stacks[0].[StackName,StackStatus]" \
            --output table \
            || true


          echo ""
          echo "===== AUTH STACK ====="


          aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-auth-stack \
            --query "Stacks[0].[StackName,StackStatus]" \
            --output table \
            || true


          echo ""
          echo "===== APPLICATION STACK ====="


          aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name cloudmart-api-stack \
            --query "Stacks[0].[StackName,StackStatus]" \
            --output table \
            || true


          echo ""
          echo "=================================================="
          echo "DEPLOYMENT WORKFLOW FINISHED"
          echo "=================================================="