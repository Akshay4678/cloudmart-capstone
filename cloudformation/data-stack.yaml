AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Data Stack

# ================================================================
# PARAMETERS
# ================================================================

Parameters:

  EnvironmentName:

    Type: String

    Default: dev

    AllowedValues:

      - dev

      - prod

    Description: CloudMart deployment environment

  DBName:

    Type: String

    Default: cloudmart

    Description: CloudMart RDS database name

  DBUsername:

    Type: String

    Default: cloudmartadmin

    Description: CloudMart RDS master username

  DBPassword:

    Type: String

    NoEcho: true

    MinLength: 8

    Description: CloudMart RDS master password

# ================================================================
# RESOURCES
# ================================================================

Resources:

  # ==============================================================
  # RDS SUBNET GROUP
  # ==============================================================
  RdsSubnetGroup:

    Type: AWS::RDS::DBSubnetGroup
    Properties:

      DBSubnetGroupDescription: CloudMart private RDS subnet group
      DBSubnetGroupName: !Sub cloudmart-rds-subnet-group-${EnvironmentName}
      SubnetIds:

        - Fn::ImportValue: !Sub cloudmart-private-subnet-id-${EnvironmentName}
        - Fn::ImportValue: !Sub cloudmart-private-subnet-2-id-${EnvironmentName}

      Tags:

        - Key: Name

          Value: !Sub cloudmart-rds-subnet-group-${EnvironmentName}

        - Key: Application

          Value: CloudMart

        - Key: Environment

          Value: !Ref EnvironmentName


  # ==============================================================
  # RDS MYSQL DATABASE
  #
  # Stores:
  #   Customers
  #   Products
  #   Orders
  #   Order Items
  #   Product History
  #
  # Database is private inside the VPC.
  # ==============================================================

  CloudMartDatabase:
    Type: AWS::RDS::DBInstance

    Properties:

      DBInstanceIdentifier: !Sub cloudmart-rds-${EnvironmentName}

      Engine: mysql

      EngineVersion: '8.4.11'

      AllowMajorVersionUpgrade: true

      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20

      StorageType: gp3
      StorageEncrypted: true

      MultiAZ: false

      PubliclyAccessible: false

      DBName:
        !Ref DBName


      MasterUsername:

        !Ref DBUsername

      MasterUserPassword:

        !Ref DBPassword

      Port: 3306

      VPCSecurityGroups:

        - Fn::ImportValue: !Sub cloudmart-rds-sg-${EnvironmentName}

      DBSubnetGroupName:

        !Ref RdsSubnetGroup

      BackupRetentionPeriod: 0

      DeletionProtection: false

      CopyTagsToSnapshot: true

      AutoMinorVersionUpgrade: true

      Tags:

        - Key: Name

          Value: !Sub cloudmart-rds-mysql-${EnvironmentName}

        - Key: Application

          Value: CloudMart

        - Key: Service



          Value: RDS

        - Key: Environment

          Value: !Ref EnvironmentName


  # ==============================================================
  # S3 REPORTS BUCKET
  # Report Lambda
  #       |
  #       v
  #      S3
  #       |
  #       v
  # EC2 Flask Dashboard
  #
  # CloudFormation generates a unique physical bucket name.
  # This avoids conflicts with buckets left by previous deployments.
  # ==============================================================
  ReportsBucket:

    Type: AWS::S3::Bucket

    Properties:
      BucketName: !Sub cloudmart-reports-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:

        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:

              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true

        BlockPublicPolicy: true

        IgnorePublicAcls: true

        RestrictPublicBuckets: true

      VersioningConfiguration:

        Status: Enabled

      Tags:

        - Key: Name

          Value: !Sub cloudmart-reports-${EnvironmentName}

        - Key: Service

          Value: CloudMart

        - Key: DataType


          Value: Reports

        - Key: Environment

          Value: !Ref EnvironmentName


  # ==============================================================
  # REPORTS BUCKET POLICY
  # The dashboard EC2 role is created in the Network stack, while
  # this bucket is created here. The bucket policy is therefore the
  # correct place to grant the EC2 role access to the real physical
  # bucket name generated by CloudFormation.
  # ==============================================================

  ReportsBucketPolicy:
    Type: AWS::S3::BucketPolicy

    Properties:
      Bucket: !Ref ReportsBucket

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Sid: AllowDashboardEC2ReadReports

            Effect: Allow

            Principal:

              AWS:

                Fn::ImportValue: !Sub cloudmart-ec2-instance-role-arn-${EnvironmentName}

            Action:

              - s3:GetObject

              - s3:GetObjectVersion

            Resource:

              - !Sub '${ReportsBucket.Arn}/*'

          - Sid: AllowDashboardEC2ListReports

            Effect: Allow

            Principal:

              AWS:

                Fn::ImportValue: !Sub cloudmart-ec2-instance-role-arn-${EnvironmentName}

            Action:

              - s3:ListBucket

            Resource:
              - !GetAtt ReportsBucket.Arn


            Condition:

              StringLike:

                s3:prefix:

                  - reports/*

                  - reports

  # ==============================================================
  # REPORTS BUCKET SSM PARAMETER
  # The dashboard reads the generated physical bucket name from SSM.
  # ==============================================================


  ReportsBucketParameter:



    Type: AWS::SSM::Parameter







    Properties:



      Name: !Sub /cloudmart/${EnvironmentName}/reports-bucket



      Type: String



      Value: !Ref ReportsBucket



      Description: CloudMart reports S3 bucket name



      Tier: Standard







      Tags:



        Application: CloudMart



        Environment: !Ref EnvironmentName



        Purpose: ReportsBucketConfiguration











  # ==============================================================



  # S3 LAMBDA ARTIFACTS BUCKET



  #



  # CloudFormation generates a unique physical bucket name.



  # ==============================================================







  LambdaArtifactsBucket:



    Type: AWS::S3::Bucket







    Properties:







      BucketName: !Sub cloudmart-lambda-artifacts-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}



      BucketEncryption:







        ServerSideEncryptionConfiguration:







          - ServerSideEncryptionByDefault:



              SSEAlgorithm: AES256







      PublicAccessBlockConfiguration:







        BlockPublicAcls: true







        BlockPublicPolicy: true







        IgnorePublicAcls: true







        RestrictPublicBuckets: true







      VersioningConfiguration:







        Status: Enabled







      Tags:







        - Key: Name



          Value: !Sub cloudmart-lambda-artifacts-${EnvironmentName}







        - Key: Service



          Value: CloudMart







        - Key: DataType



          Value: LambdaArtifacts







        - Key: Environment



          Value: !Ref EnvironmentName











  # ==============================================================



  # LAMBDA ARTIFACTS BUCKET POLICY



  # Allows only the CloudMart EC2 instance role to list this bucket



  # and read objects from it.



  # ==============================================================







  LambdaArtifactsBucketPolicy:



    Type: AWS::S3::BucketPolicy







    Properties:







      Bucket: !Ref LambdaArtifactsBucket







      PolicyDocument:







        Version: '2012-10-17'







        Statement:







          - Sid: AllowDashboardEC2ReadObjects



            Effect: Allow



            Principal:



              AWS:



                Fn::ImportValue: !Sub cloudmart-ec2-instance-role-arn-${EnvironmentName}



            Action:



              - s3:GetObject



              - s3:GetObjectVersion



            Resource:



              - !Sub '${LambdaArtifactsBucket.Arn}/*'







          - Sid: AllowDashboardEC2ListBucket



            Effect: Allow



            Principal:



              AWS:



                Fn::ImportValue: !Sub cloudmart-ec2-instance-role-arn-${EnvironmentName}



            Action:



              - s3:ListBucket



            Resource:



              - !GetAtt LambdaArtifactsBucket.Arn











# ================================================================



# OUTPUTS



# ================================================================







Outputs:











  # ================================================================



  # LEGACY EXPORTS - TEMPORARY MIGRATION COMPATIBILITY



  # ================================================================







  LegacyDatabaseIdentifier:



    Value: !Ref CloudMartDatabase



    Export:



      Name: cloudmart-database-identifier







  LegacyDatabaseResourceId:



    Value: !GetAtt CloudMartDatabase.DbiResourceId



    Export:



      Name: cloudmart-database-resource-id







  LegacyDatabaseEndpoint:



    Value: !GetAtt CloudMartDatabase.Endpoint.Address



    Export:



      Name: cloudmart-database-endpoint







  LegacyDatabasePort:



    Value: !GetAtt CloudMartDatabase.Endpoint.Port



    Export:



      Name: cloudmart-database-port







  LegacyDatabaseConnectionEndpoint:



    Value: !Sub



      - "${Endpoint}:${Port}"



      - Endpoint: !GetAtt CloudMartDatabase.Endpoint.Address



        Port: !GetAtt CloudMartDatabase.Endpoint.Port



    Export:



      Name: cloudmart-database-connection-endpoint







  LegacyDatabaseName:



    Value: !Ref DBName



    Export:



      Name: cloudmart-database-name







  LegacyDatabaseUsername:



    Value: !Ref DBUsername



    Export:



      Name: cloudmart-database-username







  LegacyDatabaseSubnetGroup:



    Value: !Ref RdsSubnetGroup



    Export:



      Name: cloudmart-database-subnet-group







  LegacyReportsBucket:



    Value: !Ref ReportsBucket



    Export:



      Name: cloudmart-reports-bucket







  LegacyReportsBucketArn:



    Value: !GetAtt ReportsBucket.Arn



    Export:



      Name: cloudmart-reports-bucket-arn







  LegacyLambdaBucket:



    Value: !Ref LambdaArtifactsBucket



    Export:



      Name: cloudmart-lambda-bucket







  LegacyLambdaBucketArn:



    Value: !GetAtt LambdaArtifactsBucket.Arn



    Export:



      Name: cloudmart-lambda-bucket-arn











  # ==============================================================



  # DATABASE IDENTIFIER



  # ==============================================================







  DatabaseIdentifier:







    Description: RDS MySQL Database Identifier







    Value:



      !Ref CloudMartDatabase







    Export:



      Name: !Sub cloudmart-database-identifier-${EnvironmentName}











  # ==============================================================



  # DATABASE RESOURCE ID



  # ==============================================================







  DatabaseResourceId:







    Description: RDS MySQL DB Resource ID







    Value:



      !GetAtt CloudMartDatabase.DbiResourceId







    Export:



      Name: !Sub cloudmart-database-resource-id-${EnvironmentName}











  # ==============================================================



  # DATABASE ENDPOINT



  # ==============================================================







  DatabaseEndpoint:







    Description: RDS MySQL Endpoint







    Value:



      !GetAtt CloudMartDatabase.Endpoint.Address







    Export:



      Name: !Sub cloudmart-database-endpoint-${EnvironmentName}











  # ==============================================================



  # DATABASE PORT



  # ==============================================================







  DatabasePort:







    Description: RDS MySQL Port







    Value:



      !GetAtt CloudMartDatabase.Endpoint.Port







    Export:



      Name: !Sub cloudmart-database-port-${EnvironmentName}











  # ==============================================================



  # MYSQL CONNECTION ENDPOINT



  # ==============================================================







  DatabaseConnectionEndpoint:







    Description: Complete MySQL connection endpoint for EC2







    Value:



      !Sub



        - "${Endpoint}:${Port}"



        - Endpoint:



            !GetAtt CloudMartDatabase.Endpoint.Address



          Port:



            !GetAtt CloudMartDatabase.Endpoint.Port







    Export:



      Name: !Sub cloudmart-database-connection-endpoint-${EnvironmentName}











  # ==============================================================



  # DATABASE NAME



  # ==============================================================







  DatabaseName:







    Description: CloudMart RDS Database Name







    Value:



      !Ref DBName







    Export:



      Name: !Sub cloudmart-database-name-${EnvironmentName}











  # ==============================================================



  # DATABASE USERNAME



  # ==============================================================







  DatabaseUsername:







    Description: CloudMart RDS Username







    Value:



      !Ref DBUsername







    Export:



      Name: !Sub cloudmart-database-username-${EnvironmentName}











  # ==============================================================



  # RDS SUBNET GROUP



  # ==============================================================







  DatabaseSubnetGroup:







    Description: CloudMart RDS Subnet Group







    Value:



      !Ref RdsSubnetGroup







    Export:



      Name: !Sub cloudmart-database-subnet-group-${EnvironmentName}











  # ==============================================================



  # REPORTS BUCKET



  # ==============================================================







  ReportsBucket:







    Description: S3 bucket used for CloudMart daily reports







    Value:



      !Ref ReportsBucket







    Export:



      Name: !Sub cloudmart-reports-bucket-${EnvironmentName}











  # ==============================================================



  # REPORTS BUCKET ARN



  # ==============================================================







  ReportsBucketArn:







    Description: ARN of the CloudMart reports bucket







    Value:



      !GetAtt ReportsBucket.Arn







    Export:



      Name: !Sub cloudmart-reports-bucket-arn-${EnvironmentName}











  # ==============================================================



  # LAMBDA ARTIFACTS BUCKET



  # ==============================================================







  LambdaBucket:







    Description: S3 bucket used for Lambda deployment packages







    Value:



      !Ref LambdaArtifactsBucket







    Export:



      Name: !Sub cloudmart-lambda-bucket-${EnvironmentName}











  # ==============================================================



  # LAMBDA ARTIFACTS BUCKET ARN



  # ==============================================================







  LambdaBucketArn:







    Description: ARN of the CloudMart Lambda deployment packages bucket







    Value:



      !GetAtt LambdaArtifactsBucket.Arn







    Export:



      Name: !Sub cloudmart-lambda-bucket-arn-${EnvironmentName}