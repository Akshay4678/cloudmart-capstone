AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Authentication Stack


# ================================================================
# PARAMETERS
# ================================================================

Parameters:

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: CloudMart deployment environment


# ================================================================
# RESOURCES
# ================================================================

Resources:


  # ==============================================================
  # SSM - APPLICATION ENVIRONMENT
  #
  # Non-sensitive configuration.
  #
  # Parameter:
  # /cloudmart/dev/app/environment
  # ==============================================================

  EnvironmentParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${EnvironmentName}/app/environment

      Type: String

      Value:
        !Ref EnvironmentName

      Description:
        CloudMart application environment

      Tier: Standard

      Tags:

        Application: CloudMart

        Environment:
          !Ref EnvironmentName

        Purpose: ApplicationConfiguration


  # ==============================================================
  # LAMBDA AUTHORIZER
  # ==============================================================

  AuthorizerLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-authorizer-${EnvironmentName}

      Runtime: python3.13

      Handler: index.lambda_handler

      Role:
        Fn::ImportValue: cloudmart-authorizer-role-arn

      Timeout: 10

      MemorySize: 128

      Environment:

        Variables:

          AUTH_TOKEN_PARAMETER:
            !Sub /cloudmart/${EnvironmentName}/auth/token

          APP_ENVIRONMENT_PARAMETER:
            !Sub /cloudmart/${EnvironmentName}/app/environment

      Code:

        ZipFile: |

          import os
          import boto3
          import hmac


          # =========================================================
          # AWS CLIENT
          # =========================================================

          ssm = boto3.client("ssm")


          # =========================================================
          # ENVIRONMENT VARIABLES
          # =========================================================

          AUTH_TOKEN_PARAMETER = os.environ[
              "AUTH_TOKEN_PARAMETER"
          ]

          APP_ENVIRONMENT_PARAMETER = os.environ[
              "APP_ENVIRONMENT_PARAMETER"
          ]


          # =========================================================
          # LAMBDA HANDLER
          # =========================================================

          def lambda_handler(event, context):

              print("========== AUTHORIZER START ==========")


              # =====================================================
              # GET AUTHORIZATION TOKEN
              # =====================================================

              authorization = event.get(
                  "authorizationToken",
                  ""
              )

              method_arn = event.get(
                  "methodArn",
                  ""
              )


              # =====================================================
              # VALIDATE AUTHORIZATION HEADER
              # =====================================================

              if not authorization:

                  print("TOKEN MISSING")

                  raise Exception("Unauthorized")


              # =====================================================
              # GET TOKEN FROM SSM
              #
              # The parameter is created as SecureString by the
              # deployment workflow.
              # ==============================================================

              try:

                  parameter = ssm.get_parameter(
                      Name=AUTH_TOKEN_PARAMETER,
                      WithDecryption=True
                  )

                  secret = parameter[
                      "Parameter"
                  ][
                      "Value"
                  ]


                  # =================================================
                  # COMPARE TOKEN
                  # =================================================

                  if not hmac.compare_digest(
                      authorization,
                      secret
                  ):

                      print("TOKEN INVALID")

                      raise Exception("Unauthorized")


                  print("TOKEN VALID")


                  # =================================================
                  # VALIDATE METHOD ARN
                  # =================================================

                  arn_parts = method_arn.split("/")


                  if len(arn_parts) < 3:

                      print("INVALID METHOD ARN")

                      raise Exception(
                          "Invalid methodArn"
                      )


                  # =================================================
                  # CREATE API ARN BASE
                  #
                  # Example:
                  #
                  # arn:aws:execute-api:ap-south-1:
                  # 123456789:abc123/prod/GET/products
                  #
                  # Base:
                  #
                  # arn:aws:execute-api:ap-south-1:
                  # 123456789:abc123/prod
                  # =================================================

                  api_arn_base = "/".join(
                      arn_parts[:2]
                  )


                  # =================================================
                  # ALLOW AUTHENTICATED API ACCESS
                  # =================================================

                  resource = (
                      api_arn_base
                      + "/*/*"
                  )


                  # =================================================
                  # RETURN IAM POLICY
                  # =================================================

                  return {

                      "principalId":
                          "cloudmart-user",

                      "policyDocument": {

                          "Version":
                              "2012-10-17",

                          "Statement": [

                              {

                                  "Action":
                                      "execute-api:Invoke",

                                  "Effect":
                                      "Allow",

                                  "Resource":
                                      resource

                              }

                          ]

                      },

                      "context": {

                          "user":
                              "cloudmart-user",

                          "environment":
                              os.environ[
                                  "APP_ENVIRONMENT_PARAMETER"
                              ]

                      }

                  }


              # =====================================================
              # AUTHORIZATION ERROR
              # =====================================================

              except Exception as e:

                  print(
                      "========== AUTHORIZER ERROR =========="
                  )

                  # Do NOT print the token or SSM secret.

                  print(
                      "Authorization failed:",
                      type(e).__name__
                  )

                  raise Exception(
                      "Unauthorized"
                  )


  # ==============================================================
  # API GATEWAY -> AUTHORIZER LAMBDA PERMISSION
  # ==============================================================

  AuthorizerPermission:
    Type: AWS::Lambda::Permission

    Properties:

      Action:
        lambda:InvokeFunction

      FunctionName:
        !Ref AuthorizerLambda

      Principal:
        apigateway.amazonaws.com


# ================================================================
# OUTPUTS
# ================================================================

Outputs:


  # ==============================================================
  # AUTHORIZE LAMBDA ARN
  # ==============================================================

  AuthorizerLambdaArn:

    Description:
      CloudMart Authorizer Lambda ARN

    Value:
      !GetAtt AuthorizerLambda.Arn

    Export:
      Name:
        cloudmart-authorizer-lambda-arn


  # ==============================================================
  # AUTHORIZE LAMBDA NAME
  # ==============================================================

  AuthorizerLambdaName:

    Description:
      CloudMart Authorizer Lambda Name

    Value:
      !Ref AuthorizerLambda

    Export:
      Name:
        cloudmart-authorizer-lambda-name


  # ==============================================================
  # AUTH TOKEN PARAMETER NAME
  #
  # The actual SecureString parameter is created by the
  # deployment workflow using AWS SSM PutParameter.
  # ==============================================================

  AuthTokenParameterName:

    Description:
      CloudMart authentication token SSM parameter name

    Value:
      !Sub /cloudmart/${EnvironmentName}/auth/token

    Export:
      Name:
        cloudmart-auth-token-parameter


  # ==============================================================
  # ENVIRONMENT PARAMETER NAME
  # ==============================================================

  EnvironmentParameterName:

    Description:
      CloudMart environment SSM parameter name

    Value:
      !Ref EnvironmentParameter

    Export:
      Name:
        cloudmart-environment-parameter