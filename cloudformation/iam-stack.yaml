AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart IAM Stack

Parameters:

  DBUsername:
    Type: String
    Default: cloudmartadmin

  DBPassword:
    Type: String
    NoEcho: true

  AuthToken:
    Type: String
    NoEcho: true


Resources:

  #################################################
  # AUTHORIZER LAMBDA ROLE
  #################################################

  AuthorizerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudmart-authorizer-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: AuthorizerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: "*"


  #################################################
  # PRODUCT LAMBDA ROLE
  #################################################

  ProductLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudmart-product-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: ProductPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              #################################################
              # RDS
              #################################################

              - Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                Resource: "*"

              #################################################
              # SSM
              #################################################

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: "*"

              #################################################
              # EVENTBRIDGE
              #################################################

              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: "*"

              #################################################
              # VPC NETWORK INTERFACES
              #################################################

              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"


  #################################################
  # ORDER LAMBDA ROLE
  #################################################

  OrderLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudmart-order-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: OrderPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              #################################################
              # SNS
              #################################################

              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: "*"

              #################################################
              # SQS
              #################################################

              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                Resource: "*"

              #################################################
              # EVENTBRIDGE
              #################################################

              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: "*"

              #################################################
              # SSM
              #################################################

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: "*"

              #################################################
              # VPC NETWORK INTERFACES
              #################################################

              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"


  #################################################
  # REPORTING LAMBDA ROLE
  #################################################

  ReportLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudmart-report-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: ReportingPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              #################################################
              # S3
              #################################################

              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource: "*"

              #################################################
              # RDS
              #################################################

              - Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                Resource: "*"

              #################################################
              # SSM
              #################################################

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: "*"

              #################################################
              # VPC NETWORK INTERFACES
              #################################################

              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"


  #################################################
  # EVENTBRIDGE ROLE
  #################################################

  EventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cloudmart-eventbridge-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - events.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: EventBridgeSNSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: "*"


  #################################################
  # SSM PARAMETERS
  #################################################

  DBUsernameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cloudmart/db/username
      Type: String
      Value: !Ref DBUsername


  DBPasswordParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cloudmart/db/password
      Type: String
      Value: !Ref DBPassword


  AuthTokenParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cloudmart/auth/token
      Type: String
      Value: !Ref AuthToken


Outputs:

  #################################################
  # LAMBDA ROLE ARNs
  #################################################

  AuthorizerRoleArn:
    Value: !GetAtt AuthorizerLambdaRole.Arn
    Export:
      Name: cloudmart-authorizer-role-arn


  ProductRoleArn:
    Value: !GetAtt ProductLambdaRole.Arn
    Export:
      Name: cloudmart-product-role-arn


  OrderRoleArn:
    Value: !GetAtt OrderLambdaRole.Arn
    Export:
      Name: cloudmart-order-role-arn


  ReportRoleArn:
    Value: !GetAtt ReportLambdaRole.Arn
    Export:
      Name: cloudmart-report-role-arn


  #################################################
  # EVENTBRIDGE ROLE ARN
  #################################################

  EventBridgeRoleArn:
    Value: !GetAtt EventBridgeRole.Arn
    Export:
      Name: cloudmart-eventbridge-role-arn


  #################################################
  # SSM PARAMETER NAMES
  #################################################

  DBUsernameParameterName:
    Value: !Ref DBUsernameParameter


  DBPasswordParameterName:
    Value: !Ref DBPasswordParameter


  AuthTokenParameterName:
    Value: !Ref AuthTokenParameter