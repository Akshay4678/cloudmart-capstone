AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Data Stack


# ================================================================
# PARAMETERS
# ================================================================

Parameters:

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: CloudMart deployment environment

  DBName:
    Type: String
    Default: cloudmart
    Description: CloudMart RDS database name

  DBUsername:
    Type: String
    Default: cloudmartadmin
    Description: CloudMart RDS master username

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: CloudMart RDS master password

  NotificationEmail:
    Type: String
    Description: Email address used by CloudMart SNS notification subscriptions
    AllowedPattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
    ConstraintDescription: Must be a valid email address


# ================================================================
# RESOURCES
# ================================================================

Resources:

  # ==============================================================
  # RDS SUBNET GROUP
  # ==============================================================

  RdsSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup

    Properties:

      DBSubnetGroupDescription: CloudMart private RDS subnet group

      SubnetIds:

        - Fn::ImportValue:
            !Sub cloudmart-private-subnet-id-${EnvironmentName}

        - Fn::ImportValue:
            !Sub cloudmart-private-subnet-2-id-${EnvironmentName}

      Tags:

        - Key: Name
          Value: !Sub cloudmart-rds-subnet-group-${EnvironmentName}

        - Key: Application
          Value: CloudMart

        - Key: Environment
          Value: !Ref EnvironmentName


  # ==============================================================
  # RDS MYSQL DATABASE
  #
  # Stores:
  #   Customers
  #   Products
  #   Orders
  #   Order Items
  #   Product History
  #
  # Database is private inside the VPC.
  # ==============================================================

  CloudMartDatabase:
    Type: AWS::RDS::DBInstance

    Properties:

      Engine: mysql

      EngineVersion: '8.4.11'

      AllowMajorVersionUpgrade: true

      DBInstanceClass: db.t3.micro

      AllocatedStorage: 20

      StorageType: gp3

      StorageEncrypted: true

      MultiAZ: false

      PubliclyAccessible: false

      DBName:
        !Ref DBName

      MasterUsername:
        !Ref DBUsername

      MasterUserPassword:
        !Ref DBPassword

      Port: 3306

      VPCSecurityGroups:

        - Fn::ImportValue:
            !Sub cloudmart-rds-sg-${EnvironmentName}

      DBSubnetGroupName:
        !Ref RdsSubnetGroup

      BackupRetentionPeriod: 0

      DeletionProtection: false

      CopyTagsToSnapshot: true

      AutoMinorVersionUpgrade: true

      Tags:

        - Key: Name
          Value: !Sub cloudmart-rds-mysql-${EnvironmentName}

        - Key: Application
          Value: CloudMart

        - Key: Service
          Value: RDS

        - Key: Environment
          Value: !Ref EnvironmentName


  # ==============================================================
  # S3 REPORTS BUCKET
  #
  # Report Lambda
  #       |
  #       v
  #      S3
  #       |
  #       v
  # EC2 Flask Dashboard
  #
  # Bucket names are environment-specific so the same template
  # can be deployed to dev and prod without naming collisions.
  # ==============================================================

  ReportsBucket:
    Type: AWS::S3::Bucket

    Properties:

      BucketName: !Sub cloudmart-reports-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}

      BucketEncryption:

        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true

        BlockPublicPolicy: true

        IgnorePublicAcls: true

        RestrictPublicBuckets: true

      VersioningConfiguration:

        Status: Enabled

      Tags:

        - Key: Name
          Value: !Sub cloudmart-reports-${EnvironmentName}

        - Key: Service
          Value: CloudMart

        - Key: DataType
          Value: Reports

        - Key: Environment
          Value: !Ref EnvironmentName


  # ==============================================================
  # S3 LAMBDA ARTIFACTS BUCKET
  #
  # Bucket names are environment-specific so the same template
  # can be deployed to dev and prod without naming collisions.
  # ==============================================================

  LambdaArtifactsBucket:
    Type: AWS::S3::Bucket

    Properties:

      BucketName: !Sub cloudmart-lambda-artifacts-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}

      BucketEncryption:

        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true

        BlockPublicPolicy: true

        IgnorePublicAcls: true

        RestrictPublicBuckets: true

      VersioningConfiguration:

        Status: Enabled

      Tags:

        - Key: Name
          Value: !Sub cloudmart-lambda-artifacts-${EnvironmentName}

        - Key: Service
          Value: CloudMart

        - Key: DataType
          Value: LambdaArtifacts

        - Key: Environment
          Value: !Ref EnvironmentName


  # ==============================================================
  # DATABASE PASSWORD PARAMETER
  # ==============================================================

  DatabasePasswordParameter:
    Type: AWS::SSM::Parameter

    Properties:
      Name: !Sub /cloudmart/${EnvironmentName}/database/password
      Type: String
      Value: !Ref DBPassword
      Description: CloudMart RDS database password
      Tier: Standard
      Tags:
        Application: CloudMart
        Environment: !Ref EnvironmentName
        Purpose: DatabaseCredentials


  # ==============================================================
  # LAMBDA ARTIFACT BUCKET PARAMETER
  # ==============================================================

  LambdaArtifactBucketParameter:
    Type: AWS::SSM::Parameter

    Properties:
      Name: !Sub /cloudmart/${EnvironmentName}/lambda-artifact-bucket
      Type: String
      Value: !Ref LambdaArtifactsBucket
      Description: CloudMart Lambda artifact bucket name
      Tier: Standard
      Tags:
        Application: CloudMart
        Environment: !Ref EnvironmentName
        Purpose: LambdaArtifacts


  # ==============================================================
  # NOTIFICATION EMAIL PARAMETER
  # ==============================================================

  NotificationEmailParameter:
    Type: AWS::SSM::Parameter

    Properties:
      Name: !Sub /cloudmart/${EnvironmentName}/notification-email
      Type: String
      Value: !Ref NotificationEmail
      Description: CloudMart SNS notification email address
      Tier: Standard
      Tags:
        Application: CloudMart
        Environment: !Ref EnvironmentName
        Purpose: NotificationEmail


# ================================================================
# OUTPUTS
# ================================================================

Outputs:

  # ==============================================================
  # DATABASE IDENTIFIER
  # ==============================================================

  DatabaseIdentifier:

    Description: RDS MySQL Database Identifier

    Value:
      !Ref CloudMartDatabase

    Export:
      Name: !Sub cloudmart-database-identifier-${EnvironmentName}


  # ==============================================================
  # DATABASE RESOURCE ID
  # ==============================================================

  DatabaseResourceId:

    Description: RDS MySQL DB Resource ID

    Value:
      !GetAtt CloudMartDatabase.DbiResourceId

    Export:
      Name: !Sub cloudmart-database-resource-id-${EnvironmentName}


  # ==============================================================
  # DATABASE ENDPOINT
  # ==============================================================

  DatabaseEndpoint:

    Description: RDS MySQL Endpoint

    Value:
      !GetAtt CloudMartDatabase.Endpoint.Address

    Export:
      Name: !Sub cloudmart-database-endpoint-${EnvironmentName}


  # ==============================================================
  # DATABASE PORT
  # ==============================================================

  DatabasePort:

    Description: RDS MySQL Port

    Value:
      !GetAtt CloudMartDatabase.Endpoint.Port

    Export:
      Name: !Sub cloudmart-database-port-${EnvironmentName}


  # ==============================================================
  # MYSQL CONNECTION ENDPOINT
  # ==============================================================

  DatabaseConnectionEndpoint:

    Description: Complete MySQL connection endpoint for EC2

    Value:
      !Sub
        - "${Endpoint}:${Port}"
        - Endpoint:
            !GetAtt CloudMartDatabase.Endpoint.Address
          Port:
            !GetAtt CloudMartDatabase.Endpoint.Port

    Export:
      Name: !Sub cloudmart-database-connection-endpoint-${EnvironmentName}


  # ==============================================================
  # DATABASE NAME
  # ==============================================================

  DatabaseName:

    Description: CloudMart RDS Database Name

    Value:
      !Ref DBName

    Export:
      Name: !Sub cloudmart-database-name-${EnvironmentName}


  # ==============================================================
  # DATABASE USERNAME
  # ==============================================================

  DatabaseUsername:

    Description: CloudMart RDS Username

    Value:
      !Ref DBUsername

    Export:
      Name: !Sub cloudmart-database-username-${EnvironmentName}


  # ==============================================================
  # RDS SUBNET GROUP
  # ==============================================================

  DatabaseSubnetGroup:

    Description: CloudMart RDS Subnet Group

    Value:
      !Ref RdsSubnetGroup

    Export:
      Name: !Sub cloudmart-database-subnet-group-${EnvironmentName}


  # ==============================================================
  # REPORTS BUCKET
  # ==============================================================

  ReportsBucket:

    Description: S3 bucket used for CloudMart daily reports

    Value:
      !Ref ReportsBucket

    Export:
      Name: !Sub cloudmart-reports-bucket-${EnvironmentName}


  # ==============================================================
  # REPORTS BUCKET ARN
  # ==============================================================

  ReportsBucketArn:

    Description: ARN of the CloudMart reports bucket

    Value:
      !GetAtt ReportsBucket.Arn

    Export:
      Name: !Sub cloudmart-reports-bucket-arn-${EnvironmentName}


  # ==============================================================
  # LAMBDA ARTIFACTS BUCKET
  # ==============================================================

  LambdaBucket:

    Description: S3 bucket used for Lambda deployment packages

    Value:
      !Ref LambdaArtifactsBucket

    Export:
      Name: !Sub cloudmart-lambda-bucket-${EnvironmentName}


  # ==============================================================
  # LAMBDA ARTIFACTS BUCKET ARN
  # ==============================================================

  LambdaBucketArn:

    Description: ARN of the CloudMart Lambda deployment packages bucket

    Value:
      !GetAtt LambdaArtifactsBucket.Arn

    Export:
      Name: !Sub cloudmart-lambda-bucket-arn-${EnvironmentName}
