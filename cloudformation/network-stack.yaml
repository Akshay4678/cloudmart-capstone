AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Network Stack


# ================================================================
# PARAMETERS
# ================================================================

Parameters:

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: CloudMart deployment environment

  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16
    Description: CloudMart VPC CIDR block




  DashboardIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to access the dashboard

  SSHIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to SSH to the dashboard EC2 instance



  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 AMI


# ================================================================
# RESOURCES
# ================================================================

Resources:


  # ================================================================
  # VPC
  # ================================================================

  CloudMartVPC:
    Type: AWS::EC2::VPC

    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true

      Tags:
        - Key: Name
          Value: !Sub cloudmart-vpc-${EnvironmentName}


  # ================================================================
  # INTERNET GATEWAY
  # ================================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway

    Properties:
      Tags:
        - Key: Name
          Value: !Sub cloudmart-igw-${EnvironmentName}


  # ================================================================
  # INTERNET GATEWAY ATTACHMENT
  # ================================================================

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment

    Properties:
      VpcId: !Ref CloudMartVPC
      InternetGatewayId: !Ref InternetGateway


  # ================================================================
  # PUBLIC SUBNET
  # EC2 DASHBOARD
  # ================================================================

  PublicSubnet:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true

      AvailabilityZone: !Select
        - 0
        - !GetAZs ''

      Tags:
        - Key: Name
          Value: !Sub cloudmart-public-subnet-${EnvironmentName}


  # ================================================================
  # PRIVATE APPLICATION SUBNET
  # LAMBDA FUNCTIONS
  # ================================================================

  PrivateSubnet:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: 10.0.2.0/24

      AvailabilityZone: !Select
        - 0
        - !GetAZs ''

      Tags:
        - Key: Name
          Value: !Sub cloudmart-private-app-subnet-${EnvironmentName}


  # ================================================================
  # SECOND PRIVATE SUBNET
  # RDS / VPC ENDPOINTS
  # ================================================================

  PrivateSubnet2:
    Type: AWS::EC2::Subnet

    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: 10.0.3.0/24

      AvailabilityZone: !Select
        - 1
        - !GetAZs ''

      Tags:
        - Key: Name
          Value: !Sub cloudmart-private-db-subnet-${EnvironmentName}


  # ================================================================
  # PUBLIC ROUTE TABLE
  # ================================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:
      VpcId: !Ref CloudMartVPC

      Tags:
        - Key: Name
          Value: !Sub cloudmart-public-route-table-${EnvironmentName}


  # ================================================================
  # PUBLIC DEFAULT ROUTE
  # ================================================================

  PublicRoute:
    Type: AWS::EC2::Route

    DependsOn: AttachGateway

    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway


  # ================================================================
  # PUBLIC SUBNET ASSOCIATION
  # ================================================================

  PublicSubnetAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet


  # ================================================================
  # PRIVATE ROUTE TABLE
  # ================================================================

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:
      VpcId: !Ref CloudMartVPC

      Tags:
        - Key: Name
          Value: !Sub cloudmart-private-route-table-${EnvironmentName}


  # ================================================================
  # PRIVATE SUBNET ASSOCIATION
  # ================================================================

  PrivateSubnetAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet


  # ================================================================
  # SECOND PRIVATE SUBNET ASSOCIATION
  # ================================================================

  PrivateSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet2


  # ================================================================
  # SECURITY GROUP - LAMBDA
  # ================================================================

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: CloudMart Lambda security group
      VpcId: !Ref CloudMartVPC

      # No default outbound rules.
      # Required outbound rules are defined separately below.
      SecurityGroupEgress: []

      Tags:
        - Key: Name
          Value: !Sub cloudmart-lambda-sg-${EnvironmentName}


  # ================================================================
  # SECURITY GROUP - VPC ENDPOINTS
  # ================================================================

  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: CloudMart VPC endpoint security group
      VpcId: !Ref CloudMartVPC

      # No default outbound rules.
      SecurityGroupEgress: []

      Tags:
        - Key: Name
          Value: !Sub cloudmart-vpc-${EnvironmentName}-endpoints-sg


  # ================================================================
  # SECURITY GROUP - RDS
  # ================================================================

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: CloudMart RDS MySQL security group
      VpcId: !Ref CloudMartVPC

      # No default inbound rules.
      # RDS access is defined separately below.
      # No default outbound rules.
      SecurityGroupEgress: []

      Tags:
        - Key: Name
          Value: !Sub cloudmart-rds-sg-${EnvironmentName}


  # ================================================================
  # SECURITY GROUP - EC2 DASHBOARD
  # ================================================================

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:
      GroupDescription: CloudMart EC2 dashboard security group
      VpcId: !Ref CloudMartVPC

      # No default outbound rules.
      # Required outbound rules are defined separately below.
      SecurityGroupEgress: []

      Tags:
        - Key: Name
          Value: !Sub cloudmart-ec2-sg-${EnvironmentName}


  # ================================================================
  # LAMBDA -> RDS
  # TCP 3306
  # ================================================================

  LambdaToRDSEgress:
    Type: AWS::EC2::SecurityGroupEgress

    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      DestinationSecurityGroupId: !Ref RDSSecurityGroup


  # ================================================================
  # LAMBDA -> VPC ENDPOINTS
  # TCP 443
  # ================================================================

  LambdaToVPCEndpointEgress:
    Type: AWS::EC2::SecurityGroupEgress

    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref VPCEndpointSecurityGroup


  # ================================================================
  # LAMBDA -> HTTPS
  # TCP 443
  # Required for AWS service access including S3.
  #
  # S3 is configured as a Gateway Endpoint below. The route table
  # determines that S3 traffic uses the Gateway Endpoint.
  # ================================================================

  LambdaToHTTPS:
    Type: AWS::EC2::SecurityGroupEgress

    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0


  # ================================================================
  # RDS <- LAMBDA
  # TCP 3306
  # ================================================================

  RDSFromLambdaIngress:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref RDSSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref LambdaSecurityGroup


  # ================================================================
  # RDS <- EC2
  # TCP 3306
  # ================================================================

  RDSFromEC2Ingress:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref RDSSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref EC2SecurityGroup


  # ================================================================
  # EC2 -> RDS
  # TCP 3306
  # ================================================================

  EC2ToRDSEgress:
    Type: AWS::EC2::SecurityGroupEgress

    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      DestinationSecurityGroupId: !Ref RDSSecurityGroup


  # ================================================================
  # EC2 -> DNS
  # UDP 53
  # ================================================================

  EC2ToDNSUDP:
    Type: AWS::EC2::SecurityGroupEgress

    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: udp
      FromPort: 53
      ToPort: 53
      CidrIp: 0.0.0.0/0


  # ================================================================
  # EC2 -> DNS
  # TCP 53
  # ================================================================

  EC2ToDNSTCP:
    Type: AWS::EC2::SecurityGroupEgress

    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 53
      ToPort: 53
      CidrIp: 0.0.0.0/0


  # ================================================================
  # EC2 -> INTERNET
  # HTTPS 443
  # ================================================================

  EC2ToInternetHTTPS:
    Type: AWS::EC2::SecurityGroupEgress

    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0


  # ================================================================
  # VPC ENDPOINTS <- LAMBDA
  # HTTPS 443
  # ================================================================

  VPCEndpointFromLambdaIngress:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref VPCEndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref LambdaSecurityGroup

  # ================================================================
  # VPC ENDPOINTS <- EC2 DASHBOARD
  # HTTPS 443
  # Required for EC2 dashboard -> SSM Parameter Store
  # ================================================================

  VPCEndpointFromEC2Ingress:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref VPCEndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref EC2SecurityGroup


  # ================================================================
  # EC2 DASHBOARD
  # HTTP 80
  # NGINX REVERSE PROXY -> FLASK 5000
  # ================================================================

  EC2HttpIngress:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: !Ref DashboardIngressCidr


  # ================================================================
  # EC2 SSH ACCESS
  # TCP 22
  # No key pair is required by this CloudFormation template.
  # EC2 Instance Connect can be used from the AWS Console.
  # ================================================================

  EC2SSHIngress:
    Type: AWS::EC2::SecurityGroupIngress

    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: !Ref SSHIngressCidr


  # ================================================================
  # EC2 INSTANCE ROLE
  # ================================================================

  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

      Policies:
        - PolicyName: CloudMartDashboardAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadDatabaseParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${EnvironmentName}/database/password

              - Sid: ReadReportsBucketParameter
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${EnvironmentName}/reports-bucket

              - Sid: ReadLambdaArtifactBucketParameter
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${EnvironmentName}/lambda-artifact-bucket

              - Sid: ReadCloudWatchMetrics
                Effect: Allow
                Action:
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                Resource: "*"

              - Sid: DescribeRDSInstances
                Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                Resource: "*"


  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2InstanceRole


  # ================================================================
  # EC2 DASHBOARD INSTANCE
  # ================================================================

  CloudMartEC2V3:
    Type: AWS::EC2::Instance

    DependsOn:
      - AttachGateway
      - PublicRoute
      - PublicSubnetAssociation

    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete

    Properties:

      AvailabilityZone: !Select
        - 0
        - !GetAZs ''

      ImageId: !Ref LatestAmiId

      InstanceType: t3.micro

      IamInstanceProfile: !Ref EC2InstanceProfile

      SubnetId: !Ref PublicSubnet

      SecurityGroupIds:
        - !Ref EC2SecurityGroup

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -u

          exec > >(tee -a /var/log/cloudmart-dashboard-userdata.log | logger -t cloudmart-userdata -s 2>/dev/console) 2>&1

          AWS_REGION_VALUE="${AWS::Region}"
          LAMBDA_BUCKET_PARAMETER="/cloudmart/${EnvironmentName}/lambda-artifact-bucket"
          DASHBOARD_KEY="dashboard/cloudmart-dashboard.zip"
          DB_HOST_CONFIG_KEY="dashboard/db-host.txt"
          DASHBOARD_DIR="/opt/cloudmart-dashboard"
          ZIP_FILE="/tmp/cloudmart-dashboard.zip"
          STATE_FILE="/var/lib/cloudmart-dashboard-state"
          TMP_STATE_FILE="/tmp/cloudmart-dashboard-state.new"

          echo "=================================================="
          echo "Starting CloudMart Dashboard Bootstrap"
          echo "=================================================="

          # ============================================================
          # LOW-MEMORY EC2 PROTECTION
          # ============================================================
          # t3.micro has limited RAM. Create 1 GB swap automatically.
          # This is infrastructure bootstrap, not a manual installation.

          if ! swapon --show | grep -q "/swapfile"; then
            if [ ! -f /swapfile ]; then
              dd if=/dev/zero of=/swapfile bs=1M count=1024 status=none
              chmod 600 /swapfile
              mkswap /swapfile
            fi
            swapon /swapfile
          fi

          if ! grep -q "^/swapfile " /etc/fstab; then
            echo "/swapfile swap swap defaults 0 0" >> /etc/fstab
          fi

          echo "Memory after swap setup:"
          free -h

          # Use disk-backed temporary storage instead of the small /tmp tmpfs.
          mkdir -p /var/tmp/cloudmart-pip
          chmod 1777 /var/tmp/cloudmart-pip
          export TMPDIR=/var/tmp/cloudmart-pip

          # ============================================================
          # SYSTEM PACKAGES
          # ============================================================

          echo "Installing required system packages..."

          dnf install -y --allowerasing \
            python3 \
            python3-pip \
            unzip \
            openssl \
            nginx \
            amazon-ssm-agent

          systemctl enable --now amazon-ssm-agent || true

          command -v aws
          command -v python3
          command -v nginx

          mkdir -p "$DASHBOARD_DIR"
          mkdir -p "$(dirname "$STATE_FILE")"

          # ============================================================
          # NGINX CONFIGURATION
          # NGINX IS STARTED ONLY AFTER GUNICORN IS HEALTHY.
          # ============================================================

          rm -f /etc/nginx/conf.d/default.conf

          cat > /etc/nginx/conf.d/cloudmart.conf <<'NGINXEOF'
          server {
              listen 80;
              listen [::]:80;

              server_name _;

              client_max_body_size 10M;

              location / {
                  proxy_pass http://127.0.0.1:5000;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NGINXEOF

          # Replace the Amazon Linux default server configuration so there is
          # only one server listening on port 80.
          cat > /etc/nginx/nginx.conf <<'NGINXCONFEOF'
          user nginx;
          worker_processes auto;
          error_log /var/log/nginx/error.log notice;
          pid /run/nginx.pid;

          events {
              worker_connections 1024;
          }

          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                              '$status $body_bytes_sent "$http_referer" '
                              '"$http_user_agent" "$http_x_forwarded_for"';
              access_log /var/log/nginx/access.log main;
              sendfile on;
              keepalive_timeout 65;
              include /etc/nginx/conf.d/*.conf;
          }
          NGINXCONFEOF

          nginx -t

          echo "NGINX configuration validated successfully."

          # ============================================================
          # READ LAMBDA ARTIFACT BUCKET FROM SSM
          # ============================================================

          echo "Reading Lambda artifact bucket from SSM..."

          LAMBDA_BUCKET_VALUE=$(aws ssm get-parameter \
            --region "$AWS_REGION_VALUE" \
            --name "$LAMBDA_BUCKET_PARAMETER" \
            --query "Parameter.Value" \
            --output text 2>/dev/null || true)

          if [ -z "$LAMBDA_BUCKET_VALUE" ] || [ "$LAMBDA_BUCKET_VALUE" = "None" ]; then
            echo "Lambda artifact bucket parameter is not available yet."
          else
            echo "Lambda artifact bucket: $LAMBDA_BUCKET_VALUE"
          fi

          # ============================================================
          # WAIT FOR DASHBOARD ARTIFACTS
          # GitHub Actions uploads these after the infrastructure exists.
          # No separate dashboard .sh file is created.
          # ============================================================

          ARTIFACT_ETAG=""
          DB_CONFIG_ETAG=""

          for attempt in $(seq 1 120); do

            if [ -z "$LAMBDA_BUCKET_VALUE" ] || [ "$LAMBDA_BUCKET_VALUE" = "None" ]; then
              LAMBDA_BUCKET_VALUE=$(aws ssm get-parameter \
                --region "$AWS_REGION_VALUE" \
                --name "$LAMBDA_BUCKET_PARAMETER" \
                --query "Parameter.Value" \
                --output text 2>/dev/null || true)
            fi

            if [ -n "$LAMBDA_BUCKET_VALUE" ] && [ "$LAMBDA_BUCKET_VALUE" != "None" ]; then

              ARTIFACT_ETAG=$(aws s3api head-object \
                --region "$AWS_REGION_VALUE" \
                --bucket "$LAMBDA_BUCKET_VALUE" \
                --key "$DASHBOARD_KEY" \
                --query "ETag" \
                --output text 2>/dev/null || true)

              DB_CONFIG_ETAG=$(aws s3api head-object \
                --region "$AWS_REGION_VALUE" \
                --bucket "$LAMBDA_BUCKET_VALUE" \
                --key "$DB_HOST_CONFIG_KEY" \
                --query "ETag" \
                --output text 2>/dev/null || true)

              if [ -n "$ARTIFACT_ETAG" ] && [ "$ARTIFACT_ETAG" != "None" ] \
                 && [ -n "$DB_CONFIG_ETAG" ] && [ "$DB_CONFIG_ETAG" != "None" ]; then
                echo "Dashboard artifacts are available."
                break
              fi
            fi

            echo "Waiting for dashboard artifacts... attempt $attempt/120"
            sleep 5

            if [ "$attempt" -eq 120 ]; then
              echo "ERROR: Dashboard artifacts were not available."
              exit 1
            fi
          done

          # ============================================================
          # SKIP ONLY IF THE CURRENT DEPLOYMENT IS ALREADY HEALTHY
          # ============================================================

          if [ -f "$STATE_FILE" ] \
             && grep -q "^ARTIFACT_ETAG=$ARTIFACT_ETAG$" "$STATE_FILE" 2>/dev/null \
             && grep -q "^DB_CONFIG_ETAG=$DB_CONFIG_ETAG$" "$STATE_FILE" 2>/dev/null \
             && systemctl is-active --quiet cloudmart-dashboard; then

            echo "Dashboard is already deployed and healthy."

            if systemctl is-active --quiet nginx; then
              echo "NGINX is already active."
              exit 0
            fi

            echo "NGINX is not active. Starting NGINX..."
            nginx -t
            systemctl enable nginx
            systemctl restart nginx

            if systemctl is-active --quiet nginx; then
              echo "NGINX is ACTIVE."
              exit 0
            fi

            echo "ERROR: NGINX failed to start."
            systemctl status nginx --no-pager || true
            journalctl -u nginx --no-pager -n 100 || true
            exit 1
          fi

          # ============================================================
          # READ DATABASE HOST
          # ============================================================

          echo "Reading dashboard database host..."

          DB_HOST_VALUE=$(aws s3 cp \
            "s3://$LAMBDA_BUCKET_VALUE/$DB_HOST_CONFIG_KEY" \
            - \
            --region "$AWS_REGION_VALUE")

          DB_HOST_VALUE=$(printf '%s' "$DB_HOST_VALUE" | tr -d '\r\n')

          if [ -z "$DB_HOST_VALUE" ]; then
            echo "ERROR: Database host configuration is empty."
            exit 1
          fi

          # ============================================================
          # READ REPORTS BUCKET
          # ============================================================

          REPORTS_BUCKET_VALUE=$(aws ssm get-parameter \
            --region "$AWS_REGION_VALUE" \
            --name "/cloudmart/${EnvironmentName}/reports-bucket" \
            --query "Parameter.Value" \
            --output text 2>/dev/null || true)

          if [ -z "$REPORTS_BUCKET_VALUE" ] || [ "$REPORTS_BUCKET_VALUE" = "None" ]; then
            echo "ERROR: Reports bucket parameter is unavailable."
            exit 1
          fi

          # ============================================================
          # DOWNLOAD DASHBOARD PACKAGE
          # ============================================================

          echo "Downloading dashboard package..."

          rm -f "$ZIP_FILE"

          aws s3 cp \
            "s3://$LAMBDA_BUCKET_VALUE/$DASHBOARD_KEY" \
            "$ZIP_FILE" \
            --region "$AWS_REGION_VALUE"

          test -s "$ZIP_FILE"

          echo "Dashboard package downloaded successfully."

          # ============================================================
          # EXTRACT DASHBOARD
          # ============================================================

          rm -rf "$DASHBOARD_DIR"
          mkdir -p "$DASHBOARD_DIR"

          unzip -o "$ZIP_FILE" -d "$DASHBOARD_DIR"
          rm -f "$ZIP_FILE"

          test -s "$DASHBOARD_DIR/app.py"
          test -s "$DASHBOARD_DIR/requirements.txt"

          echo "Dashboard files extracted successfully."

          # ============================================================
          # CREATE VIRTUAL ENVIRONMENT
          # ============================================================

          echo "Creating Python virtual environment..."

          python3 -m venv "$DASHBOARD_DIR/venv"

          test -x "$DASHBOARD_DIR/venv/bin/python"

          "$DASHBOARD_DIR/venv/bin/pip" install \
            --no-cache-dir \
            --disable-pip-version-check \
            -r "$DASHBOARD_DIR/requirements.txt"

          test -x "$DASHBOARD_DIR/venv/bin/gunicorn"

          echo "Gunicorn installed: $("$DASHBOARD_DIR/venv/bin/gunicorn" --version)"
          rm -rf /var/tmp/cloudmart-pip/* /tmp/pip-* 2>/dev/null || true

          # ============================================================
          # VALIDATE PYTHON
          # ============================================================

          "$DASHBOARD_DIR/venv/bin/python" \
            -m py_compile "$DASHBOARD_DIR/app.py"

          echo "app.py syntax validation successful."

          # ============================================================
          # DASHBOARD ENVIRONMENT
          # ============================================================

          cat > /etc/cloudmart-dashboard.env <<ENVEOF
          AWS_REGION=$AWS_REGION_VALUE
          ENVIRONMENT=${EnvironmentName}
          API_NAME=cloudmart-api-${EnvironmentName}
          API_STAGE=${EnvironmentName}
          REPORTS_BUCKET=$REPORTS_BUCKET_VALUE
          DB_HOST=$DB_HOST_VALUE
          DB_NAME=cloudmart
          DB_USER=cloudmartadmin
          DB_PORT=3306
          DB_PASSWORD_PARAMETER=/cloudmart/${EnvironmentName}/database/password
          REPORTS_BUCKET_PARAMETER=/cloudmart/${EnvironmentName}/reports-bucket
          ENVEOF

          chown root:root /etc/cloudmart-dashboard.env
          chmod 600 /etc/cloudmart-dashboard.env

          # ============================================================
          # GUNICORN SERVICE
          # FOLLOWING THE WORKING FRIEND CODE:
          # - User=root
          # - localhost:5000
          # - restart automatically
          # ============================================================

          cat > /etc/systemd/system/cloudmart-dashboard.service <<'SERVICEEOF'
          [Unit]
          Description=CloudMart Flask Dashboard
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=root
          WorkingDirectory=/opt/cloudmart-dashboard
          EnvironmentFile=/etc/cloudmart-dashboard.env
          ExecStart=/opt/cloudmart-dashboard/venv/bin/gunicorn \
            --workers 2 \
            --bind 127.0.0.1:5000 \
            --access-logfile - \
            --error-logfile - \
            app:app
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICEEOF

          systemctl daemon-reload

          # ============================================================
          # START GUNICORN FIRST
          # ============================================================

          echo "Starting CloudMart Gunicorn..."

          systemctl enable cloudmart-dashboard
          systemctl restart cloudmart-dashboard

          sleep 5

          if ! systemctl is-active --quiet cloudmart-dashboard; then
            echo "ERROR: Gunicorn service failed to start."
            systemctl status cloudmart-dashboard --no-pager || true
            journalctl -u cloudmart-dashboard --no-pager -n 100 || true
            exit 1
          fi

          echo "Gunicorn service is ACTIVE."

          # ============================================================
          # GUNICORN HEALTH CHECK
          # ============================================================

          for attempt in $(seq 1 12); do

            if python3 -c \
              'import urllib.request; urllib.request.urlopen("http://127.0.0.1:5000/health", timeout=5)' >/dev/null 2>&1; then

              echo "Gunicorn /health check passed."
              break
            fi

            echo "Waiting for Gunicorn health... attempt $attempt/12"
            sleep 5

            if [ "$attempt" -eq 12 ]; then
              echo "ERROR: Gunicorn started but /health is not responding."
              systemctl status cloudmart-dashboard --no-pager || true
              journalctl -u cloudmart-dashboard --no-pager -n 100 || true
              exit 1
            fi
          done

          # ============================================================
          # START NGINX ONLY AFTER GUNICORN IS HEALTHY
          # ============================================================

          echo "Starting NGINX..."

          nginx -t
          systemctl enable nginx
          systemctl restart nginx

          if ! systemctl is-active --quiet nginx; then
            echo "ERROR: NGINX failed to start."
            systemctl status nginx --no-pager || true
            journalctl -u nginx --no-pager -n 100 || true
            exit 1
          fi

          echo "NGINX is ACTIVE."

          # Save deployment state ONLY after Gunicorn and NGINX are healthy.
          printf 'ARTIFACT_ETAG=%s\nDB_CONFIG_ETAG=%s\nREPORTS_BUCKET=%s\n' \
            "$ARTIFACT_ETAG" "$DB_CONFIG_ETAG" "$REPORTS_BUCKET_VALUE" > "$TMP_STATE_FILE"

          mv "$TMP_STATE_FILE" "$STATE_FILE"

          echo "Dashboard deployment completed successfully."

          # ============================================================
          # FINAL STATUS CHECK
          # ============================================================

          if systemctl is-active --quiet cloudmart-dashboard; then
            echo "CloudMart Dashboard is ACTIVE."
          else
            echo "ERROR: CloudMart Dashboard is not active."
            systemctl status cloudmart-dashboard --no-pager || true
            journalctl -u cloudmart-dashboard --no-pager -n 100 || true
            exit 1
          fi

          if systemctl is-active --quiet nginx; then
            echo "NGINX is ACTIVE."
          else
            echo "ERROR: NGINX is not active."
            systemctl status nginx --no-pager || true
            journalctl -u nginx --no-pager -n 100 || true
            exit 1
          fi

          echo "=================================================="
          echo "CloudMart Dashboard Bootstrap Completed"
          echo "=================================================="
