AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart IAM Stack

# ================================================================
# PARAMETERS
# ================================================================

Parameters:

  EnvironmentName:
    Type: String
    Default: dev

    AllowedValues:
      - dev
      - prod


# ================================================================
# RESOURCES
# ================================================================

Resources:

  # ==============================================================
  # AUTHORIZER LAMBDA ROLE
  # ==============================================================

  AuthorizerLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-authorizer-role-${EnvironmentName}

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service: lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:

        - PolicyName: AuthorizerSSMPolicy

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Sid: ReadAuthToken

                Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${EnvironmentName}/auth/token


  # ==============================================================
  # PRODUCT LAMBDA ROLE
  # ==============================================================

  ProductLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-product-role-${EnvironmentName}

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service: lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:

        - PolicyName: ProductPolicy

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              # ==================================================
              # RDS
              # ==================================================

              - Sid: ConnectToRDS

                Effect: Allow

                Action:
                  - rds-db:connect

                Resource: "*"


              # ==================================================
              # EVENTBRIDGE
              # ==================================================

              - Sid: PublishInventoryEvents

                Effect: Allow

                Action:
                  - events:PutEvents

                Resource:
                  !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default


              # ==================================================
              # VPC NETWORK INTERFACES
              # ==================================================

              - Sid: ManageLambdaNetworkInterfaces

                Effect: Allow

                Action:

                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: "*"

                Condition:

                  StringEquals:

                    aws:RequestedRegion:
                      - !Ref AWS::Region


              # ==================================================
              # CLOUDWATCH CUSTOM METRICS
              # ==================================================

              - Sid: PublishProductMetrics

                Effect: Allow

                Action:
                  - cloudwatch:PutMetricData

                Resource: "*"

                Condition:

                  StringEquals:

                    cloudwatch:namespace:
                      - CloudMart/Application


  # ==============================================================
  # ORDER LAMBDA ROLE
  # ==============================================================

  OrderLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-order-role-${EnvironmentName}

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service: lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:

        - PolicyName: OrderPolicy

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              # ==================================================
              # RDS
              # ==================================================

              - Sid: ConnectToRDS

                Effect: Allow

                Action:
                  - rds-db:connect

                Resource: "*"


              # ==================================================
              # SQS
              # ==================================================

              - Sid: SendOrdersToQueue

                Effect: Allow

                Action:
                  - sqs:SendMessage

                Resource:
                  !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:cloudmart-orders-${EnvironmentName}


              # ==================================================
              # CLOUDWATCH METRICS
              # ==================================================

              - Sid: PublishOrderMetrics

                Effect: Allow

                Action:
                  - cloudwatch:PutMetricData

                Resource: "*"

                Condition:

                  StringEquals:

                    cloudwatch:namespace:
                      - CloudMart/Application


              # ==================================================
              # VPC NETWORK INTERFACES
              # ==================================================

              - Sid: ManageLambdaNetworkInterfaces

                Effect: Allow

                Action:

                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: "*"

                Condition:

                  StringEquals:

                    aws:RequestedRegion:
                      - !Ref AWS::Region


  # ==============================================================
  # ORDER PROCESSING LAMBDA ROLE
  # ==============================================================

  OrderProcessingLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-order-processing-role-${EnvironmentName}

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service: lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:

        - PolicyName: OrderProcessingPolicy

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              # ==================================================
              # SQS
              # ==================================================

              - Sid: ConsumeOrders

                Effect: Allow

                Action:

                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes

                Resource:
                  !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:cloudmart-orders-${EnvironmentName}


              # ==================================================
              # RDS
              # ==================================================

              - Sid: ConnectToRDS

                Effect: Allow

                Action:
                  - rds-db:connect

                Resource: "*"


              # ==================================================
              # EVENTBRIDGE
              # ==================================================

              - Sid: PublishOrderEvents

                Effect: Allow

                Action:
                  - events:PutEvents

                Resource:
                  !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default


              # ==================================================
              # CLOUDWATCH METRICS
              # ==================================================

              - Sid: PublishOrderProcessingMetrics

                Effect: Allow

                Action:
                  - cloudwatch:PutMetricData

                Resource: "*"

                Condition:

                  StringEquals:

                    cloudwatch:namespace:
                      - CloudMart/Application


              # ==================================================
              # VPC NETWORK INTERFACES
              # ==============================================================

              - Sid: ManageLambdaNetworkInterfaces

                Effect: Allow

                Action:

                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: "*"

                Condition:

                  StringEquals:

                    aws:RequestedRegion:
                      - !Ref AWS::Region


  # ==============================================================
  # REPORT LAMBDA ROLE
  # ==============================================================

  ReportLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-report-role-${EnvironmentName}

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service: lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:

        - PolicyName: ReportingPolicy

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              # ==================================================
              # RDS
              # ==================================================

              - Sid: ConnectToRDS

                Effect: Allow

                Action:
                  - rds-db:connect

                Resource: "*"


              # ==================================================
              # S3 OBJECT ACCESS
              # ==================================================

              - Sid: ReadWriteReports

                Effect: Allow

                Action:

                  - s3:GetObject
                  - s3:PutObject

                Resource:

                  Fn::Sub:

                    - ${ReportsBucketArn}/*

                    - ReportsBucketArn:
                        Fn::ImportValue:
                          cloudmart-reports-bucket-arn


              # ==================================================
              # S3 BUCKET ACCESS
              # ==================================================

              - Sid: ListReportsBucket

                Effect: Allow

                Action:
                  - s3:ListBucket

                Resource:
                  Fn::ImportValue:
                    cloudmart-reports-bucket-arn


              # ==================================================
              # VPC NETWORK INTERFACES
              # ==============================================================

              - Sid: ManageLambdaNetworkInterfaces

                Effect: Allow

                Action:

                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: "*"

                Condition:

                  StringEquals:

                    aws:RequestedRegion:
                      - !Ref AWS::Region


# ================================================================
# OUTPUTS
# ================================================================

Outputs:

  AuthorizerRoleArn:

    Value:
      !GetAtt AuthorizerLambdaRole.Arn

    Export:
      Name:
        cloudmart-authorizer-role-arn


  ProductRoleArn:

    Value:
      !GetAtt ProductLambdaRole.Arn

    Export:
      Name:
        cloudmart-product-role-arn


  OrderRoleArn:

    Value:
      !GetAtt OrderLambdaRole.Arn

    Export:
      Name:
        cloudmart-order-role-arn


  OrderProcessingRoleArn:

    Value:
      !GetAtt OrderProcessingLambdaRole.Arn

    Export:
      Name:
        cloudmart-order-processing-role-arn


  ReportRoleArn:

    Value:
      !GetAtt ReportLambdaRole.Arn

    Export:
      Name:
        cloudmart-report-role-arn