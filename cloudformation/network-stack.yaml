AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Network Stack

Parameters:

  VpcCIDR:

    Type: String

    Default: 10.0.0.0/16


Resources:

  CloudMartVPC:

    Type: AWS::EC2::VPC

    Properties:

      CidrBlock: !Ref VpcCIDR

      EnableDnsSupport: true

      EnableDnsHostnames: true

      Tags:

        - Key: Name

          Value: cloudmart-vpc


  InternetGateway:

    Type: AWS::EC2::InternetGateway


  AttachGateway:

    Type: AWS::EC2::VPCGatewayAttachment

    Properties:

      VpcId: !Ref CloudMartVPC

      InternetGatewayId: !Ref InternetGateway


  PublicSubnet:

    Type: AWS::EC2::Subnet

    Properties:

      VpcId: !Ref CloudMartVPC

      CidrBlock: 10.0.1.0/24

      MapPublicIpOnLaunch: true

      AvailabilityZone: !Select [0, !GetAZs '']

      Tags:

        - Key: Name

          Value: cloudmart-public-subnet


  PrivateSubnet:

    Type: AWS::EC2::Subnet

    Properties:

      VpcId: !Ref CloudMartVPC

      CidrBlock: 10.0.2.0/24

      AvailabilityZone: !Select [0, !GetAZs '']

      Tags:

        - Key: Name

          Value: cloudmart-private-subnet


  PrivateSubnet2:

    Type: AWS::EC2::Subnet

    Properties:

      VpcId: !Ref CloudMartVPC

      CidrBlock: 10.0.3.0/24

      AvailabilityZone: !Select [1, !GetAZs '']

      Tags:

        - Key: Name

          Value: cloudmart-private-subnet-2


  PublicRouteTable:

    Type: AWS::EC2::RouteTable

    Properties:

      VpcId: !Ref CloudMartVPC


  PublicRoute:

    Type: AWS::EC2::Route

    DependsOn: AttachGateway

    Properties:

      RouteTableId: !Ref PublicRouteTable

      DestinationCidrBlock: 0.0.0.0/0

      GatewayId: !Ref InternetGateway


  PublicSubnetAssociation:

    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:

      RouteTableId: !Ref PublicRouteTable

      SubnetId: !Ref PublicSubnet


  PrivateRouteTable:

    Type: AWS::EC2::RouteTable

    Properties:

      VpcId: !Ref CloudMartVPC


  PrivateSubnetAssociation:

    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:

      RouteTableId: !Ref PrivateRouteTable

      SubnetId: !Ref PrivateSubnet


  PrivateSubnet2Association:

    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:

      RouteTableId: !Ref PrivateRouteTable

      SubnetId: !Ref PrivateSubnet2


  LambdaSecurityGroup:

    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription: Lambda Security Group

      VpcId: !Ref CloudMartVPC

      SecurityGroupEgress:

        - IpProtocol: -1

          CidrIp: 0.0.0.0/0


  EventBridgeEndpointSecurityGroup:

    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription: Allow Lambda to access EventBridge VPC endpoint

      VpcId: !Ref CloudMartVPC

      SecurityGroupIngress:

        - IpProtocol: tcp

          FromPort: 443

          ToPort: 443

          SourceSecurityGroupId: !Ref LambdaSecurityGroup

      SecurityGroupEgress:

        - IpProtocol: -1

          CidrIp: 0.0.0.0/0


  EventBridgeVPCEndpoint:

    Type: AWS::EC2::VPCEndpoint

    Properties:

      VpcId: !Ref CloudMartVPC

      VpcEndpointType: Interface

      ServiceName: !Sub com.amazonaws.${AWS::Region}.events

      PrivateDnsEnabled: true

      SubnetIds:

        - !Ref PrivateSubnet

        - !Ref PrivateSubnet2

      SecurityGroupIds:

        - !Ref EventBridgeEndpointSecurityGroup


  RDSSecurityGroup:

    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription: RDS Security Group

      VpcId: !Ref CloudMartVPC

      SecurityGroupIngress:

        - IpProtocol: tcp

          FromPort: 3306

          ToPort: 3306

          SourceSecurityGroupId: !Ref LambdaSecurityGroup


  EC2SecurityGroup:

    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription: EC2 Dashboard Security Group

      VpcId: !Ref CloudMartVPC

      SecurityGroupIngress:

        - IpProtocol: tcp

          FromPort: 22

          ToPort: 22

          CidrIp: 0.0.0.0/0

        - IpProtocol: tcp

          FromPort: 5000

          ToPort: 5000

          CidrIp: 0.0.0.0/0


Outputs:

  VPCId:

    Value: !Ref CloudMartVPC

    Export:

      Name: cloudmart-vpc-id


  PublicSubnetId:

    Value: !Ref PublicSubnet

    Export:

      Name: cloudmart-public-subnet-id


  PrivateSubnetId:

    Value: !Ref PrivateSubnet

    Export:

      Name: cloudmart-private-subnet-id


  PrivateSubnet2Id:

    Value: !Ref PrivateSubnet2

    Export:

      Name: cloudmart-private-subnet-2-id


  LambdaSG:

    Value: !Ref LambdaSecurityGroup

    Export:

      Name: cloudmart-lambda-sg


  RDSSG:

    Value: !Ref RDSSecurityGroup

    Export:

      Name: cloudmart-rds-sg


  EC2SG:

    Value: !Ref EC2SecurityGroup

    Export:

      Name: cloudmart-ec2-sg


  EventBridgeEndpointSG:

    Value: !Ref EventBridgeEndpointSecurityGroup

    Export:

      Name: cloudmart-eventbridge-endpoint-sg


  EventBridgeEndpointId:

    Value: !Ref EventBridgeVPCEndpoint

    Export:

      Name: cloudmart-eventbridge-vpc-endpoint