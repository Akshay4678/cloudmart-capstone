AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart IAM Stack


# ================================================================
# PARAMETERS
# ================================================================

Parameters:

  EnvironmentName:
    Type: String
    Default: dev

    AllowedValues:
      - dev
      - prod

  MentorConsolePassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Initial console password for the CloudMart mentor IAM user


# ================================================================
# RESOURCES
# ================================================================

Resources:

  # ==============================================================
  # AUTHORIZER LAMBDA ROLE
  # ==============================================================

  AuthorizerLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-authorizer-role-${EnvironmentName}

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service: lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: LambdaBasicLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CreateLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource:
                  !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-authorizer-${EnvironmentName}
              - Sid: WriteAuthorizerLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-authorizer-${EnvironmentName}:*

        - PolicyName: AuthorizerRDSAndVPCAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Sid: ReadUserAuthToken
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${EnvironmentName}/auth/user-token

              - Sid: ReadAdminAuthToken
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${EnvironmentName}/auth/admin-token

              # ==================================================
              # VPC NETWORK INTERFACES
              # ==================================================

              - Sid: ManageLambdaNetworkInterfaces

                Effect: Allow

                Action:

                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: "*"

                Condition:
                  StringEquals:
                    ec2:SubnetID:
                      - Fn::ImportValue:
                          !Sub cloudmart-private-subnet-id-${EnvironmentName}
                      - Fn::ImportValue:
                          !Sub cloudmart-private-subnet-2-id-${EnvironmentName}


  # ==============================================================
  # PRODUCT LAMBDA ROLE
  # ==============================================================

  ProductLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-product-role-${EnvironmentName}

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service: lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: LambdaBasicLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CreateLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource:
                  !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-product-${EnvironmentName}
              - Sid: WriteLambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-product-${EnvironmentName}:*

        - PolicyName: ProductPolicy

          PolicyDocument:

            Version: '2012-10-17'

            Statement:
              - Sid: ReadDatabasePassword

                Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${EnvironmentName}/database/password


              # ==================================================
              # EVENTBRIDGE
              # ==================================================

              - Sid: PublishProductStockEvents

                Effect: Allow

                Action:
                  - events:PutEvents

                Resource:
                  !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default


              # ==================================================
              # VPC NETWORK INTERFACES
              # ==================================================

              - Sid: ManageLambdaNetworkInterfaces

                Effect: Allow

                Action:

                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: "*"

                Condition:
                  StringEquals:
                    ec2:SubnetID:
                      - Fn::ImportValue:
                          !Sub cloudmart-private-subnet-id-${EnvironmentName}
                      - Fn::ImportValue:
                          !Sub cloudmart-private-subnet-2-id-${EnvironmentName}


              # ==================================================
              # CLOUDWATCH CUSTOM METRICS
              # ==================================================

              - Sid: PublishProductMetrics

                Effect: Allow

                Action:
                  - cloudwatch:PutMetricData

                Resource: "*"

                Condition:

                  StringEquals:

                    cloudwatch:namespace:
                      - CloudMart/Application


  # ==============================================================
  # ORDER LAMBDA ROLE
  # ==============================================================

  OrderLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-order-role-${EnvironmentName}

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service: lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: LambdaBasicLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CreateLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource:
                  !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-order-${EnvironmentName}
              - Sid: WriteLambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-order-${EnvironmentName}:*

        - PolicyName: OrderPolicy

          PolicyDocument:

            Version: '2012-10-17'

            Statement:
              - Sid: ReadDatabasePassword

                Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${EnvironmentName}/database/password


              # ==================================================
              # SQS
              # ==============================================================

              - Sid: SendOrdersToQueue

                Effect: Allow

                Action:
                  - sqs:SendMessage

                Resource:
                  !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:cloudmart-orders-${EnvironmentName}


              # ==================================================
              # CLOUDWATCH METRICS
              # ==============================================================

              - Sid: PublishOrderMetrics

                Effect: Allow

                Action:
                  - cloudwatch:PutMetricData

                Resource: "*"

                Condition:

                  StringEquals:

                    cloudwatch:namespace:
                      - CloudMart/Application


              # ==================================================
              # VPC NETWORK INTERFACES
              # ==============================================================

              - Sid: ManageLambdaNetworkInterfaces

                Effect: Allow

                Action:

                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: "*"

                Condition:
                  StringEquals:
                    ec2:SubnetID:
                      - Fn::ImportValue:
                          !Sub cloudmart-private-subnet-id-${EnvironmentName}
                      - Fn::ImportValue:
                          !Sub cloudmart-private-subnet-2-id-${EnvironmentName}


  # ==============================================================
  # ORDER PROCESSING LAMBDA ROLE
  # ==============================================================

  OrderProcessingLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-order-processing-role-${EnvironmentName}

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service: lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: LambdaBasicLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CreateLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource:
                  !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-order-processor-${EnvironmentName}
              - Sid: WriteLambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-order-processor-${EnvironmentName}:*

        - PolicyName: OrderProcessingPolicy

          PolicyDocument:

            Version: '2012-10-17'

            Statement:
              - Sid: ReadDatabasePassword

                Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${EnvironmentName}/database/password



              # ==================================================
              # SQS
              # ==================================================

              - Sid: ConsumeOrders

                Effect: Allow

                Action:

                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes

                Resource:
                  !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:cloudmart-orders-${EnvironmentName}


              # ==================================================
              # EVENTBRIDGE
              # ==================================================

              - Sid: PublishOrderEvents

                Effect: Allow

                Action:
                  - events:PutEvents

                Resource:
                  !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default


              # ==================================================
              # CLOUDWATCH METRICS
              # ==================================================

              - Sid: PublishOrderProcessingMetrics

                Effect: Allow

                Action:
                  - cloudwatch:PutMetricData

                Resource: "*"

                Condition:

                  StringEquals:

                    cloudwatch:namespace:
                      - CloudMart/Application


              # ==================================================
              # VPC NETWORK INTERFACES
              # ==================================================

              - Sid: ManageLambdaNetworkInterfaces

                Effect: Allow

                Action:

                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: "*"

                Condition:
                  StringEquals:
                    ec2:SubnetID:
                      - Fn::ImportValue:
                          !Sub cloudmart-private-subnet-id-${EnvironmentName}
                      - Fn::ImportValue:
                          !Sub cloudmart-private-subnet-2-id-${EnvironmentName}


  # ==============================================================
  # REPORT LAMBDA ROLE
  # ==============================================================

  ReportLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-report-role-${EnvironmentName}

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service: lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: LambdaBasicLogging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CreateLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource:
                  !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-report-${EnvironmentName}
              - Sid: WriteLambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-report-${EnvironmentName}:*

        - PolicyName: ReportingPolicy

          PolicyDocument:

            Version: '2012-10-17'

            Statement:
              - Sid: ReadDatabasePassword

                Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${EnvironmentName}/database/password


              # ==================================================
              # S3 OBJECT ACCESS
              # ==================================================

              - Sid: ReadWriteReports

                Effect: Allow

                Action:

                  - s3:GetObject
                  - s3:PutObject

                Resource:

                  Fn::Sub:

                    - ${ReportsBucketArn}/*

                    - ReportsBucketArn:
                        Fn::ImportValue:
                          !Sub cloudmart-reports-bucket-arn-${EnvironmentName}


              # ==================================================
              # S3 BUCKET ACCESS
              # ==================================================

              - Sid: ListReportsBucket

                Effect: Allow

                Action:
                  - s3:ListBucket

                Resource:
                  Fn::ImportValue:
                    !Sub cloudmart-reports-bucket-arn-${EnvironmentName}


              # ==================================================
              # VPC NETWORK INTERFACES
              # ==================================================

              - Sid: ManageLambdaNetworkInterfaces

                Effect: Allow

                Action:

                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: "*"

                Condition:
                  StringEquals:
                    ec2:SubnetID:
                      - Fn::ImportValue:
                          !Sub cloudmart-private-subnet-id-${EnvironmentName}
                      - Fn::ImportValue:
                          !Sub cloudmart-private-subnet-2-id-${EnvironmentName}


  # ==============================================================
  # MENTOR READ-ONLY GROUP
  # ==============================================================

  MentorReadOnlyGroup:
    Type: AWS::IAM::Group

    Properties:
      GroupName: !Sub cloudmart-mentor-readonly-${EnvironmentName}
      Policies:
        - PolicyName: !Sub cloudmart-mentor-readonly-${EnvironmentName}
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadCloudMartServices
                Effect: Allow
                Action:
                  - apigateway:GET
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStacks
                  - cloudformation:ListStackResources
                  - ec2:DescribeInstances
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                  - ec2:DescribeRouteTables
                  - ec2:DescribeVpcEndpoints
                  - ec2:DescribeNetworkInterfaces
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetPolicy
                  - lambda:ListFunctions
                  - lambda:ListEventSourceMappings
                  - lambda:ListTags
                  - lambda:ListAliases
                  - lambda:ListVersionsByFunction
                  - rds:DescribeDBInstances
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - s3:GetBucketLocation
                  - s3:ListAllMyBuckets
                  - s3:ListBucket
                  - s3:GetObject
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sns:GetTopicAttributes
                  - sns:ListSubscriptionsByTopic
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:DescribeAlarmHistory
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:GetDashboard
                  - cloudwatch:ListMetrics
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                  - iam:GetUser
                  - iam:ListMFADevices
                  - iam:GetLoginProfile
                Resource: "*"


  # ==============================================================
  # MENTOR IAM USER
  # ==============================================================

  MentorUser:
    Type: AWS::IAM::User

    Properties:
      UserName: !Sub cloudmart-mentor-${EnvironmentName}
      Groups:
        - !Ref MentorReadOnlyGroup
      LoginProfile:
        Password: !Ref MentorConsolePassword
        PasswordResetRequired: true
      Tags:
        - Key: Application
          Value: CloudMart
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Purpose
          Value: MentorAccess


# ================================================================
# OUTPUTS
# ================================================================

Outputs:

  # ==============================================================
  # AUTHORIZER ROLE
  # ==============================================================

  AuthorizerRoleArn:

    Description: CloudMart Authorizer Lambda IAM Role ARN

    Value:
      !GetAtt AuthorizerLambdaRole.Arn

    Export:
      Name:
        !Sub cloudmart-authorizer-role-arn-${EnvironmentName}


  # ==============================================================
  # PRODUCT ROLE
  # ==============================================================

  ProductRoleArn:

    Description: CloudMart Product Lambda IAM Role ARN

    Value:
      !GetAtt ProductLambdaRole.Arn

    Export:
      Name:
        !Sub cloudmart-product-role-arn-${EnvironmentName}


  # ==============================================================
  # ORDER ROLE
  # ==============================================================

  OrderRoleArn:

    Description: CloudMart Order Lambda IAM Role ARN

    Value:
      !GetAtt OrderLambdaRole.Arn

    Export:
      Name:
        !Sub cloudmart-order-role-arn-${EnvironmentName}


  # ==============================================================
  # ORDER PROCESSING ROLE
  # ==============================================================

  OrderProcessingRoleArn:

    Description: CloudMart Order Processing Lambda IAM Role ARN

    Value:
      !GetAtt OrderProcessingLambdaRole.Arn

    Export:
      Name:
        !Sub cloudmart-order-processing-role-arn-${EnvironmentName}


  # ==============================================================
  # REPORT ROLE
  # ==============================================================

  ReportRoleArn:

    Description: CloudMart Report Lambda IAM Role ARN

    Value:
      !GetAtt ReportLambdaRole.Arn

    Export:
      Name:
        !Sub cloudmart-report-role-arn-${EnvironmentName}
