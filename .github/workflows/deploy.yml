name: Deploy CloudMart Infrastructure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      #################################################
      # CHECKOUT
      #################################################

      - name: Checkout Repository
        uses: actions/checkout@v4


      #################################################
      # AWS CREDENTIALS
      #################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1


      #################################################
      # VERIFY AWS ACCESS
      #################################################

      - name: Verify AWS Access
        run: |
          aws sts get-caller-identity


      #################################################
      # INSTALL CFN-LINT
      #################################################

      - name: Install cfn-lint
        run: |
          pip install cfn-lint


      #################################################
      # VALIDATE NETWORK STACK
      #################################################

      - name: Validate Network Stack
        run: |
          cfn-lint --non-zero-exit-code error \
            cloudformation/network-stack.yaml

      - name: CloudFormation Validate Network Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml


      #################################################
      # VALIDATE DATA STACK
      #################################################

      - name: Print Data Stack File
        run: |
          cat cloudformation/data-stack.yaml

      - name: CloudFormation Validate Data Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml


      #################################################
      # VALIDATE IAM STACK
      #################################################

      - name: CloudFormation Validate IAM Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml


      #################################################
      # VALIDATE API STACK
      #################################################

      - name: Validate API Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/api-stack.yaml


      #################################################
      # DEPLOY NETWORK STACK
      #################################################

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --stack-name cloudmart-network-stack \
            --template-file cloudformation/network-stack.yaml \
            --capabilities CAPABILITY_NAMED_IAM


      #################################################
      # DEPLOY DATA STACK
      #################################################

      - name: Deploy Data Stack
        run: |
          aws cloudformation deploy \
            --stack-name cloudmart-data-stack \
            --template-file cloudformation/data-stack.yaml \
            --parameter-overrides \
              "DBPassword=${{ secrets.DB_PASSWORD }}"


      #################################################
      # SHOW DATA STACK ERRORS
      #################################################

      - name: Show Data Stack Errors
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name cloudmart-data-stack \
            --query "StackEvents[?contains(ResourceStatus,'FAILED')].[LogicalResourceId,ResourceStatusReason]" \
            --output table


      #################################################
      # DEPLOY IAM STACK
      #################################################

      - name: Deploy IAM Stack
        run: |
          aws cloudformation deploy \
            --stack-name cloudmart-iam-stack \
            --template-file cloudformation/iam-stack.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              "DBUsername=cloudmartadmin" \
              "DBPassword=${{ secrets.DB_PASSWORD }}" \
              "AuthToken=${{ secrets.AUTH_TOKEN }}"


      #################################################
      # DEPLOY AUTH STACK
      #################################################

      - name: Deploy Auth Stack
        run: |
          aws cloudformation deploy \
            --stack-name cloudmart-auth-stack \
            --template-file cloudformation/auth-stack.yaml \
            --capabilities CAPABILITY_NAMED_IAM


      #################################################
      # PACKAGE PRODUCT LAMBDA
      #################################################

      - name: Package Product Lambda
        run: |
          rm -rf build
          mkdir -p build/product

          cp lambda/product/index.py build/product/index.py

          pip install \
            -r lambda/product/requirements.txt \
            -t build/product

          cd build/product

          zip -r ../product-lambda-${{ github.sha }}.zip .


      #################################################
      # GET LAMBDA ARTIFACT BUCKET
      #################################################

      - name: Get Lambda Artifact Bucket
        id: lambda_bucket
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-stack \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaBucket'].OutputValue" \
            --output text)

          echo "Lambda bucket: $BUCKET"

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"


      #################################################
      # UPLOAD PRODUCT LAMBDA
      #################################################

      - name: Upload Product Lambda
        run: |
          aws s3 cp \
            "build/product-lambda-${{ github.sha }}.zip" \
            "s3://${{ steps.lambda_bucket.outputs.bucket }}/product/product-lambda-${{ github.sha }}.zip"


      #################################################
      # DEPLOY API STACK
      #################################################

      - name: Deploy API Stack
        run: |
          aws cloudformation deploy \
            --stack-name cloudmart-api-stack \
            --template-file cloudformation/api-stack.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              "DBPassword=${{ secrets.DB_PASSWORD }}" \
              "CodeVersion=${{ github.sha }}"


      #################################################
      # CHECK API STACK STATUS
      #################################################

      - name: Check API Stack Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-api-stack


      #################################################
      # CHECK NETWORK STACK STATUS
      #################################################

      - name: Check Network Stack Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-network-stack


      #################################################
      # CHECK DATA STACK STATUS
      #################################################

      - name: Check Data Stack Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-data-stack


      #################################################
      # CHECK IAM STACK STATUS
      #################################################

      - name: Check IAM Stack Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-stack