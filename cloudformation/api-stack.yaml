AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart API Stack

Resources:

  #################################################
  # PRODUCT LAMBDA
  #################################################

  ProductLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloudmart-product
      Runtime: python3.13
      Handler: index.lambda_handler

      Role:
        Fn::ImportValue: cloudmart-product-role-arn

      Timeout: 15

      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: cloudmart-private-subnet-id
          - Fn::ImportValue: cloudmart-private-subnet-2-id
        SecurityGroupIds:
          - Fn::ImportValue: cloudmart-lambda-sg

      Environment:
        Variables:
          DB_HOST: cloudmart-data-stack-cloudmartdatabase-zjxdxen8ubpj.chyoy06e4uh2.ap-south-1.rds.amazonaws.com
          DB_NAME: cloudmart
          DB_USER: cloudmartadmin
          DB_PASSWORD: Akshay123
          DB_PORT: "3306"

      Code:
        ZipFile: |
          import json
          import os
          import pymysql
          import boto3

          events_client = boto3.client("events")

          DB_HOST = os.environ["DB_HOST"]
          DB_NAME = os.environ["DB_NAME"]
          DB_USER = os.environ["DB_USER"]
          DB_PASSWORD = os.environ["DB_PASSWORD"]
          DB_PORT = int(os.environ.get("DB_PORT", "3306"))


          def get_connection():
              return pymysql.connect(
                  host=DB_HOST,
                  user=DB_USER,
                  password=DB_PASSWORD,
                  database=DB_NAME,
                  port=DB_PORT,
                  connect_timeout=10,
                  cursorclass=pymysql.cursors.DictCursor
              )


          def response(status_code, body):
              return {
                  "statusCode": status_code,
                  "headers": {
                      "Content-Type": "application/json",
                      "Access-Control-Allow-Origin": "*"
                  },
                  "body": json.dumps(body, default=str)
              }


          # =========================================================
          # PUBLISH INVENTORY CHANGE EVENT
          # =========================================================

          def publish_inventory_event(product_id, stock_count):

              event_detail = {
                  "product_id": int(product_id),
                  "stock_count": int(stock_count)
              }

              result = events_client.put_events(
                  Entries=[
                      {
                          "Source": "cloudmart.inventory",
                          "DetailType": "InventoryChanged",
                          "Detail": json.dumps(event_detail)
                      }
                  ]
              )

              print("EventBridge result:", json.dumps(result))


          def lambda_handler(event, context):

              print("========== LAMBDA START ==========")
              print("Event:", json.dumps(event))

              connection = None

              try:

                  http_method = event.get("httpMethod", "GET")
                  path_parameters = event.get("pathParameters") or {}
                  product_id = path_parameters.get("id")

                  print("HTTP Method:", http_method)
                  print("Product ID:", product_id)

                  # =========================================================
                  # GET /products/{id}
                  # =========================================================

                  if http_method == "GET" and product_id:

                      connection = get_connection()

                      with connection.cursor() as cursor:

                          cursor.execute(
                              "SELECT * FROM products WHERE product_id = %s",
                              (product_id,)
                          )

                          product = cursor.fetchone()

                      if not product:
                          return response(
                              404,
                              {
                                  "message": "Product not found"
                              }
                          )

                      return response(
                          200,
                          {
                              "message": "Product retrieved successfully",
                              "product": product
                          }
                      )

                  # =========================================================
                  # GET /products
                  # =========================================================

                  if http_method == "GET":

                      connection = get_connection()

                      with connection.cursor() as cursor:

                          cursor.execute(
                              "SELECT * FROM products"
                          )

                          products = cursor.fetchall()

                      return response(
                          200,
                          {
                              "message": "Products retrieved successfully",
                              "count": len(products),
                              "products": products
                          }
                      )

                  # =========================================================
                  # POST /products
                  # =========================================================

                  if http_method == "POST":

                      body = event.get("body")

                      if not body:
                          return response(
                              400,
                              {
                                  "message": "Request body is required"
                              }
                          )

                      try:
                          data = json.loads(body)
                      except json.JSONDecodeError:
                          return response(
                              400,
                              {
                                  "message": "Invalid JSON body"
                              }
                          )

                      name = data.get("name")
                      description = data.get("description")
                      price = data.get("price")
                      stock_count = data.get("stock_count")

                      if not name or price is None or stock_count is None:
                          return response(
                              400,
                              {
                                  "message": "name, price and stock_count are required"
                              }
                          )

                      connection = get_connection()

                      with connection.cursor() as cursor:

                          cursor.execute(
                              """
                              INSERT INTO products
                              (name, description, price, stock_count)
                              VALUES (%s, %s, %s, %s)
                              """,
                              (
                                  name,
                                  description,
                                  price,
                                  stock_count
                              )
                          )

                          new_product_id = cursor.lastrowid

                      connection.commit()

                      # Publish inventory event
                      publish_inventory_event(
                          new_product_id,
                          stock_count
                      )

                      return response(
                          201,
                          {
                              "message": "Product created successfully",
                              "product_id": new_product_id
                          }
                      )

                  # =========================================================
                  # PUT /products/{id}
                  # =========================================================

                  if http_method == "PUT" and product_id:

                      body = event.get("body")

                      if not body:
                          return response(
                              400,
                              {
                                  "message": "Request body is required"
                              }
                          )

                      try:
                          data = json.loads(body)
                      except json.JSONDecodeError:
                          return response(
                              400,
                              {
                                  "message": "Invalid JSON body"
                              }
                          )

                      name = data.get("name")
                      description = data.get("description")
                      price = data.get("price")
                      stock_count = data.get("stock_count")

                      if not name or price is None or stock_count is None:
                          return response(
                              400,
                              {
                                  "message": "name, price and stock_count are required"
                              }
                          )

                      connection = get_connection()

                      with connection.cursor() as cursor:

                          cursor.execute(
                              """
                              UPDATE products
                              SET
                                  name = %s,
                                  description = %s,
                                  price = %s,
                                  stock_count = %s
                              WHERE product_id = %s
                              """,
                              (
                                  name,
                                  description,
                                  price,
                                  stock_count,
                                  product_id
                              )
                          )

                          affected_rows = cursor.rowcount

                      connection.commit()

                      if affected_rows == 0:
                          return response(
                              404,
                              {
                                  "message": "Product not found"
                              }
                          )

                      # Publish inventory event
                      publish_inventory_event(
                          product_id,
                          stock_count
                      )

                      return response(
                          200,
                          {
                              "message": "Product updated successfully",
                              "product_id": int(product_id)
                          }
                      )

                  # =========================================================
                  # DELETE /products/{id}
                  # =========================================================

                  if http_method == "DELETE" and product_id:

                      connection = get_connection()

                      with connection.cursor() as cursor:

                          cursor.execute(
                              """
                              DELETE FROM products
                              WHERE product_id = %s
                              """,
                              (product_id,)
                          )

                          affected_rows = cursor.rowcount

                      connection.commit()

                      if affected_rows == 0:
                          return response(
                              404,
                              {
                                  "message": "Product not found"
                              }
                          )

                      return response(
                          200,
                          {
                              "message": "Product deleted successfully",
                              "product_id": int(product_id)
                          }
                      )

                  # =========================================================
                  # INVALID REQUEST
                  # =========================================================

                  return response(
                      405,
                      {
                          "message": "Method not allowed"
                      }
                  )

              except Exception as e:

                  print("========== ERROR ==========")
                  print("ERROR TYPE:", type(e).__name__)
                  print("ERROR MESSAGE:", str(e))

                  if connection:
                      try:
                          connection.rollback()
                      except Exception:
                          pass

                  return response(
                      500,
                      {
                          "message": "Internal server error",
                          "error": str(e)
                      }
                  )

              finally:

                  if connection:
                      try:
                          connection.close()
                          print("RDS connection closed")
                      except Exception:
                          pass


  #################################################
  # SNS LOW STOCK ALERT
  #################################################

  LowStockTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: cloudmart-low-stock-alerts


  LowStockEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref LowStockTopic
      Protocol: email
      Endpoint: uppu4678@gmail.com


  #################################################
  # EVENTBRIDGE LOW STOCK RULE
  #################################################

  InventoryLowStockRule:
    Type: AWS::Events::Rule
    Properties:
      Name: cloudmart-inventory-low-stock-rule

      Description: Send SNS alert when product stock is low

      EventPattern:
        source:
          - cloudmart.inventory

        detail-type:
          - InventoryChanged

        detail:
          stock_count:
            - numeric:
                - "<="
                - 5

      State: ENABLED

      Targets:
        - Arn: !Ref LowStockTopic
          Id: LowStockSNSTarget


  #################################################
  # SNS TOPIC POLICY
  #################################################

  LowStockTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:

      Topics:
        - !Ref LowStockTopic

      PolicyDocument:
        Version: "2012-10-17"

        Statement:

          - Sid: AllowEventBridgePublish

            Effect: Allow

            Principal:
              Service: events.amazonaws.com

            Action:
              - sns:Publish

            Resource: !Ref LowStockTopic

            Condition:
              ArnEquals:
                aws:SourceArn:
                  !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/cloudmart-inventory-low-stock-rule


  #################################################
  # API GATEWAY
  #################################################

  CloudMartApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: cloudmart-api


  #################################################
  # AUTHORIZER
  #################################################

  CloudMartAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: cloudmart-authorizer
      RestApiId: !Ref CloudMartApi
      Type: TOKEN
      IdentitySource: method.request.header.Authorization
      AuthorizerResultTtlInSeconds: 0

      AuthorizerUri:
        Fn::Sub:
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
          - AuthorizerArn:
              Fn::ImportValue: cloudmart-authorizer-lambda-arn


  #################################################
  # /products
  #################################################

  ProductsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !GetAtt CloudMartApi.RootResourceId
      PathPart: products


  ProductsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  ProductsPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductsResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  #################################################
  # /products/{id}
  #################################################

  ProductIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !Ref ProductsResource
      PathPart: "{id}"


  ProductIdGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  ProductIdPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  ProductIdDeleteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
            - LambdaArn: !GetAtt ProductLambda.Arn


  #################################################
  # LAMBDA PERMISSION
  #################################################

  AuthorizerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction

      FunctionName:
        Fn::ImportValue: cloudmart-authorizer-lambda-arn

      Principal: apigateway.amazonaws.com

      SourceArn:
        !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartApi}/*/*


  ProductLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction

      FunctionName: !Ref ProductLambda

      Principal: apigateway.amazonaws.com

      SourceArn:
        !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartApi}/*/*


  #################################################
  # API DEPLOYMENT
  #################################################

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment

    DependsOn:
      - ProductsGetMethod
      - ProductsPostMethod
      - ProductIdGetMethod
      - ProductIdPutMethod
      - ProductIdDeleteMethod

    Properties:
      RestApiId: !Ref CloudMartApi


  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref CloudMartApi
      DeploymentId: !Ref ApiDeployment
      StageName: prod


Outputs:

  ApiId:
    Value: !Ref CloudMartApi
    Export:
      Name: cloudmart-api-id


  ApiInvokeUrl:
    Value: !Sub https://${CloudMartApi}.execute-api.${AWS::Region}.amazonaws.com/prod


  ProductLambdaArn:
    Value: !GetAtt ProductLambda.Arn
    Export:
      Name: cloudmart-product-lambda-arn