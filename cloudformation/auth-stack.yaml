AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Authentication Stack

Resources:

  AuthorizerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cloudmart-authorizer

      Runtime: python3.13

      Handler: index.lambda_handler

      Role:
        Fn::ImportValue: cloudmart-authorizer-role-arn

      Timeout: 10

      Code:
        ZipFile: |
          import boto3

          def lambda_handler(event, context):

              print("========== AUTHORIZER START ==========")
              print("Event:", event)

              token = event.get("authorizationToken", "")
              method_arn = event.get("methodArn", "")

              print("Received token:", token)

              ssm = boto3.client("ssm")

              try:
                  secret = ssm.get_parameter(
                      Name="/cloudmart/auth/token"
                  )["Parameter"]["Value"]

                  print("Successfully retrieved token from SSM")

                  if token == secret:

                      print("TOKEN VALID - ALLOW")

                      return {
                          "principalId": "cloudmart-user",
                          "policyDocument": {
                              "Version": "2012-10-17",
                              "Statement": [
                                  {
                                      "Action": "execute-api:Invoke",
                                      "Effect": "Allow",
                                      "Resource": method_arn
                                  }
                              ]
                          },
                          "context": {
                              "user": "cloudmart-user"
                          }
                      }

                  print("TOKEN INVALID - DENY")

                  return {
                      "principalId": "cloudmart-user",
                      "policyDocument": {
                          "Version": "2012-10-17",
                          "Statement": [
                              {
                                  "Action": "execute-api:Invoke",
                                  "Effect": "Deny",
                                  "Resource": method_arn
                              }
                          ]
                      }
                  }

              except Exception as e:

                  print("========== AUTHORIZER ERROR ==========")
                  print("ERROR:", str(e))

                  raise

  AuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthorizerLambda
      Principal: apigateway.amazonaws.com

Outputs:

  AuthorizerLambdaArn:
    Value: !GetAtt AuthorizerLambda.Arn
    Export:
      Name: cloudmart-authorizer-lambda-arn