AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart IAM Stack


#################################################
# PARAMETERS
#################################################

Parameters:

  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  DBUsername:
    Type: String
    Default: cloudmartadmin

  DBPassword:
    Type: String
    NoEcho: true

  AuthToken:
    Type: String
    NoEcho: true


#################################################
# RESOURCES
#################################################

Resources:


  #################################################
  # AUTHORIZER LAMBDA ROLE
  #################################################

  AuthorizerLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-authorizer-role-${EnvironmentName}

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:

        - PolicyName: AuthorizerSSMPolicy

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Sid: ReadAuthToken

                Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${EnvironmentName}/auth/token


  #################################################
  # PRODUCT LAMBDA ROLE
  #################################################

  ProductLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-product-role-${EnvironmentName}

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:

        - PolicyName: ProductPolicy

          PolicyDocument:

            Version: '2012-10-17'

            Statement:


              #################################################
              # RDS DESCRIBE
              #################################################

              - Sid: DescribeCloudMartDatabase

                Effect: Allow

                Action:
                  - rds:DescribeDBInstances

                Resource:
                  !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:cloudmart


              #################################################
              # EVENTBRIDGE
              #
              # Required when Product Lambda publishes
              # InventoryChanged events.
              #################################################

              - Sid: PublishInventoryEvents

                Effect: Allow

                Action:
                  - events:PutEvents

                Resource:
                  !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default


              #################################################
              # VPC NETWORK INTERFACES
              #
              # These EC2 actions do not support normal
              # resource-level restrictions.
              #################################################

              - Sid: ManageLambdaNetworkInterfaces

                Effect: Allow

                Action:

                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: "*"

                Condition:

                  StringEquals:

                    aws:RequestedRegion:
                      - !Ref AWS::Region


              #################################################
              # CLOUDWATCH CUSTOM METRICS
              #
              # PutMetricData requires Resource "*"
              # because CloudWatch does not support resource
              # ARNs for this action.
              #################################################

              - Sid: PublishProductMetrics

                Effect: Allow

                Action:
                  - cloudwatch:PutMetricData

                Resource: "*"

                Condition:

                  StringEquals:

                    cloudwatch:namespace:
                      - CloudMart/Application


  #################################################
  # ORDER LAMBDA ROLE
  #################################################

  OrderLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-order-role-${EnvironmentName}

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:

        - PolicyName: OrderPolicy

          PolicyDocument:

            Version: '2012-10-17'

            Statement:


              #################################################
              # DYNAMODB - ORDERS TABLE
              #################################################

              - Sid: ReadWriteOrders

                Effect: Allow

                Action:

                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem

                Resource:

                  - Fn::ImportValue: cloudmart-orders-table-arn

                  - !Sub
                      - ${OrdersTableArn}/index/customer_id-index
                      - OrdersTableArn:
                          Fn::ImportValue: cloudmart-orders-table-arn


              #################################################
              # SQS - SEND ONLY
              #################################################

              - Sid: SendOrdersToQueue

                Effect: Allow

                Action:
                  - sqs:SendMessage

                Resource:
                  !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:cloudmart-orders-${EnvironmentName}


              #################################################
              # CLOUDWATCH CUSTOM METRICS
              #################################################

              - Sid: PublishOrderMetrics

                Effect: Allow

                Action:
                  - cloudwatch:PutMetricData

                Resource: "*"

                Condition:

                  StringEquals:

                    cloudwatch:namespace:
                      - CloudMart/Application


              #################################################
              # VPC NETWORK INTERFACES
              #################################################

              - Sid: ManageLambdaNetworkInterfaces

                Effect: Allow

                Action:

                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: "*"

                Condition:

                  StringEquals:

                    aws:RequestedRegion:
                      - !Ref AWS::Region


  #################################################
  # ORDER PROCESSING LAMBDA ROLE
  #################################################

  OrderProcessingLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-order-processing-role-${EnvironmentName}

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:

        - PolicyName: OrderProcessingPolicy

          PolicyDocument:

            Version: '2012-10-17'

            Statement:


              #################################################
              # SQS - CONSUME ONLY
              #################################################

              - Sid: ConsumeOrders

                Effect: Allow

                Action:

                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes

                Resource:
                  !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:cloudmart-orders-${EnvironmentName}


              #################################################
              # DYNAMODB - READ ORDERS
              #################################################

              - Sid: ReadOrders

                Effect: Allow

                Action:
                  - dynamodb:GetItem

                Resource:
                  Fn::ImportValue: cloudmart-orders-table-arn


              #################################################
              # EVENTBRIDGE
              #################################################

              - Sid: PublishOrderEvents

                Effect: Allow

                Action:
                  - events:PutEvents

                Resource:
                  !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default


              #################################################
              # CLOUDWATCH CUSTOM METRICS
              #################################################

              - Sid: PublishOrderProcessingMetrics

                Effect: Allow

                Action:
                  - cloudwatch:PutMetricData

                Resource: "*"

                Condition:

                  StringEquals:

                    cloudwatch:namespace:
                      - CloudMart/Application


              #################################################
              # VPC NETWORK INTERFACES
              #################################################

              - Sid: ManageLambdaNetworkInterfaces

                Effect: Allow

                Action:

                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: "*"

                Condition:

                  StringEquals:

                    aws:RequestedRegion:
                      - !Ref AWS::Region


  #################################################
  # REPORTING LAMBDA ROLE
  #################################################

  ReportLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-report-role-${EnvironmentName}

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:

        - PolicyName: ReportingPolicy

          PolicyDocument:

            Version: '2012-10-17'

            Statement:


              #################################################
              # S3 - REPORTS BUCKET
              #################################################

              - Sid: ListReportsBucket

                Effect: Allow

                Action:
                  - s3:ListBucket

                Resource:

                  Fn::ImportValue:
                    cloudmart-reports-bucket-arn


              - Sid: ReadWriteReports

                Effect: Allow

                Action:

                  - s3:GetObject
                  - s3:PutObject

                Resource:

                  Fn::Sub:
                    - ${ReportsBucketArn}/*
                    - ReportsBucketArn:
                        Fn::ImportValue:
                          cloudmart-reports-bucket-arn


              #################################################
              # DYNAMODB - ORDERS
              #################################################

              - Sid: ReadOrdersForReports

                Effect: Allow

                Action:
                  - dynamodb:Scan
                  - dynamodb:GetItem

                Resource:
                  Fn::ImportValue: cloudmart-orders-table-arn


              #################################################
              # RDS DESCRIBE
              #################################################

              - Sid: DescribeCloudMartDatabase

                Effect: Allow

                Action:
                  - rds:DescribeDBInstances

                Resource:
                  !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:cloudmart


              #################################################
              # VPC NETWORK INTERFACES
              #################################################

              - Sid: ManageLambdaNetworkInterfaces

                Effect: Allow

                Action:

                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses

                Resource: "*"

                Condition:

                  StringEquals:

                    aws:RequestedRegion:
                      - !Ref AWS::Region


  #################################################
  # EVENTBRIDGE ROLE
  #################################################

  EventBridgeRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-eventbridge-role-${EnvironmentName}

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - events.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: EventBridgeSNSPolicy

          PolicyDocument:

            Version: '2012-10-17'

            Statement:


              #################################################
              # LOW STOCK SNS
              #################################################

              - Sid: PublishLowStockNotifications

                Effect: Allow

                Action:
                  - sns:Publish

                Resource:
                  !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:cloudmart-low-stock-alerts-${EnvironmentName}


              #################################################
              # ORDER CONFIRMATION SNS
              #################################################

              - Sid: PublishOrderConfirmations

                Effect: Allow

                Action:
                  - sns:Publish

                Resource:
                  !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:cloudmart-order-confirmations-${EnvironmentName}


              #################################################
              # ORDER FAILURE SNS
              #################################################

              - Sid: PublishOrderFailures

                Effect: Allow

                Action:
                  - sns:Publish

                Resource:
                  !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:cloudmart-order-processing-failures-${EnvironmentName}


#################################################
# OUTPUTS
#################################################

Outputs:


  #################################################
  # AUTHORIZER ROLE ARN
  #################################################

  AuthorizerRoleArn:

    Value:
      !GetAtt AuthorizerLambdaRole.Arn

    Export:
      Name:
        cloudmart-authorizer-role-arn


  #################################################
  # PRODUCT ROLE ARN
  #################################################

  ProductRoleArn:

    Value:
      !GetAtt ProductLambdaRole.Arn

    Export:
      Name:
        cloudmart-product-role-arn


  #################################################
  # ORDER ROLE ARN
  #################################################

  OrderRoleArn:

    Value:
      !GetAtt OrderLambdaRole.Arn

    Export:
      Name:
        cloudmart-order-role-arn


  #################################################
  # ORDER PROCESSING ROLE ARN
  #################################################

  OrderProcessingRoleArn:

    Value:
      !GetAtt OrderProcessingLambdaRole.Arn

    Export:
      Name:
        cloudmart-order-processing-role-arn


  #################################################
  # REPORT ROLE ARN
  #################################################

  ReportRoleArn:

    Value:
      !GetAtt ReportLambdaRole.Arn

    Export:
      Name:
        cloudmart-report-role-arn


  #################################################
  # EVENTBRIDGE ROLE ARN
  #################################################

  EventBridgeRoleArn:

    Value:
      !GetAtt EventBridgeRole.Arn

    Export:
      Name:
        cloudmart-eventbridge-role-arn