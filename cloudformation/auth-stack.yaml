AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Authentication Stack


# ================================================================
# PARAMETERS
# ================================================================

Parameters:

  EnvironmentName:
    Type: String
    Default: dev

    AllowedValues:
      - dev
      - prod

    Description: CloudMart deployment environment


  DBPassword:
    Type: String
    NoEcho: true

    Description: RDS database password used by the Lambda authorizer


  CodeVersion:
    Type: String

    Description: Version of the Authorizer Lambda deployment package


# ================================================================
# RESOURCES
# ================================================================

Resources:


  # ==============================================================
  # SSM - APPLICATION ENVIRONMENT
  #
  # Non-sensitive configuration
  # ==============================================================

  EnvironmentParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /cloudmart/${EnvironmentName}/app/environment

      Type: String

      Value:
        !Ref EnvironmentName

      Description:
        CloudMart application environment

      Tier:
        Standard

      Tags:

        Application:
          CloudMart

        Environment:
          !Ref EnvironmentName

        Purpose:
          ApplicationConfiguration


  # ==============================================================
  # LAMBDA AUTHORIZER
  # ==============================================================

  AuthorizerLambda:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub cloudmart-authorizer-${EnvironmentName}

      Runtime:
        python3.13

      Handler:
        index.lambda_handler

      Role:
        Fn::ImportValue: cloudmart-authorizer-role-arn

      Timeout:
        10

      MemorySize:
        256


      # ==========================================================
      # VPC CONFIGURATION
      # ==========================================================

      VpcConfig:

        SubnetIds:

          - Fn::ImportValue:
              cloudmart-private-subnet-id

          - Fn::ImportValue:
              cloudmart-private-subnet-2-id

        SecurityGroupIds:

          - Fn::ImportValue:
              cloudmart-lambda-sg


      # ==========================================================
      # ENVIRONMENT VARIABLES
      # ==========================================================

      Environment:

        Variables:

          DB_HOST:
            Fn::ImportValue:
              cloudmart-database-endpoint

          DB_NAME:
            Fn::ImportValue:
              cloudmart-database-name

          DB_USER:
            Fn::ImportValue:
              cloudmart-database-username

          DB_PASSWORD:
            !Ref DBPassword

          DB_PORT:
            "3306"

          APP_ENVIRONMENT:
            !Ref EnvironmentName


      # ==========================================================
      # LAMBDA DEPLOYMENT PACKAGE
      # ==========================================================

      Code:

        S3Bucket:
          Fn::ImportValue:
            cloudmart-lambda-bucket

        S3Key:
          !Sub auth/authorizer-lambda-${CodeVersion}.zip


  # ==============================================================
  # API GATEWAY -> AUTHORIZER LAMBDA PERMISSION
  # ==============================================================

  AuthorizerPermission:
    Type: AWS::Lambda::Permission

    Properties:

      Action:
        lambda:InvokeFunction

      FunctionName:
        !Ref AuthorizerLambda

      Principal:
        apigateway.amazonaws.com


# ================================================================
# OUTPUTS
# ================================================================

Outputs:


  # ==============================================================
  # AUTHORIZER LAMBDA ARN
  # ==============================================================

  AuthorizerLambdaArn:

    Description:
      CloudMart Authorizer Lambda ARN

    Value:
      !GetAtt AuthorizerLambda.Arn

    Export:

      Name:
        cloudmart-authorizer-lambda-arn


  # ==============================================================
  # AUTHORIZER LAMBDA NAME
  # ==============================================================

  AuthorizerLambdaName:

    Description:
      CloudMart Authorizer Lambda Name

    Value:
      !Ref AuthorizerLambda

    Export:

      Name:
        cloudmart-authorizer-lambda-name


  # ==============================================================
  # ENVIRONMENT PARAMETER NAME
  # ==============================================================

  EnvironmentParameterName:

    Description:
      SSM parameter containing the CloudMart environment

    Value:
      !Ref EnvironmentParameter

    Export:

      Name:
        cloudmart-environment-parameter